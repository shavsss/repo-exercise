* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--font); direction: rtl; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 var(--gutter) 48px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.side { position: sticky; top: 60px; display: grid; gap: 18px; }

      '<div class="meta">' + esc(it.tb.page) + ' · ' + esc(it.tb.ed) + '</div></div>';
    if (it.idea) s += '<div class="box idea"><h5>רעיון ל' + esc(it.idea.kind) + ': ' + esc(it.idea.t) + '</h5>' + esc(it.idea.pitch) +
      '<div class="meta">כ-' + it.idea.hours + ' שעות · ' + it.idea.uses.join(", ") + '</div></div>';
    if (it.cross) s += '<div class="cross">' + esc(it.cross[1]) + ' <button type="button" data-cross="' + it.cross[0] + '">עבור לשם</button></div>';
    return s;
  }

  function srcHTML(it) {
    return '<div class="src"><span>' + esc(it.src) + '</span><span class="lnk" title="בגיליון אמיתי: קישור שנשלף השבוע">קישור לדוגמה (לא פעיל)</span></div>';
  }

  function actsHTML(it) {
    var f = fb[it.id] || {};
    return '<div class="acts">' +
      '<button type="button" class="act" data-act="read" aria-pressed="' + !!f.read + '">' + (f.read ? "נקרא" : "סמן כנקרא") + '</button>' +
      '<button type="button" class="act" data-act="saved" aria-pressed="' + !!f.saved + '">שמור</button>' +
      '<button type="button" class="act" data-act="up" aria-pressed="' + (f.useful === 1) + '">מועיל</button>' +
      '<button type="button" class="act" data-act="down" aria-pressed="' + (f.useful === -1) + '">לא רלוונטי</button>' +
      '<button type="button" class="act" data-act="ask">שאל את המורה</button>' +
      '<button type="button" class="act" data-act="note">פתק להעמקה</button></div>';
  }

  function figureHTML(issue) {
    // A small, plainly schematic figure for the lead: not data.
    var eng = app === "eng";
    var path = "", pts = [];
    for (var i = 0; i <= 40; i++) {
      var x = i / 40 * 3;
      var y = eng ? Math.exp(-x) : 1 / (1 + Math.pow(x, 2));
      pts.push((20 + i * 6.5).toFixed(1) + "," + (100 - y * 80).toFixed(1));
    }
    path = pts.join(" ");
    var steps = eng ? [2, 3, 5, 4, 6, 3, 2, 2] : [3, 4, 6, 7, 8, 9, 9.5, 10];
    var bars = steps.map(function (v, k) { return '<rect x="' + (300 + k * 13) + '" y="' + (100 - v * 7) + '" width="9" height="' + (v * 7) + '" fill="currentColor" opacity=".55"/>'; }).join("");
    return '<figure><svg viewBox="0 0 420 120" role="img" aria-label="איור סכמטי לדוגמה" style="color:var(--accent)">' +
      '<line x1="20" y1="100" x2="285" y2="100" stroke="var(--line-strong)"/><line x1="20" y1="10" x2="20" y2="100" stroke="var(--line-strong)"/>' +
      '<polyline points="' + path + '" fill="none" stroke="currentColor" stroke-width="2"/>' +
      '<line x1="300" y1="100" x2="410" y2="100" stroke="var(--line-strong)"/>' + bars +
      '<text x="150" y="115" font-size="10" fill="var(--muted)" text-anchor="middle">' + (eng ? "שארית מול סדר (סכמה)" : "עלות מול שנה (סכמה)") + '</text>' +
      '<text x="355" y="115" font-size="10" fill="var(--muted)" text-anchor="middle">' + (eng ? "איברים לכל צעד" : "עלות מצטברת") + '</text></svg>' +
      '<figcaption>איור סכמטי, לא נתונים. בגיליון אמיתי: גרף שנבנה בפייתון מהנתונים שבמקור, עם הפניה.</figcaption></figure>';
  }

  function render() {
    var issue = ISSUES[app];
    document.documentElement.setAttribute("data-app", app);
    document.querySelectorAll(".seg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.app === app)); });
    $("#kicker").textContent = issue.kicker;
    $("#mastTitle").textContent = issue.title;
    $("#mastSub").textContent = issue.sub;
    $("#issueNo").innerHTML = "גיליון " + issue.no + " · נבנה <bdi>" + issue.built + "</bdi>";
    $("#issueWin").textContent = issue.win;
    $("#issueStats").textContent = issue.items.length + " ידיעות · " + issue.sections.length + " מדורים";
    var me = issue.me;
    $("#me").innerHTML = '<span>המצב שלך בקורס: <b>' + me.current + '</b> ' + esc(MOD[app][me.current] || (app === "eng" ? "גאומטריה אנליטית" : "")) + '</span><span>נלמדו <b>' + me.done + '</b> מודולים</span><span>הבאים: ' + me.next + '</span>';

    // section filters
    var sf = $("#secFilters"); sf.innerHTML = '<span class="lbl">מדור</span>';
    var all = [{ id: "all", t: "הכל" }].concat(issue.sections);
    all.forEach(function (s) {
      var cnt = s.id === "all" ? issue.items.length : issue.items.filter(function (i) { return i.sec === s.id; }).length;
      if (!cnt) return;
      var b = el("button", "fchip", esc(s.t) + '<span class="n">' + cnt + '</span>');
      b.type = "button"; b.setAttribute("aria-pressed", String(secFilter === s.id));
      b.onclick = function () { secFilter = s.id; render(); };
      sf.appendChild(b);
    });
    var rf = $("#relFilters"); rf.innerHTML = '<span class="lbl">קשר לקורס</span>';
    [["all", "הכל"], ["mine", "קשור למה שלמדתי"], ["soon", "מה שבדרך"], ["saved", "שמורים"]].forEach(function (r) {
      var b = el("button", "fchip", r[1]); b.type = "button"; b.setAttribute("aria-pressed", String(relFilter === r[0]));
      b.onclick = function () { relFilter = r[0]; render(); };
      rf.appendChild(b);
    });

    // paper
    var paper = $("#paper"); paper.innerHTML = "";
    var byId = {}; issue.items.forEach(function (i) { byId[i.id] = i; });
    var lead = byId[issue.lead];
    var any = false;
    if (lead && matches(lead)) { paper.appendChild(itemNode(lead, issue, true)); any = true; }
    var flow = el("div", "flow");
    issue.sections.forEach(function (s) {
      var its = issue.items.filter(function (i) { return i.sec === s.id && i.id !== issue.lead && matches(i); });
      if (!its.length) return;
      any = true;
      var sec = el("section", "section");
      sec.innerHTML = '<h3>' + esc(s.t) + '<span class="cnt">' + its.length + '</span></h3>';
      var cols = el("div", "cols");
      its.forEach(function (i) { cols.appendChild(itemNode(i, issue, false)); });
      sec.appendChild(cols);
      flow.appendChild(sec);
    });
    paper.appendChild(flow);
    if (!any) paper.appendChild(el("p", "empty", "אין ידיעות שמתאימות לסינון."));

    renderSide(issue, byId);
    var st = issue.stats;
    var drops = Object.keys(st.dropped).map(function (k) { return k + " " + st.dropped[k]; }).join(" · ");
    $("#foot").innerHTML = 'הגיליון נבנה בסשן ענן שבועי. כל ידיעה אמיתית: קישור שנשלף השבוע (סטטוס 200), ציטוט שנמצא בטקסט, ובדיקה של בודק עצמאי שראה רק את המקור. ידיעות שנפסלו: ' + esc(drops) + '. <b>כל התוכן בעמוד הזה הוא דוגמה.</b>';
  }

  function renderSide(issue, byId) {
    var side = $("#side"); side.innerHTML = "";
    var p1 = el("div", "panel");
    p1.innerHTML = '<h3>לקרוא ב-10 דקות <small>' + issue.picks.length + '</small></h3>';
    issue.picks.forEach(function (id) {
      var it = byId[id]; if (!it) return;
      var b = el("button", "pick", '<span class="min">' + (it.r10 || 8) + ' דק\' · ' + CERT[it.cert] + '</span><span class="h">' + esc(it.h) + '</span>');
      b.type = "button"; b.onclick = function () { jump(id); };
      p1.appendChild(b);
    });
    side.appendChild(p1);

    var tbs = issue.items.filter(function (i) { return i.tb; });
    var ideas = issue.items.filter(function (i) { return i.idea; });
    var p2 = el("div", "panel");
    p2.innerHTML = '<h3>בגיליון הזה</h3>';
    [["עדכונים לספר", tbs, "tb"], ["רעיונות לפרויקט ולמאמר", ideas, "idea"]].forEach(function (g) {
      if (!g[1].length) return;
      var hh = el("div", "", '<div style="font-size:12px;font-weight:600;color:var(--' + g[2] + ');margin:6px 0 2px">' + g[0] + '</div>');
      p2.appendChild(hh);
      g[1].forEach(function (it) {
        var label = g[2] === "tb" ? it.tb.book + ": " + it.tb.status : it.idea.t;
        var b = el("button", "pick", '<span class="h" style="font-size:13px">' + esc(label) + '</span>');
        b.type = "button"; b.onclick = function () { jump(it.id); };
        p2.appendChild(b);
      });
    });
    side.appendChild(p2);

    var st = issue.stats;
    var p3 = el("div", "panel");
    var rows = [["מועמדים", st.candidates], ["נקראו", st.fetched], ["אומתו", st.verified]];
    p3.innerHTML = '<h3>המסננת <small>דוגמה</small></h3><div class="funnel">' + rows.map(function (r) {
      return '<div class="row"><span>' + r[0] + '</span><span class="barx"><i style="width:' + Math.max(3, r[1] / st.candidates * 100) + '%"></i></span><span class="v">' + r[1] + '</span></div>';
    }).join("") + '</div><div class="drops">רק מה שעבר את כל הבדיקות נכנס לגיליון. גיליון דל עדיף על ריפוד.</div>';
    side.appendChild(p3);

    var p4 = el("div", "panel");
    p4.innerHTML = '<h3>מקרא</h3><div class="legend">' +
      ["learned", "current", "next", "later", "outside"].map(function (r) { return '<div><span class="chip ' + r + '"><span class="t">' + REL[r] + '</span></span></div>'; }).join("") +
      '</div><div class="tags" style="margin-top:10px">' + Object.keys(CERT).map(function (c) { return '<span class="tag c-' + c + '"><span class="dot"></span>' + CERT[c] + '</span>'; }).join("") + '</div>';
    side.appendChild(p4);

    var p5 = el("div", "panel");
    p5.innerHTML = '<h3>ארכיון <small>' + issue.archive.length + '</small></h3>';
    var ul = el("ul", "archive");
    issue.archive.forEach(function (a) {
      var li = el("li", a.no === issue.no ? "cur" : "");
      var b = el("button", "", '<span class="no">#' + a.no + '</span><span class="ah">' + esc(a.h) + '</span>');
      b.type = "button";
      b.onclick = function () { if (a.no === issue.no) { window.scrollTo({ top: 0, behavior: "smooth" }); } else { toast("בארכיון האמיתי ייפתח גיליון " + a.no + ". באב-הטיפוס יש גיליון אחד לכל מעבדה."); } };
      li.appendChild(b); ul.appendChild(li);
    });
    p5.appendChild(ul);
    side.appendChild(p5);
  }

  function jump(id) {
    secFilter = "all"; relFilter = "all"; render();
    var n = document.getElementById("it-" + id);
    if (n) { n.scrollIntoView({ behavior: "smooth", block: "start" }); n.style.transition = "background .6s"; n.style.background = "var(--accent-soft)"; setTimeout(function () { n.style.background = ""; }, 900); }
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.classList.contains("more")) {
      var b = t.previousElementSibling; var open = b.hidden; b.hidden = !open;
      t.textContent = open ? "סגור" : "קרא עוד"; t.setAttribute("aria-expanded", String(open)); return;
    }
    if (t.dataset.mod) { toast("בדף האמיתי: נפתח המודול " + t.dataset.mod + (MOD[app][t.dataset.mod] ? " (" + MOD[app][t.dataset.mod] + ")" : "") + "."); return; }
    if (t.dataset.cross) { app = t.dataset.cross; save("news:app", app); secFilter = "all"; relFilter = "all"; render(); window.scrollTo({ top: 0 }); toast("עברת לשבועון של " + (app === "eng" ? "גילואה" : "לנצ'סטר") + ". באפליקציה אמיתית: קישור לאפליקציה השנייה."); return; }
    var act = t.dataset.act; if (!act) return;
    var art = t.closest(".item, .lead"); var id = art.id.slice(3);
    var f = fb[id] || (fb[id] = {});
    if (act === "read") f.read = !f.read;
    else if (act === "saved") f.saved = !f.saved;
    else if (act === "up") f.useful = f.useful === 1 ? 0 : 1;
    else if (act === "down") f.useful = f.useful === -1 ? 0 : -1;
    else if (act === "ask") { toast("בדף האמיתי: נפתח לוח 'הסבר פשוט' עם תקציר הידיעה והציטוט, כי למורה בדף אין אינטרנט."); return; }
    else if (act === "note") { toast("בדף האמיתי: נוסף פתק 'להעמקה' למחברת השיעור, עם הקישור."); return; }
    save("news:fb", fb);
    if (act === "down" && f.useful === -1) toast("נרשם. הריצה של השבוע הבא תוריד את המשקל של מקור ותחום כזה, עד 20%.");
    render();
    var again = document.getElementById("it-" + id); if (again && again.querySelector('[data-act="' + act + '"]')) again.querySelector('[data-act="' + act + '"]').focus({ preventScroll: true });
  });

  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () { app = b.dataset.app; save("news:app", app); secFilter = "all"; relFilter = "all"; render(); });
  });

  var theme = load("news:theme", null);
  if (theme) document.documentElement.setAttribute("data-theme", theme);
  $("#themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme") ||
      (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var nx = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nx); save("news:theme", nx);
  });

  render();
})();
</script>
