<style>
/* Layout: the desk fills the screen; the open book sits in its middle, sized from the measure (about 68 characters
   a line), with a thin bar above (lab, theme, sound, variants) and the turning controls below.
   Every open decision of round 6 is a data-attribute on <html> (data-face, data-paper, data-turn, ...). */
:root {
  --desk: #e6ddcc;
  --desk-2: #d9d0be;
  --paper: #f7f1e6;
  --paper-edge: #e9e0cd;
  --paper-back: #f3ecdd;
  --ink: #22261d;
  --ink-soft: #4f4a3f;
  --muted: #6f675a;
  --rule: #d9cdb6;
  --accent: #1f4f8a;          /* lab accent: Gilua blueprint blue (Lanchester sets red below) */
  --accent-soft: #e3ebf4;
  --k-def: #3b3a9e;
  --k-formula: #1f5f9e;
  --k-keep: #44493a;
  --k-think: #a16207;
  --k-history: #6d3fa0;
  --k-erratum: #b91c1c;
  --k-l3: #2f6b5f;
  --amber: #8a6100;
  --amber-soft: #f6ead0;
  --slip: #fffbe8;
  --shadow-rgb: 40 30 15;
  --bar: rgb(255 255 255 / 55%);
  --f-body: "Frank Ruhl Libre", "David Libre", "Times New Roman", serif;
  --f-ui: "IBM Plex Sans Hebrew", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  --fs: 18.5px;
  color-scheme: light;
}
:root[data-lab="core"] { --accent: #b3261e; --accent-soft: #f3e0d9; }
:root[data-paper="lab"][data-lab="core"] { --paper: #f6efe3; --paper-back: #ece3d3; --desk: #e2d8c4; --desk-2: #d3c7ae; --ink: #22261d; --ink-soft: #44493a; }
:root[data-paper="lab"][data-lab="eng"] { --paper: #f7f8f5; --paper-back: #eceee8; --desk: #dfe3e0; --desk-2: #ced4d1; --ink: #1f2427; --ink-soft: #46505a; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #1b1b1a; --desk-2: #121213; --paper: #262624; --paper-edge: #3a3936; --paper-back: #242422;
    --ink: #dedad1; --ink-soft: #bdb7ab; --muted: #a9a397; --rule: #46443f;
    --accent: #8fb6e3; --accent-soft: #263445;
    --k-def: #b4b2f0; --k-formula: #8fbfe8; --k-keep: #c9c5bb; --k-think: #e2b55a; --k-history: #c9b0ef;
    --k-erratum: #ff8f84; --k-l3: #8fd0c0; --amber: #e6b85c; --amber-soft: #3a3020; --slip: #34332c;
    --shadow-rgb: 0 0 0; --bar: rgb(30 30 30 / 60%); color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-lab="core"] { --accent: #ff9a8a; --accent-soft: #3d2622; }
  :root:not([data-theme="light"])[data-dark="lamp"] { --desk: #121110; --desk-2: #0b0a09; --paper: #2a251e; --paper-back: #241f19; --paper-edge: #3d362c; --ink: #e4dac6; --rule: #514b41; }
  :root:not([data-theme="light"])[data-dark="ink"] { --desk: #0f1012; --desk-2: #08090a; --paper: #1d1e20; --paper-back: #18191b; --paper-edge: #2e2f32; --ink: #d4d0c6; --rule: #38393c; }
}
:root[data-theme="dark"] {
  --desk: #1b1b1a; --desk-2: #121213; --paper: #262624; --paper-edge: #3a3936; --paper-back: #242422;
  --ink: #dedad1; --ink-soft: #bdb7ab; --muted: #a9a397; --rule: #46443f;
  --accent: #8fb6e3; --accent-soft: #263445;
  --k-def: #b4b2f0; --k-formula: #8fbfe8; --k-keep: #c9c5bb; --k-think: #e2b55a; --k-history: #c9b0ef;
  --k-erratum: #ff8f84; --k-l3: #8fd0c0; --amber: #e6b85c; --amber-soft: #3a3020; --slip: #34332c;
  --shadow-rgb: 0 0 0; --bar: rgb(30 30 30 / 60%); color-scheme: dark;
}
:root[data-theme="dark"][data-lab="core"] { --accent: #ff9a8a; --accent-soft: #3d2622; }
:root[data-theme="dark"][data-dark="lamp"] { --desk: #121110; --desk-2: #0b0a09; --paper: #2a251e; --paper-back: #241f19; --paper-edge: #3d362c; --ink: #e4dac6; --rule: #514b41; }
:root[data-theme="dark"][data-dark="ink"] { --desk: #0f1012; --desk-2: #08090a; --paper: #1d1e20; --paper-back: #18191b; --paper-edge: #2e2f32; --ink: #d4d0c6; --rule: #38393c; }

:root[data-face="david"] { --f-body: "David Libre", "Frank Ruhl Libre", serif; }
:root[data-face="noto"] { --f-body: "Noto Serif Hebrew", "Frank Ruhl Libre", serif; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--desk); color: var(--ink); font-family: var(--f-ui); direction: rtl;
  display: flex; flex-direction: column; overflow: clip;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  font-size: 13px; color: var(--ink-soft); position: relative; z-index: 30;
}
.top h1 { font: 600 14px var(--f-ui); margin: 0; color: var(--ink); }
.top .sp { flex: 1; }
.chip { border: 1px solid var(--rule); background: var(--bar); padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--bar); }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.status { font: 500 11.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- desk and book ---------- */
#desk { flex: 1; position: relative; overflow: clip; display: grid; place-items: center; min-height: 0; perspective: 2600px; }
:root[data-light="lamp"] #desk { background: radial-gradient(70% 60% at 62% 28%, color-mix(in srgb, var(--paper) 22%, transparent), transparent 70%); }
:root[data-phone="1"] #desk { width: 400px; margin: 0 auto; border-inline: 1px dashed var(--rule); }
.book { position: relative; width: calc(var(--pw) * var(--pages)); height: var(--ph); transform-style: preserve-3d; }
/* the leaves under the open book: the read ones under the right page, the rest under the left */
.stack { position: absolute; top: 0; height: 100%; background: var(--paper-edge); border-radius: 3px; }
.stack.r { right: 0; width: var(--pw); box-shadow: var(--sr); }
.stack.l { left: 0; width: var(--pw); box-shadow: var(--sl); }
.page {
  position: absolute; top: 0; width: var(--pw); height: var(--ph); background: var(--paper); overflow: hidden;
  direction: rtl; color: var(--ink);
}
.page.R { right: 0; border-radius: 2px 6px 6px 2px; }
.page.L { left: 0; border-radius: 6px 2px 2px 6px; }
:root[data-pages="1"] .page.L, :root[data-pages="1"] .stack.r { display: none; }
:root[data-paper="fiber"] .page, :root[data-paper="fiber"] .face {
  background-image: var(--fiber); background-size: 220px 220px;
}
/* gutter light: a fixed shadow at the spine and a faint curve of the paper; nothing moves */
.page::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
:root[data-light="gutter"] .page.R::after, :root[data-light="lamp"] .page.R::after { background: linear-gradient(to left, transparent 82%, rgb(var(--shadow-rgb) / 7%) 96%, rgb(var(--shadow-rgb) / 16%)); }
:root[data-light="gutter"] .page.L::after, :root[data-light="lamp"] .page.L::after { background: linear-gradient(to right, transparent 82%, rgb(var(--shadow-rgb) / 7%) 96%, rgb(var(--shadow-rgb) / 16%)); }
:root[data-pages="1"][data-light] .page.R::after { background: linear-gradient(to left, transparent 90%, rgb(var(--shadow-rgb) / 9%)); }
.book-shadow { position: absolute; inset: 1% -1% -2.5%; border-radius: 10px; box-shadow: 0 24px 50px -18px rgb(var(--shadow-rgb) / 45%); pointer-events: none; }

/* ---------- the page's typography ---------- */
.content { position: absolute; top: var(--mt); height: var(--ch); width: var(--W); font-family: var(--f-body); font-size: var(--fs); line-height: 1.72; }
.page.R .content, .measure .content { right: var(--mo); }
.page.L .content { left: var(--mo); }
.runhead { position: absolute; top: calc(var(--mt) * 0.38); width: var(--W); display: flex; justify-content: space-between; gap: 12px; font: 500 11.5px var(--f-ui); letter-spacing: .02em; color: var(--muted); }
.page.R .runhead { right: var(--mo); } .page.L .runhead { left: var(--mo); }
:root[data-head="classic"] .runhead { border-bottom: 1px solid var(--rule); padding-bottom: 5px; }
.folio { position: absolute; bottom: calc(var(--mb) * 0.36); font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.page.R .folio { right: var(--mo); } .page.L .folio { left: var(--mo); }
:root[data-head="center"] .folio { right: auto !important; left: 50% !important; transform: translateX(-50%); }
:root[data-head="center"] .runhead { justify-content: center; }
:root[data-head="center"] .runhead .rh-b { display: none; }
.content p { margin: 0; text-align: justify; text-indent: 1.2em; hyphens: manual; text-wrap: pretty; word-spacing: .03em; }
:root[data-align="start"] .content p, :root[data-narrow="1"] .content p { text-align: start; }
:root[data-align="space"] .content p { text-indent: 0; margin-top: calc(var(--fs) * 1.72 * .5); }
:root[data-align="space"] .content p.cont { margin-top: 0; }
.content p.cont, .content .noind, .content h2 + p, .content h3 + p, .content .first { text-indent: 0; }
.content .opening .ow { font-weight: 700; font-size: 1.32em; letter-spacing: .01em; }
.content h1 { font-size: 1.62em; line-height: 1.22; margin: 0 0 .25em; text-wrap: balance; font-weight: 700; }
.content .sub { font: 500 .66em var(--f-ui); color: var(--muted); margin: 0 0 1.4em; letter-spacing: .02em; }
.content h2 { font-size: 1.16em; margin: .9em 0 .35em; line-height: 1.3; font-weight: 700; text-wrap: balance; }
.content h2 .sn { color: var(--accent); font-family: var(--f-mono); font-size: .78em; margin-inline-end: .45em; }
.content > :first-child { margin-top: 0 !important; }
.m { font-style: italic; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.content .eq { direction: ltr; display: flex; align-items: center; justify-content: center; gap: 1em; margin: .55em 0; font-size: 1.04em; position: relative; }
.content .eq .no { position: absolute; left: 0; font: 500 .7em var(--f-mono); color: var(--muted); }
.content .eq i { font-style: italic; }
.blk { margin: .7em 0; padding: .45em .8em .55em; position: relative; }
.blk .bt { display: block; font: 600 .62em var(--f-ui); letter-spacing: .05em; margin-bottom: .1em; }
.blk p { text-indent: 0 !important; }
/* three ranks (round 5): what to keep has a frame, what to do a strong side rule, context a quiet rule */
.b-def { border-inline-start: 3px solid var(--k-def); background: color-mix(in srgb, var(--k-def) 5%, transparent); } .b-def .bt { color: var(--k-def); }
.b-formula { border: 1px solid color-mix(in srgb, var(--k-formula) 45%, transparent); text-align: center; } .b-formula .bt { color: var(--k-formula); text-align: start; }
.b-keep { border: 1.5px solid var(--k-keep); } .b-keep .bt { color: var(--k-keep); } .b-keep ul { margin: .2em 0 0; padding-inline-start: 1.1em; } .b-keep li { margin: .1em 0; }
.b-history { border-inline-start: 1px solid color-mix(in srgb, var(--k-history) 55%, transparent); color: var(--ink-soft); font-size: .93em; } .b-history .bt { color: var(--k-history); }
.b-erratum { border-inline-start: 3px solid var(--k-erratum); font-size: .93em; } .b-erratum .bt { color: var(--k-erratum); }
.b-erratum q { font-style: italic; }
/* derivation: numbered steps, never split inside a step */
.deriv { margin: .6em 0; padding: 0; list-style: none; counter-reset: st; }
.deriv li { counter-increment: st; display: grid; grid-template-columns: 1.6em 1fr; gap: .35em; align-items: baseline; padding: .12em 0; }
.deriv li::before { content: counter(st); font: 500 .7em var(--f-mono); color: var(--accent); }
.deriv .ex { direction: ltr; text-align: center; font-size: 1.02em; }
.deriv .why { display: block; font: .7em var(--f-ui); color: var(--muted); text-align: right; direction: rtl; }
.deriv-h { font: 600 .62em var(--f-ui); color: var(--k-formula); letter-spacing: .05em; margin-top: .6em; }
.contmark { font: 500 .62em var(--f-ui); color: var(--muted); text-align: left; margin-top: .2em; }
/* think: on paper, ink check boxes */
.b-think { border: 1px solid color-mix(in srgb, var(--k-think) 55%, transparent); border-radius: 2px; }
.b-think .bt { color: var(--k-think); }
.conf { display: flex; flex-wrap: wrap; gap: .3em 1em; margin-top: .35em; font: .7em var(--f-ui); align-items: center; }
.conf .lbl { color: var(--muted); }
.ink { background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; gap: .35em; align-items: center; color: var(--ink); }
.ink { min-height: 28px; }
.ink .bx { width: 1.15em; height: 1.15em; border: 1.3px solid var(--ink-soft); border-radius: 2px; display: inline-grid; place-items: center; }
.ink[aria-pressed="true"] .bx::after { content: ""; width: .7em; height: .38em; border: solid var(--accent); border-width: 0 0 2px 2px; transform: rotate(-48deg) translate(1px, -1px); }
.ink.skip { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.ans { margin-top: .45em; font-size: .95em; }
.ans .at { font: 600 .66em var(--f-ui); color: var(--k-think); display: block; }
/* answer variant 1: a folded flap that keeps its place on the page */
.flap { position: relative; margin-top: .45em; }
.flap .ans { margin: 0; visibility: hidden; }
.flap .fold { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, var(--paper-back) 0 6px, color-mix(in srgb, var(--paper-back) 70%, var(--rule)) 6px 7px); border: 1px dashed var(--rule); display: grid; place-items: center; font: .66em var(--f-ui); color: var(--muted); transform-origin: top; }
.flap.open .ans { visibility: visible; }
.flap.open .fold { transform: rotateX(-180deg); opacity: 0; transition: transform .45s cubic-bezier(.3,.6,.3,1), opacity .2s .25s; }
:root[data-motion="reduce"] .flap.open .fold { transition: opacity .12s; transform: none; }
/* answer variant 3: in the outer margin */
.mans { position: absolute; width: calc(var(--mo) - 18px); font: 12px/1.5 var(--f-ui); color: var(--ink-soft); }
.page.R .mans { right: 9px; } .page.L .mans { left: 9px; }
.mans .tabbtn { border: 1px solid color-mix(in srgb, var(--k-think) 50%, transparent); background: var(--paper); color: var(--k-think); border-radius: 2px; padding: 3px 6px; font-size: 11.5px; cursor: default; }
.mans .mtext { display: none; border-top: 2px solid var(--k-think); padding-top: 4px; }
.mans.open .tabbtn { display: none; } .mans.open .mtext { display: block; }
/* answers on the back of the leaf */
.b-answers { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: .9em; padding: .4em 0; margin: 0 0 .8em; }
.b-answers .bt { color: var(--k-think); }
.selfg { display: flex; flex-wrap: wrap; gap: .3em .9em; font: .68em var(--f-ui); margin-top: .35em; align-items: center; }
.selfg .lbl { color: var(--muted); }
.hotcard { margin-top: .4em; background: var(--amber-soft); border-inline-start: 2px solid var(--amber); padding: .3em .6em; font: .68em/1.5 var(--f-ui); color: var(--ink); }
/* level 3 and decide */
.b-l3 { border-inline-start: 3px solid var(--k-l3); background: color-mix(in srgb, var(--k-l3) 5%, transparent); } .b-l3 .bt { color: var(--k-l3); }
.l3row { display: flex; gap: .5em; align-items: center; margin-top: .35em; font: .72em var(--f-ui); flex-wrap: wrap; }
.l3row input { width: 7em; font: inherit; border: 0; border-bottom: 1.3px solid var(--ink-soft); background: transparent; color: var(--ink); padding: 2px 4px; }
.l3row button, .dec button { font: inherit; border: 1px solid var(--rule); background: var(--paper); border-radius: 3px; padding: 2px 9px; cursor: pointer; }
.dec { display: grid; gap: .25em; margin-top: .35em; font: .74em/1.45 var(--f-ui); }
.dec button { text-align: start; padding: .35em .6em; }
.dec button[aria-pressed="true"] { border-color: var(--k-l3); box-shadow: inset 3px 0 0 var(--k-l3); }
.l3out { font: .72em/1.5 var(--f-ui); color: var(--ink-soft); margin-top: .3em; }
/* figure and scene plate */
.fig { margin: .7em 0; text-align: center; }
.fig svg { width: 100%; height: auto; display: block; }
.fig figcaption, .scene figcaption { font: .64em/1.45 var(--f-ui); color: var(--muted); margin-top: .3em; text-align: start; }
.fig figcaption b, .scene figcaption b { color: var(--ink-soft); }
.fullpage .fig { margin-top: 2em; }
.figspread { position: absolute; top: var(--mt); height: calc(var(--ch) * .8); width: calc(var(--pw) * 2 - var(--mo) * 2); overflow: visible; }
.page.R .figspread { right: var(--mo); } .page.L .figspread { left: var(--mo); }
.figspread svg { width: 100%; height: 100%; }
.scene { margin: .7em 0; position: relative; }
.scene .plate { position: relative; border: 1px solid var(--rule); background: color-mix(in srgb, var(--paper-back) 60%, var(--paper)); aspect-ratio: 16 / 9; overflow: hidden; }
.scene .plate img, .scene .plate canvas { width: 100%; height: 100%; display: block; }
.scene .lift { position: absolute; bottom: 8px; left: 8px; font: 600 12px var(--f-ui); border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 3px; padding: 4px 10px; cursor: pointer; }
.scene .hint3d { position: absolute; top: 6px; right: 8px; font: 11px var(--f-ui); color: var(--muted); }
/* margin notes, style B (tab card) */
.mnote { position: absolute; width: calc(var(--mo) - 20px); font: 12px/1.45 var(--f-ui); color: var(--ink-soft); background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; padding: 5px 7px 6px; cursor: pointer; }
.page.R .mnote { right: 10px; } .page.L .mnote { left: 10px; }
.mnote.eqnote { cursor: default; border-style: dashed; }
.mnote .tab { position: absolute; top: 6px; width: 16px; height: 18px; background: var(--accent); color: var(--paper); font: 600 10.5px/18px var(--f-mono); text-align: center; border-radius: 2px; }
.page.R .mnote .tab { left: -17px; border-radius: 2px 0 0 2px; } .page.L .mnote .tab { right: -17px; border-radius: 0 2px 2px 0; }
.mnote .k { display: block; font-weight: 600; color: var(--accent); font-size: 11px; }
.mnote .tx { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mnote.open .tx { -webkit-line-clamp: unset; display: block; }
.mnote [contenteditable] { outline: none; border-bottom: 1px dashed var(--rule); min-height: 1.4em; }
.mnum { position: absolute; font: 600 10.5px/16px var(--f-mono); width: 16px; height: 16px; text-align: center; background: var(--accent); color: var(--paper); border-radius: 2px; }
.page.R .mnum { right: calc(var(--mo) - 22px); } .page.L .mnum { left: calc(var(--mo) - 22px); }
:root[data-notes="compact"] .mnote { display: none; }
:root:not([data-notes="compact"]) .mnum { display: none; }
.anchored { background: color-mix(in srgb, var(--accent) 9%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 9%, transparent); }
/* end of lesson: the stamp */
.endpage { text-align: center; padding-top: 1.2em; }
.content > .endpage:first-child { padding-top: 18%; }
.endpage .eh { font: 600 .7em var(--f-ui); letter-spacing: .12em; color: var(--muted); }
.endpage .facts { font: .72em/1.7 var(--f-ui); color: var(--ink-soft); margin: 1.2em auto; max-width: 22em; }
.stamp { display: inline-grid; place-items: center; width: 8.2em; height: 8.2em; border: 3px double var(--accent); border-radius: 50%; color: var(--accent); font: 700 1.02em var(--f-ui); transform: rotate(-11deg); opacity: .85; margin-top: 1em; }
.stamp small { display: block; font: 500 .52em var(--f-mono); letter-spacing: .08em; }
.stamp.press { animation: press .5s cubic-bezier(.2,.9,.3,1.2) both; }

<script>
"use strict";
/* ============ the lesson: real M0.1 text, every block type ============ */
const LESSON = [
  { t: "h1", id: "h1", html: "המתמטיקה המודרנית: מבנה, מרחב ופונקציה כמשתנה", sub: "M0.1 · שיעור 4 מתוך 6 · כ-35 דקות קריאה" },
  { t: "p", id: "p1", cls: "opening first", html: "<span class=\"ow\">במאה התשע-עשרה</span> הבינו המתמטיקאים שאפשר לחקור את היחסים בין עצמים בלי לשאול מה העצמים עצמם. זה נשמע כמו ויתור, אבל זה היה רווח עצום: משפט שהוכח על היחסים בלבד נכון בבת אחת לכל העצמים שמקיימים אותם, בגאומטריה, באותות, במכניקה ובבקרה. בשיעור הזה נבנה את שלושת הרעיונות שהמעבר הזה הוליד, ונראה איך כל אחד מהם חוזר אחר כך בהנדסה." },
  { t: "p", id: "p2", html: "המעבר לא קרה מתוך רצון להכליל לשם ההכללה. הוא נולד מבעיות קונקרטיות שהכלים הישנים לא הצליחו לפתור: טורים שמתכנסים במקום אחד ומתבדרים במקום אחר, משוואות שאין להן פתרון בנוסחה, ומערכות שבהן שינוי קטן בנתון מעיף את התשובה. כל אחת מהבעיות האלה הכריחה את המתמטיקאים להפסיק לחשב ולהתחיל לשאול על המבנה." },
  { t: "history", id: "hist1", title: "רקע היסטורי · קנטור, 1872", html: "גאורג קנטור ניסה להבין על אילו קבוצות של נקודות טור פורייה עדיין מתכנס לפונקציה. כדי לענות הוא נאלץ להשוות גדלים של קבוצות אינסופיות, ומשם נולדה תורת הקבוצות. השאלה ההנדסית של פורייה, איך לפרק חום לגלים, היא שהולידה את השפה של המתמטיקה המודרנית." },
  { t: "h2", id: "s1", sn: "1", html: "מבנה: קבוצה עם חוקים" },
  { t: "p", id: "p3", html: "מבנה מתמטי הוא קבוצה של עצמים, ועליה פעולות ויחסים שמקיימים חוקים מוגדרים. החידוש הוא שהחוקים, ולא העצמים, הם מה שמגדיר את המבנה. שני אוספים שונים לגמרי של עצמים יכולים להיות אותו מבנה, ואז כל מה שידוע על אחד מהם נכון גם לשני." },
  { t: "p", id: "p4", html: "הדוגמה החשובה ביותר להנדסה היא המרחב הווקטורי. מהנדס האותות, מהנדס המבנים ומהנדס הבקרה עובדים כל אחד עם עצמים אחרים: דגימות של אות, כוחות בקורה, מצב של מערכת. אבל שלושתם מחברים עצמים ומכפילים אותם במספרים, ולכן שלושתם עובדים באותו מבנה ומשתמשים באותם משפטים." },
  { t: "def", id: "d1", title: "הגדרה · מרחב וקטורי", html: "קבוצה <span class=\"m\">V</span> מעל שדה <span class=\"m\">F</span>, עם פעולת חיבור <span class=\"m\">V × V → V</span> וכפל בסקלר <span class=\"m\">F × V → V</span>, כך שהחיבור קיבוצי וחילופי, יש איבר אפס ולכל איבר יש נגדי, הכפל בסקלר תואם לכפל בשדה ו-<span class=\"m\">1·v = v</span>, והכפל מתפלג על החיבור משני הצדדים." },
  { t: "p", id: "p5", cls: "first", html: "שים לב למה שההגדרה לא אומרת: היא לא אומרת מהם הווקטורים. הם יכולים להיות חצים במישור, פולינומים, מטריצות או אותות בזמן. ההגדרה בנויה משני חלקים: רשימת פעולות (מה מותר לעשות) ורשימת חוקים (מה חייב לצאת). כל מי שמקיים את שתי הרשימות הוא מרחב וקטורי." },
