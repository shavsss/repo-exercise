<script>
const D=[["md", "## פרק 4: התורה הקוונטית: למה האטום גדול\n\nכל אטום מימן ביקום זהה לכל אטום מימן אחר: אותו גודל, כחצי אנגסטרום, ואותם צבעים בדיוק כשהוא זוהר. ב-1873 אמר מקסוול שהזהות הזו נותנת למולקולות \"את האופי של מוצר מתועש\" <span class=\"cert\">ודאות: גבוהה<\/span>, והתכוון לכך כחידה: מכונה שמייצרת מוצרים זהים צריכה תבנית, ואיפה התבנית של האטום? השאלה של הפרק היא שתי פנים של אותה חידה: **למה האלקטרון לא נופל אל הפרוטון, ולמה כל אטומי המימן באותו גודל?** נענה עליה מחוק אחד ושלושה קבועים, ובדרך נלווה מכשיר אחד, מיקרוסקופ האלקטרונים, שנבנה בברלין באותן שנים בדיוק, בידי אנשים שלא ידעו שהם בונים אותו על התשובה.\n\n**מה אנחנו כבר יודעים.** $ke^2$ ו-$a_0=0.529$ Å, שנמדד ולא הוסבר (2.4); תנע ותאוצה בשינוי כיוון (2.2); מטען מואץ משדר גל (3.2). מ-M0.1: ממוצע, RMS, הסתברות כשכיחות, ומינימום כאפס של הנגזרת. מהשיעור הקודם: $\\tfrac12mv^2$ ו-$k_BT=25.9$ meV ב-300 K כקנה המידה של תנועה תרמית.\n\n### 4.1 אטום שלא יכול להתקיים, 1911–1913\n\nב-1911 פרסם רתרפורד במנצ'סטר את מה שגייגר ומרסדן ראו כשירו חלקיקי אלפא על רדיד זהב: רובם עברו כמעט בלי לסטות, ומעטים חזרו לאחור, \"כאילו ירית פגז על נייר טישו והוא חזר ופגע בך\" <span class=\"cert\">ודאות: גבוהה<\/span>. ההסבר היחיד היה שכמעט כל המסה והמטען החיובי מרוכזים בגרעין זעיר, והאלקטרונים סביבו. זו הייתה תגלית, אבל גם אסון תאורטי, ואפשר לראות למה מתוך מה שכבר למדנו.\n\nהניסיון הטבעי הוא מערכת שמש קטנה: האלקטרון מקיף את הפרוטון, וחוק קולון מספק את הכוח פנימה. אלא שאלקטרון במעגל מאיץ (2.2), ומטען מאיץ משדר (3.2). הוא מאבד אנרגיה, נופל מעט פנימה, נע מהר יותר, משדר חזק יותר, והחישוב הקלאסי נותן קריסה אל הפרוטון בתוך $1.6\\times10^{-11}$ שניות <span class=\"cert\">ודאות: גבוהה<\/span>. כל החומר ביקום היה צריך להיעלם לפני שאור עובר סנטימטר.\n\n"], ["raw", "<figure><svg viewBox=\"0 0 520 300\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"13\" fill=\"none\" stroke=\"currentColor\">\n<path d=\"M240.0,150.0 L234.3,116.1 L218.4,85.8 L194.0,61.9 L163.5,46.8 L130.0,41.9 L96.7,47.5 L66.9,63.1 L43.4,87.1 L28.6,117.1 L23.8,150.0 L29.4,182.7 L44.7,212.0 L68.3,235.0 L97.7,249.5 L130.0,254.2 L162.1,248.7 L190.8,233.6 L213.3,210.5 L227.5,181.7 L232.1,150.0 L226.7,118.6 L211.9,90.5 L189.3,68.4 L161.0,54.5 L130.0,50.1 L99.3,55.4 L71.8,69.9 L50.2,92.0 L36.7,119.7 L32.3,150.0 L37.6,180.0 L51.7,206.9 L73.4,227.9 L100.4,241.1 L130.0,245.3 L159.3,240.2 L185.4,226.3 L205.9,205.1 L218.7,178.8 L222.8,150.0 L217.7,121.5 L204.2,96.1 L183.6,76.2 L158.0,63.8 L130.0,59.9 L102.3,64.8 L77.7,78.0 L58.4,98.0 L46.4,122.8 L42.7,150.0 L47.5,176.8 L60.3,200.6 L79.7,219.2 L103.8,230.8 L130.0,234.3 L155.9,229.6 L178.8,217.2 L196.6,198.4 L207.7,175.3 L211.0,150.0 L206.4,125.2 L194.5,103.2 L176.4,86.1 L154.2,75.6 L130.0,72.5 L106.3,77.0 L85.3,88.5 L69.1,105.8 L59.2,127.0 L56.4,150.0 L60.8,172.5 L71.8,192.3 L88.2,207.5 L108.3,216.8 L130.0,219.3 L151.1,215.0 L169.6,204.5 L183.7,189.0 L192.2,170.2 L194.3,150.0 L190.1,130.5 L180.2,113.5 L165.8,100.7 L148.5,93.2 L130.0,91.6 L112.3,95.7 L97.2,104.9 L86.1,118.1 L79.9,133.7 L78.9,150.0 L83.1,165.2 L91.7,177.9 L103.4,186.7 L116.7,191.0 L130.0,190.5 L141.6,185.8 L150.1,177.7 L154.2,167.6 L152.5,157.3 L130.0,150.0\" stroke-width=\"1.4\"/>\n<circle cx=\"240\" cy=\"150\" r=\"5\" fill=\"currentColor\"/>\n<circle cx=\"130\" cy=\"150\" r=\"4\" fill=\"currentColor\"/>\n<text x=\"130\" y=\"290\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">קלאסי: קריסה בתוך כ-10⁻¹¹ ש'<\/text>\n<text x=\"246\" y=\"140\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"start\">התחלה<\/text>\n<circle cx=\"390\" cy=\"150\" r=\"110\" stroke-width=\"2.5\"/>\n<circle cx=\"390\" cy=\"150\" r=\"4\" fill=\"currentColor\"/>\n<line x1=\"390\" y1=\"150\" x2=\"500\" y2=\"150\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n<text x=\"445\" y=\"143\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">a₀ = 0.529 Å<\/text>\n<text x=\"390\" y=\"168\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">פרוטון<\/text>\n<text x=\"390\" y=\"290\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">נמדד: גודל קבוע לכל אטום מימן<\/text>\n<\/svg>\n<figcaption>משמאל: אלקטרון קלאסי שמתחיל ברדיוס a₀, משדר ומסתחרר אל הפרוטון (מספר הסיבובים סכמטי; בחישוב הקלאסי הם כמאתיים אלף). מימין: הטבעת ברדיוס a₀ שבה נמצא אלקטרון במימן אמיתי, תמיד. שני הרדיוסים ההתחלתיים שווים; הפרוטון מוגדל מאוד.<\/figcaption><\/figure>"], ["md", "\nוהקריסה אינה הבעיה היחידה. גם אילו השידור נעצר איכשהו, התורה הקלאסית לא יודעת לומר באיזה רדיוס האלקטרון יקיף. כוכב לכת יכול לנוע בכל רדיוס, ומרחק כדור הארץ מהשמש הוא תאונה היסטורית, לא חוק. כדי שחוק יקבע גודל, צריך לבנות אורך מהקבועים שבו. $ke^2$ הוא ביחידות ק\"ג·מ³/ש², ו-$m_e$ בק\"ג; כל חזקה של $ke^2$ שנותנת מטרים מביאה איתה גם שניות, ושום דבר לא מבטל אותן. אם מוסיפים את $c$, יוצא אורך אחד, $ke^2/m_ec^2=2.82\\times10^{-15}$ מ', קטן מהאטום פי $1.88\\times10^4$. התורה הקלאסית מנבאת אפוא שני דברים, ושניהם שגויים: שהאטום קורס, ושאין לו גודל מועדף. כדי שיהיה גודל, חסר קבוע טבע שיכניס את השניות החסרות.\n\nקבוע כזה כבר היה קיים, אף שאיש לא חשב עליו כעל קבוע של האטום. ב-1900, כדי להתאים נוסחה לקרינה של גוף חם, הניח פלאנק שאנרגיה מוחלפת עם האור רק בחבילות $hf$, עם $h=6.626\\times10^{-34}$ ק\"ג·מ²/ש'. הוא עצמו קרא לזה אחר כך \"מעשה של ייאוש\" <span class=\"cert\">ודאות: גבוהה<\/span>, וקיווה שהקבוע ייעלם כשיובן טוב יותר. ב-1905 לקח איינשטיין את החבילות ברצינות ואמר שהאור עצמו עשוי מהן; מיליקן, שניסה להפריך זאת בניסויים, אישר ב-1916 את התחזית ועדיין לא האמין לה <span class=\"cert\">ודאות: גבוהה<\/span>. היחידות של $h$, תנע כפול אורך, הן בדיוק מה שחסר: מ-$h$, $m_e$ ו-$ke^2$ אפשר לבנות אורך, ויש רק דרך אחת.\n\n**בוהר, 1913: התשובה הנכונה בלי סיבה.** נילס בוהר, דני צעיר שעבד ב-1912 אצל רתרפורד, עשה את הצעד הנועז: הוא **קבע** שהאלקטרון נע רק במסלולים שבהם התנע הזוויתי הוא כפולה שלמה של $\\hbar=h/2\\pi$, ושבמסלולים האלה הוא פשוט לא משדר. מכאן יצא הרדיוס הקטן ביותר $a_0=\\hbar^2/m_eke^2=0.529$ Å, ואנרגיית קשר של 13.6 eV, והפרשי האנרגיה בין המסלולים נתנו בדיוק את קווי הספקטרום של המימן, שבלמר תיאר בנוסחה אמפירית כבר ב-1885: הקו האדום, 656 ננומטר, יוצא מהקבועים לבד <span class=\"cert\">ודאות: גבוהה<\/span>. אבל הכלל לא הוסבר; הוא הוכרז. למה דווקא התנע הזוויתי? למה אלקטרון מאיץ לא משדר? בוהר ידע שהוא מדביק חוק חדש על פיזיקה ישנה שסותרת אותו, ובעשור הבא הטלאי נקרע: הוא לא הצליח באטום ההליום, בעל שני אלקטרונים, ולא בפיצול הקווים בשדה מגנטי. במאי 1925 כתב פאולי לחבר: \"הפיזיקה שוב מבולבלת מאוד כרגע; בכל אופן היא קשה מדי בשבילי, והלוואי שהייתי שחקן קומי בקולנוע ולא שמעתי מעולם על פיזיקה\" <span class=\"cert\">ודאות: גבוהה<\/span>.\n\nהתשובה שנבנה כאן היא זו שהחליפה את הטלאי: לא כלל על מסלולים, אלא חוק שאומר שאין מסלולים בכלל.\n\n### 4.2 גל בלי מסלול: דה ברויי, הייזנברג ומיקרוסקופ מחשבתי\n\nהרמז הראשון בא מכיוון לא צפוי. לואי דה ברויי, צעיר ממשפחת אצולה צרפתית שעבר מהיסטוריה לפיזיקה, הציע בעבודת הדוקטורט שלו ב-1924 היפוך של איינשטיין: אם לגל של אור יש חלקיק, אולי לחלקיק יש גל, באורך\n\n"], ["box", "formula", "נוסחה: אורך הגל של חלקיק (de Broglie wavelength)", "$$\\lambda=\\frac{h}{p}\\tag{8}$$\n$\\lambda$ במטרים, $p$ התנע. תקף לכל חלקיק; תנע גדול פירושו גל קצר.\n"], ["md", "\nהוועדה בפריז לא ידעה מה לעשות בזה, ולנז'בן שלח את העבודה לאיינשטיין, שכתב שהיא \"מרימה פינה של הצעיף הגדול\" <span class=\"cert\">ודאות: בינונית<\/span>. הרעיון נתן לכלל של בוהר סיבה: אם גל צריך להיסגר על עצמו סביב הגרעין, מספר שלם של אורכי גל, $n\\lambda=2\\pi r$, אז לפי (8) $pr=n\\hbar$, בדיוק הכלל שבוהר הכריז. אבל ההסבר פתח שאלה גרועה מזו שסגר: אם האלקטרון הוא גל שפרוש סביב הגרעין, איפה האלקטרון? ומה, בדיוק, מתנודד?\n\nב-1925 ורנר הייזנברג, בן 23, ברח מקדחת השחת לאי הלגולנד ובנה שם תורה שוויתרה מראש על מסלולים, ועסקה רק במה שנמדד, בתדרים ובעוצמות של קווי הספקטרום. ב-1926 כתב שרדינגר משוואה לגל של האלקטרון, ובורן הציע שהגל הוא הסתברות. וב-1927 מצא הייזנברג את המשפט שמסביר מה התורה החדשה אוסרת. כדי לנסח אותו צריך מדד ל\"כמה לא ידוע\": נכין את אותו מצב פעמים רבות, נמדוד בכל פעם את המקום, ונחשב את ה-RMS של הסטיות מהממוצע (M0.1). זה **הפיזור** (standard deviation), $\\Delta x$; ובאותו אופן $\\Delta p$ לתנע.\n\n"], ["box", "formula", "נוסחה: עקרון אי-הוודאות (uncertainty principle)", "$$\\Delta x\\,\\Delta p\\ge\\frac{\\hbar}{2},\\qquad \\hbar=\\frac{h}{2\\pi}=1.055\\times10^{-34}\\ \\text{kg·m}^2/\\text{s}\\tag{9}$$\n$\\Delta x$ ו-$\\Delta p$ הם הפיזורים של המקום והתנע באותו כיוון, בהרבה מדידות של אותו מצב. תקף לכל חלקיק ולכל מצב, בכל כיוון בנפרד.\n"], ["md", "\nמה החוק משנה: בעולם הקלאסי אפשר היה לצמצם את שני הפיזורים יחד עד אפס, ומסלול הוא בדיוק זה, מקום ומהירות חדים בכל רגע. (9) אומר שמצב כזה לא קיים: בקופסה צרה פי 2 פיזור התנע גדל לפחות פי 2. ו-$\\hbar$ זעיר, ולכן בגרגר אבק של $10^{-15}$ ק\"ג, שמקומו ידוע עד מיקרומטר, פיזור המהירות הוא $5.3\\times10^{-14}$ מ'/ש', כ-1.7 מיקרומטר בשנה, ואילו אלקטרון כלוא ב-1 Å מקבל לפחות $5.8\\times10^5$ מ'/ש'. ביום-יום החוק בלתי נראה; באטום הוא קובע הכול.\n\n**הטעות במיקרוסקופ.** הייזנברג הסביר את החוק בניסוי מחשבתי, ויש בזה אירוניה. ב-1923, בבחינת הדוקטורט במינכן, שאל אותו וין מה כוח ההפרדה של מיקרוסקופ, והוא לא ידע, וכמעט נכשל <span class=\"cert\">ודאות: גבוהה<\/span>. ארבע שנים אחר כך בנה את הטיעון שלו על מיקרוסקופ: כדי לראות אלקטרון מאירים אותו באור, ואור באורך גל $\\lambda$ לא מבחין בפרטים קטנים בהרבה מ-$\\lambda$. לכן כדי למקם את האלקטרון בדיוק $\\Delta x$ צריך גל קצר, כלומר לפי (8) פוטון בתנע גדול, והפוטון נותן לאלקטרון מכה. בוהר, שקרא את הטיוטה בקופנהגן, הראה לו שהניתוח שגוי בפרט חשוב: הוא שכח את פתח העדשה, שממנו נובע שכיוון הפוטון שנאסף, ולכן המכה, לא ידוע. הוויכוח היה קשה עד כדי כך שהייזנברג סיפר שפרץ בבכי <span class=\"cert\">ודאות: בינונית<\/span>, והמאמר יצא עם הערת תיקון בסופו.\n\nהמחלוקת לא הייתה טכנית. התמונה של \"המדידה מפריעה\" מניחה שיש לאלקטרון מקום ותנע מוגדרים, ושרק לא הצלחנו לדעת אותם. בוהר טען שאין מה לדעת: גם כשמודדים בחצי מאלקטרונים זהים רק את המקום, ובחצי השני רק את התנע, בלי שום מכה משותפת, הפיזורים מקיימים את (9). אי-הוודאות היא תכונה של המצב, לא פגם במכשיר. נחזור למיקרוסקופ הזה, כי הוא עומד לחזור במתכת.\n\n"], ["box", "domain", "חיבור לתחום אחר: אותו חשבון במכ\"ם: אורך פולס מול רוחב פס", "(9) הוא בעצם משפט על גלים: חבילת גל שאורכה $\\Delta x$ מכילה בהכרח טווח של מספרי גל $\\Delta k\\gtrsim1/(2\\Delta x)$, ו-(8), בצורה $p=\\hbar k$, הופך אותו לתנע. **באטום:** $\\Delta x=0.5$ Å נותן $\\Delta k\\ge10^{10}$ מ'⁻¹, וכפול $\\hbar$, $\\Delta p\\ge1.06\\times10^{-24}$ ק\"ג·מ'/ש'. **במכ\"ם:** מכ\"ם שדה תעופה כמו ה-ASR-9 משדר פולס של כמיקרו-שנייה <span class=\"cert\">ודאות: בינונית<\/span>. הפולס הוא חבילה באורך $c\\tau=300$ מ', ולכן הוא מכיל טווח תדרים של כ-1 MHz, ושני מטוסים נבדלים בטווח רק אם הם רחוקים זה מזה יותר מ-$c/2B=150$ מ'. כדי לקבל 15 מ' צריך פס של 10 MHz, בדיוק כמו שאלקטרון צר פי 10 צריך פיזור תנע גדול פי 10. **איפה זה נשבר:** במכ\"ם רוחב הפס הוא תכונה של אות שנמדד כולו בירייה אחת, ואפשר לקנות אותו בדחיסת פולס; באטום אין אות למדוד, ו-$\\hbar$ הופך את פיזור מספרי הגל לפיזור של תנע החלקיק עצמו, שנראה רק כשכיחות בהרבה חזרות.\n"], ["md", "\n### 4.3 מחיר מול רווח: הגודל יוצא מהחוק\n\nעכשיו אפשר לענות על השאלה. אילו האלקטרון ישב על הפרוטון, $\\Delta x$ היה כמעט אפס, ולפי (9) פיזור התנע היה עצום. תנע עצום הוא אנרגיית תנועה עצומה, והאלקטרון לא היה נשאר שם. הנפילה עולה כסף. כדי לשקול את המחיר מול המשיכה צריך מטבע אחד, האנרגיה, ושני מושגים מספיקים לנו ככלים. **אנרגיה קינטית** היא העבודה שצריך כדי להביא גוף ממנוחה לתנועה, $K=\\tfrac12mv^2=p^2/2m$; הצורה בתנע נוחה, כי (9) נותן תנע. **אנרגיה פוטנציאלית** היא פונקציה שהכוח הוא מינוס השיפוע שלה, $F=-dU/dr$; לכוח קולון $F=-ke^2/r^2$ (שלילי, כלומר פנימה) היא\n\n$$U(r)=-\\frac{ke^2}{r},\\tag{10}$$\n\nעם האפס באינסוף, ולכן שלילית בכל מרחק: \"פחות מאשר כשהחלקיקים רחוקים\". כשפועל רק כוח כזה, $E=K+U$ נשמרת, ומצב קשור הוא $E<0$. היחידה הנוחה היא **אלקטרון-וולט** (eV), האנרגיה שמטען $e$ צובר במעבר מתח של וולט אחד, $1.602\\times10^{-19}$ J; בה $ke^2=14.40$ eV·Å.\n\n**האומדן.** אלקטרון שנמצא בתוך מרחק $r$ מהפרוטון מפוזר במקום על פני $r$ בערך, ולכן $\\Delta x\\approx r$ ולפי (9) $\\Delta p\\gtrsim\\hbar/r$ (את הגורם $\\tfrac12$ נשמיט, כי זה אומדן, ונחזור אליו). האטום במנוחה, ולכן ממוצע התנע אפס ו-$\\langle p^2\\rangle=(\\Delta p)^2$. נחבר:\n\n"], ["box", "formula", "נוסחה: אנרגיית האטום לפי גודלו (אומדן אי-הוודאות)", "$$E(r)\\approx\\frac{\\hbar^2}{2m_er^2}-\\frac{ke^2}{r}\\tag{11}$$\nהאיבר הראשון הוא מחיר הכליאה, השני רווח המשיכה. אומדן לסדר גודל, לחלקיק יחיד, במהירויות קטנות בהרבה מ-$c$.\n"], ["md", "\nהכול בצורה של שני האיברים. כשהאלקטרון מתקרב פי 2, הרווח גדל פי 2 והמחיר פי 4. מרחוק הרווח שולט, מקרוב המחיר, ובאמצע יש מרחק אחד שבו הסכום הכי נמוך. שם האלקטרון נמצא.\n\n"], ["raw", "<div class=\"note\">[chart: מחיר הכליאה מול רווח המשיכה]<\/div>"], ["md", "\nנגזור ונשווה לאפס: $dE/dr=-\\hbar^2/m_er^3+ke^2/r^2=0$, ומכאן\n\n"], ["box", "formula", "נוסחה: רדיוס בוהר ואנרגיית הקשר של המימן", "$$a_0=\\frac{\\hbar^2}{m_eke^2}=0.529\\ \\text{Å},\\qquad E_{min}=-\\frac{ke^2}{2a_0}=-13.6\\ \\text{eV}\\tag{12}$$\nתקף לאלקטרון אחד סביב גרעין; לגרעין במטען $Ze$ מחליפים $ke^2$ ב-$Zke^2$.\n"], ["md", "\nזה הרדיוס של בוהר, אבל הפעם בלי שום כלל על מסלולים: הוא יצא מחוק אחד על מה שאפשר לדעת. והוא עונה על שני חלקי השאלה יחד. האלקטרון לא נופל, כי נפילה היא כליאה, וכליאה עולה יותר ממה שהמשיכה מחזירה. וכל אטומי המימן זהים, כי המינימום תלוי רק ב-$\\hbar$, $m_e$ ו-$ke^2$, שזהים בכל מקום; אין באטום שום \"היסטוריה\" שתבחר רדיוס אחר, כמו שיש למערכת השמש. התבנית שמקסוול חיפש היא הקבועים.\n\n**מה שולט בתוצאה.** $a_0$ גדל כמו $\\hbar^2$: כש-$\\hbar\\to0$, גם $a_0\\to0$, וזו בדיוק הקריסה של 4.1. התורה הקוונטית היא שעושה את האטום גדול. חלקיק כבד יותר נכלא בזול, ולכן אטומו קטן; משיכה חזקה מקרבת. במינימום $K=+13.6$ eV ו-$U=-27.2$ eV: האלקטרון באטום, במצב הנמוך ביותר שלו, נע, ולא יכול שלא לנוע.\n\n**מול המדידה, ובמה זה מטעה.** האנרגיה הנמדדת לקריעת אלקטרון ממימן היא 13.598 eV, מול 13.606 שלנו <span class=\"cert\">ודאות: גבוהה<\/span>; את ההפרש, 0.06%, נותנת התנועה של הפרוטון, שכבד רק פי 1836. הדיוק מטעה חלקית: $\\Delta x=r$ נבחר בלי הצדקה, ובמקרה הבחירה נותנת בדיוק את מה שהתורה המלאה נותנת <span class=\"cert\">ודאות: גבוהה<\/span>.\n\n**איפה זה נשבר.** עם הגורם $\\tfrac12$ של (9), $a_0$ יוצא 0.132 Å ו-$-54.4$ eV: האומדן קובע את סדר הגודל ואת התלות בקבועים, לא גורמים של 2 או 4. הוא נשבר גם באטום עם כמה אלקטרונים, שם נדרש כלל נוסף (עקרון האיסור של פאולי), ובמהירויות קרובות ל-$c$; במימן האלקטרון נע ב-$c/137$.\n\n**$h$ במקום $\\hbar$.** מערכת AI שמציבה ב-(12) $h$ במקום $\\hbar$ תקבל אטום של 20.9 Å וקשר של 0.345 eV. שתי בדיקות תופסות את זה: אטום הוא כ-1 Å, ו-0.345 eV הם רק פי 13 מ-$k_BT$, כך שאטומים היו מאבדים אלקטרונים בחום של תנור.\n\n"], ["box", "numeric", "שאלה מספרית", "ב-1913 ייחס בוהר סדרת קווים מוזרה בספקטרום של כוכבים, שהיו ידועים כ\"קווים של מימן\", ליון הליום $\\text{He}^+$: אלקטרון אחד סביב גרעין במטען $+2e$. פאולר במעבדה התנגד שהיחסים לא מתאימים, ובוהר ענה שצריך להביא בחשבון את תנועת הגרעין, וההתאמה נעשתה מושלמת <span class=\"cert\">ודאות: בינונית<\/span>. לפי (12), מהי אנרגיית הקשר של $\\text{He}^+$? במימן $a_0=0.529$ Å ו-$E_{min}=-13.6$ eV.\n\n<details><summary>פתרון<\/summary>\n\nבגרעין במטען $2e$ מחליפים ב-(12) את $ke^2$ ב-$2ke^2$.\nהרדיוס: $a=\\hbar^2/(m_e\\cdot2ke^2)=a_0/2=0.265$ Å.\nהאנרגיה: $E=-2ke^2/(2a)=-2ke^2/a_0=4\\times(-13.6)=-54.4$ eV, וזה הערך שנמדד.\n- wrong: 27.2 :: הוכפלה רק המשיכה, ונשכח שגם הרדיוס קטן פי 2; האנרגיה גדלה כמו $Z^2$.\n- wrong: 6.8 :: המשיכה החזקה טופלה כאילו היא מגדילה את האטום.\n\n\n<\/details>"], ["md", "\n### 4.4 המיקרוסקופ האמיתי: האם אפשר לראות את מה שגזרנו?\n\nבזמן שהייזנברג ובוהר התווכחו על מיקרוסקופ מחשבתי, בבית הספר הטכני בברלין עבדו מקס קנול והסטודנט ארנסט רוסקה על בעיה מעשית לגמרי, אוסצילוסקופים לקווי מתח גבוה. הם השתמשו בתגלית של בוש מ-1926, שסליל שזרם עובר בו ממקד אלומת אלקטרונים כמו שעדשה ממקדת אור, וב-1931 הציבו שני סלילים בטור וקיבלו תמונה מוגדלת, כ-17 פעמים בלבד <span class=\"cert\">ודאות: בינונית<\/span>. ההגדלה הזו הייתה מגוחכת לעומת מיקרוסקופ אור, אבל המטרה הייתה לעקוף מכשול בן חצי מאה: ב-1873 הראה אבה שמיקרוסקופ אור לא יבחין לעולם בפרטים קטנים מכחצי אורך הגל, כמאתיים ננומטר <span class=\"cert\">ודאות: גבוהה<\/span>, ושום ליטוש עדשות לא יעזור. אלקטרונים, חשבו, הם חלקיקים, ואין להם אורך גל.\n\nואז, ב-1932, נתקל רוסקה ברעיון של דה ברויי. בהרצאת הנובל שלו ב-1986 סיפר שהתאכזב: אם לאלקטרון יש גל, גם מיקרוסקופ האלקטרונים כפוף לגבול של אבה <span class=\"cert\">ודאות: בינונית<\/span>. ואז חישב את אורך הגל. אלקטרון שעובר מתח $V$ צובר אנרגיה $eV$, ותנע $p=\\sqrt{2m_eeV}$; ב-10 קילו-וולט, לפי (8):\n\n$$\\lambda=\\frac{h}{\\sqrt{2m_e\\,eV}}=12.3\\ \\text{pm},$$\n\nקצר פי $4\\times10^4$ מאור ירוק. הגבול היה עדיין שם, אבל הרחק מתחת לכל מה שעניין מישהו. ב-1933 עבר המכשיר של רוסקה את כוח ההפרדה של מיקרוסקופ האור, וב-1939 מכרה סימנס את הראשון המסחרי <span class=\"cert\">ודאות: גבוהה<\/span>.\n\nאבל החישוב הזה מעלה שאלה שנוגעת ישר בתשובה של 4.3, ובה מתחבר המיקרוסקופ המחשבתי של הייזנברג עם זה של רוסקה: **אם האטום קיים רק כי האלקטרון לא יכול להיות מקומי יותר, האם אפשר לראות אותו בלי להרוס אותו?** כדי להבחין בפרט בגודל $a_0$ צריך אלקטרון שאורך הגל שלו לכל היותר $a_0$, כלומר לפי (8) תנע $h/a_0$, ואנרגיה\n\n$$\\frac{h^2}{2m_ea_0^2}=(2\\pi)^2\\,\\frac{\\hbar^2}{2m_ea_0^2}=4\\pi^2\\times13.6\\ \\text{eV}=537\\ \\text{eV}.$$\n\nזה אותו ביטוי כמו מחיר הכליאה ב-(11), רק עם $h$ במקום $\\hbar$, ולכן גדול פי 40 מאנרגיית הקשר. זה לא מקרה: מה שמאפשר לראות פרט בגודל $a_0$ הוא בדיוק מה שקובע את $a_0$. כל בדיקה חדה מספיק כדי לראות את האטום נושאת די אנרגיה כדי לפרק אותו.\n\n"], ["box", "numeric", "שאלה מספרית", "באיזה מתח צריך להאיץ אלקטרון כדי שאורך הגל שלו לפי (8) יהיה שווה ל-$a_0=0.529$ Å? $h=6.626\\times10^{-34}$ J·s, $m_e=9.109\\times10^{-31}$ ק\"ג, $e=1.602\\times10^{-19}$ C.\n\n<details><summary>פתרון<\/summary>\n\nהתנע: $p=h/a_0=6.626\\times10^{-34}/0.529\\times10^{-10}=1.25\\times10^{-23}$ ק\"ג·מ'/ש'.\nהאנרגיה: $p^2/2m_e=8.61\\times10^{-17}$ J, כלומר 537 eV, ולכן המתח 537 V.\nבראש: 4.3 נתן $\\hbar^2/2m_ea_0^2=13.6$ eV; עם $h$ זה פי $4\\pi^2=39.5$.\n- wrong: 13.6 :: זו אנרגיית הקשר; היא מתאימה לאורך גל $2\\pi a_0$, לא $a_0$.\n- wrong: 150 :: זה המתח לאורך גל של 1 Å, לא 0.529 Å.\n\n\n<\/details>"], ["md", "\nאיך, אם כן, מיקרוסקופים מודרניים מראים אטומים בודדים? התשובה נמצאת ב-(11) עצמה, במכנה. המיקרוסקופ לא מנסה למקם את **האלקטרון** בתוך האטום; הוא ממקם את **האטום כולו**, ובעיקר את הגרעין והענן שסביבו, שמפזרים את האלומה. המכה שהאלומה נותנת כשהיא מאתרת עצם עד $\\Delta x$ היא אותה מכה של הייזנברג, $\\Delta p\\sim\\hbar/\\Delta x$, אבל האנרגיה שעוברת היא $(\\Delta p)^2/2M$, ו-$M$ של אטום פחמן גדולה פי 21,900 ממסת האלקטרון. למקם אלקטרון עד 0.5 Å עולה 15 eV, יותר מאנרגיית הקשר; למקם אטום פחמן עד אותו דיוק עולה 0.7 meV, פחות מ-$k_BT$ של החדר. אפשר לראות איפה האטומים נמצאים; אי אפשר לראות את האלקטרון \"מקיף\" בתוכם, כי אין מסלול לראות, ומי שינסה למקם אותו על מסלול יקרע אותו מהאטום. זו תשובתו של בוהר להייזנברג, בצורה הנדסית.\n\n**מה מגביל בפועל.** מיקרוסקופים חודרים עובדים ב-100 עד 300 keV <span class=\"cert\">ודאות: גבוהה<\/span>. ב-100 keV, (8) עם $K=p^2/2m$ נותן 3.88 pm, אבל האלקטרון נע ב-55% ממהירות האור ותורת היחסות נותנת 3.70 pm, קצר ב-5%; ב-10 keV, ב-19% מ-$c$, התיקון כחצי אחוז. ובכל זאת הרזולוציה הטובה ביותר היא כ-50 pm <span class=\"cert\">ודאות: בינונית<\/span>, פי עשרה מאורך הגל. האשמה אינה בפיזיקה הקוונטית אלא בעדשות: ב-1936 הוכיח שרצר שכל עדשה מגנטית עגולה סובלת בהכרח משגיאה כדורית <span class=\"cert\">ודאות: גבוהה<\/span>, ובמשך שישים שנה זה היה הגבול, עד שהיידר, רוז ואורבן בנו ב-1998 מתקן שגיאות מעשי <span class=\"cert\">ודאות: גבוהה<\/span>. גבול הרזולוציה הוא תקרה, לא הבטחה.\n\n**והנזק.** האלומה לא רק מתפזרת; היא גם פוגעת. אלקטרון שפוגע חזיתית בגרעין פחמן מעביר לו לכל היותר כ-$4(m_e/M)$ מהאנרגיה שלו, ובתיקון יחסותי, ב-86 keV, כ-17 eV, מספיק כדי לעקור אטום מסריג של גרפן <span class=\"cert\">ודאות: בינונית<\/span>. לכן חוקרי גרפן עובדים ב-60–80 kV, ומוותרים על חלק מאורך הגל. בדוגמאות ביולוגיות הנזק הוא בעיקר שבירת קשרים כימיים, של כמה eV כל אחד, ולכן מצלמים אותן בקירור עמוק ובמעט מאוד אלקטרונים (קריו-מיקרוסקופיה, נובל 2017) <span class=\"cert\">ודאות: גבוהה<\/span>. ופוטונים לא היו עוזרים: לפי $E=hf=hc/\\lambda$, לפוטון באורך גל של 12.3 pm יש 101 keV, פי 10 מהאלקטרון באותו גל. המסה של האלקטרון, שהופכת את (8) ל\"זולה\" עבורו, היא היתרון.\n\n### 4.5 מה שהתמונה לא תגיד: הסתברות, ואיינשטיין שלא קיבל אותה\n\nבמעט אלקטרונים, תמונה במיקרוסקופ אינה תמונה אלא ענן של נקודות. ב-1989 הראו טונומורה ועמיתיו בהיטאצ'י, במיקרוסקופ אלקטרונים ששונה לשם כך, מה זה אומר: אלקטרונים שנשלחו אחד-אחד דרך \"דו-מנסרה\" אלקטרונית (biprism), חוט טעון שמפצל את הגל לשניים, פגעו במסך כל אחד בנקודה אחת, במקום שאי אפשר היה לנבא, ורק אחרי אלפים הצטיירו פסי התאבכות של גל <span class=\"cert\">ודאות: גבוהה<\/span>. כל אלקטרון הוא חלקיק כשהוא נמדד, והגל קובע רק היכן סביר שיופיע.\n\n"], ["box", "definition", "הגדרה: חיזוי הסתברותי", "תורה נותנת חיזוי הסתברותי כשלמצב נתון היא מנבאת לא תוצאה יחידה, אלא הסתברות לכל תוצאה. ההסתברות נבדקת כשכיחות: חוזרים על הכנת אותו מצב פעמים רבות וסופרים.\n"], ["md", "\nזה מה שבורן הציע ב-1926, וזה מה שאיינשטיין לא קיבל. \"הוא אינו משחק בקוביות\", כתב לבורן בסוף אותה שנה <span class=\"cert\">ודאות: גבוהה<\/span>, ובוועידת סולביי באוקטובר 1927 הביא כל בוקר לארוחת הבוקר ניסוי מחשבתי שאמור היה לעקוף את (9), ובוהר מצא את הפגם עד הערב <span class=\"cert\">ודאות: בינונית<\/span>. ההתנגדות של איינשטיין לא הייתה עקשנות; היא הייתה ההצעה הטבעית: אולי יש בתוך האלקטרון \"גלגלים\" נסתרים שקובעים היכן יפגע, והתורה פשוט לא מכירה אותם. במשך שלושים שנה זו נחשבה שאלה פילוסופית, עד שבל הראה ב-1964 שהיא ניתנת לבדיקה, והניסויים שזכו בנובל ב-2022 שללו את הסוגים הפשוטים של גלגלים כאלה <span class=\"cert\">ודאות: גבוהה<\/span>. ניסוי יחיד לא מפריך חיזוי הסתברותי; מיליון אלקטרונים על המסך כן.\n\nאותה עובדה מופיעה גם במנוחה. במינימום של 4.3 לאלקטרון יש 13.6 eV של תנועה, ולא בגלל חום. גם בגביש שמקררים עד האפס המוחלט, שבו $k_BT$ מתאפס, האטומים לא נעצרים, כי אטום עומד הוא אטום שמקומו ותנועתו ידועים יחד. התנועה הזו, **תנודת אפס** (zero-point motion), גדולה בהליום כל כך ביחס למשיכה החלשה בין אטומיו, שבלחץ רגיל הוא לא קופא לעולם <span class=\"cert\">ודאות: גבוהה<\/span>.\n\n"], ["box", "mcq", "שאלה", "מיקרוסקופ אלקטרונים ב-80 keV מראה את אטומי הפחמן בגרפן אחד-אחד. סטודנט מסיק שבאלומה חדה יותר אפשר יהיה לצלם גם את מסלול האלקטרון סביב הגרעין. מה התשובה הנכונה?\n- נכון, צריך רק להעלות את המתח עד שאורך הגל קטן בהרבה מ-$a_0$ — *אורך הגל כבר פיקומטרים, קטן מ-$a_0$ פי מאה; הבעיה אינה כוח ההפרדה.*\n- ✅ **אין מסלול לצלם: למקם את האלקטרון בתוך האטום עולה לפי (9) יותר מאנרגיית הקשר, ואילו את האטום הכבד כולו אפשר למקם בזול, כי המחיר מחולק במסה** — אותו $\\hbar^2/2mr^2$, עם מסה גדולה פי 21,900.\n- הבעיה היא שגיאת העדשות; אחרי תיקון שגיאה כדורית המסלול ייראה — *התיקון מביא את הרזולוציה לעשרות פיקומטרים, אבל לא משנה את (9).*\n- אי אפשר, כי המכה של האלומה מזיזה את האלקטרון, ואילו היינו מודדים בעדינות היינו רואים את המסלול — *זו התמונה ש\"המדידה מפריעה\"; הפיזורים מקיימים את (9) גם בלי שום מכה, כי אין לאלקטרון מקום ותנע מוגדרים יחד.*\n"], ["md", "\n### 4.6 אותו מחיר, בקנה מידה אחר\n\nהתשובה לשאלת הפרק עומדת על שני מספרים, $\\hbar$ ומסה, ולכן היא עובדת גם במקום שבוהר לא יכול היה להגיע אליו. עוצמת המשיכה עצמה, $ke^2$, היא מספר קטן בקנה המידה הקוונטי: היחס $\\alpha=ke^2/\\hbar c=1/137.036$, **קבוע המבנה הדק**, הוא גם מהירות האלקטרון במימן ביחידות של $c$, ולכן (11) הלא-יחסותית עבדה כל כך טוב. התורה המלאה של אור ומטענים לפי עקרונות הקוונטים, **אלקטרודינמיקה קוונטית** (QED), שנבנתה מדיראק (1928, שניבא גם את הפוזיטרון, שאנדרסון מצא ב-1932) ועד פיינמן ושווינגר, מכילה את החוקים של הכימיה כולה, ולא נמצאה לה סתירה מחוץ לגרעין <span class=\"cert\">ודאות: גבוהה<\/span>.\n\nובתוך הגרעין? אותו מחיר כליאה, $\\hbar^2/2Mr^2$, לפרוטון בתוך פמטומטר, $10^{-15}$ מ', הוא 20.7 MeV. בראש: לאלקטרון ב-1 Å המחיר 3.81 eV; מרחק קטן פי $10^5$ מגדיל אותו פי $10^{10}$, ומסה גדולה פי 1836 מקטינה אותו, ויוצאים $2\\times10^7$ eV, פי מיליון וחצי מאנרגיית המימן. כדי שגרעין יחזיק, צריך כוח שהרווח שלו עומד במחיר הזה, וזה מה שהחשמל לא יכול לספק. מכאן הפרק הבא.\n"]];
