<script>
const D=[["md", "## פרק 4: התורה הקוונטית: למה האטום גדול\n\nכל אטום מימן ביקום זהה לכל אטום מימן אחר: אותו גודל ואותם צבעים בדיוק כשהוא זוהר. ב-1873 אמר מקסוול שהזהות הזו נותנת למולקולות \"את האופי של מוצר מתועש\" <span class=\"cert\">ודאות: גבוהה<\/span>, והתכוון לכך כחידה: מכונה שמייצרת מוצרים זהים צריכה תבנית, ואיפה התבנית של האטום?\n\nהשאלה של הפרק היא שתי פנים של אותה חידה: **למה האלקטרון לא נופל אל הפרוטון, ולמה כל אטומי המימן באותו גודל?** נענה עליה מחוק אחד ושלושה קבועים, ונגזור את התשובה עד המספר האחרון. בדרך נלווה מכשיר אחד, מיקרוסקופ האלקטרונים, שנבנה בברלין באותן שנים בדיוק, בידי אנשים שלא ידעו שהם בונים אותו על התשובה. כל גבול של המכשיר הזה, מאורך הגל ועד הנזק לדוגמה, ייצא מאותן משוואות.\n\n**מה אנחנו כבר יודעים.**\n\n- חוק קולון והקבוע $ke^2$ (2.4), ו-$a_0=0.529$ Å, שנמדד ולא הוסבר.\n- תנע, כוח, ותאוצה בתנועה מעגלית $a=v^2/r$ (2.2).\n- מטען מואץ משדר גל (3.2).\n- מ-M0.1: ממוצע, RMS, הסתברות כשכיחות, ומינימום כאפס של הנגזרת.\n- מהשיעור הקודם: $k_BT$ כקנה המידה של תנועה תרמית.\n\n### 4.1 אטום שלא יכול להתקיים, 1911–1913\n\nב-1911 פרסם רתרפורד במנצ'סטר את מה שגייגר ומרסדן ראו כשירו חלקיקי אלפא על רדיד זהב. רובם עברו כמעט בלי לסטות, ומעטים חזרו לאחור, \"כאילו ירית פגז על נייר טישו והוא חזר ופגע בך\" <span class=\"cert\">ודאות: גבוהה<\/span>. ההסבר היחיד היה שכמעט כל המסה והמטען החיובי מרוכזים בגרעין זעיר, והאלקטרונים סביבו.\n\nזו הייתה תגלית, אבל גם אסון תאורטי. הניסיון הטבעי הוא מערכת שמש קטנה: האלקטרון מקיף את הפרוטון, וחוק קולון מספק את הכוח פנימה. אלא שאלקטרון במעגל מאיץ, ומטען מאיץ משדר. השאלה ההנדסית היא לא \"האם הוא מאבד אנרגיה\" אלא \"כמה מהר\". כדי לענות צריך הנהלת חשבונות של אנרגיה, ונבנה אותה עכשיו, כי נשתמש בה בכל הפרק.\n\n#### מטבע אחד: אנרגיה\n\nהמושג נולד במאה ה-19 משאלה מעשית של מהנדסים: כמה פחם צריך מנוע קיטור כדי להרים מים ממכרה <span class=\"cert\">ודאות: בינונית<\/span>. מה שקובע את המחיר הוא לא הכוח לבדו אלא הכוח כפול הדרך.\n\n"], ["box", "definition", "הגדרה: עבודה (work)", "כוח קבוע $F$ שפועל על גוף בכיוון התנועה שלו, בזמן שהגוף עובר דרך $d$, עושה עבודה\n$$w=Fd.$$\nכשהכוח מנוגד לתנועה, העבודה שלילית. היחידה היא ג'אול: $1\\ \\text{J}=1\\ \\text{N·m}$. לכוח משתנה מחלקים את הדרך לצעדים קטנים $dx$, שבכל אחד הכוח כמעט קבוע, ומסכמים $dw=F\\,dx$.\n"], ["md", "\nכוח לבדו אינו מדד: קיר שדוחפים ולא זז לא קיבל עבודה. רק המכפלה מודדת מה הכוח שינה.\n\n**אנרגיה קינטית.** כמה עבודה צריך כדי להביא מסה $m$ ממנוחה למהירות $v$? נפעיל כוח קבוע $F$ ונעקוב.\n\nהתאוצה קבועה:\n\n$$a=\\frac{F}{m}$$\n\nאחרי זמן $t$ המהירות והדרך הן:\n\n$$v=at,\\qquad d=\\tfrac12at^2$$\n\nנבודד $t=v/a$ ונציב בדרך:\n\n$$d=\\frac{v^2}{2a}$$\n\nהעבודה היא הכוח כפול הדרך, והתאוצה מצטמצמת:\n\n$$w=Fd=ma\\cdot\\frac{v^2}{2a}=\\tfrac12mv^2$$\n\nהתוצאה לא תלויה בתאוצה, כלומר לא תלויה באיך הגענו למהירות. זו העבודה האגורה בתנועה. נכתוב אותה בעזרת התנע $p=mv$, כי עקרון אי-הוודאות ייתן לנו תנע ולא מהירות:\n\n"], ["box", "formula", "נוסחה: אנרגיה קינטית (kinetic energy)", "$$K=\\frac12mv^2=\\frac{p^2}{2m}\\tag{8}$$\n$K$ בג'אולים, $p$ התנע, $m$ המסה. תקף כשהמהירות קטנה בהרבה מ-$c$.\n"], ["md", "\nה-$m$ במכנה הוא הנקודה שכל הפרק יסתובב סביבה: באותו תנע, גוף קל נושא הרבה אנרגיה. האלקטרון קל פי 1836 מהפרוטון, ולכן כל תנע שנכפה עליו יקר לו במיוחד. ההנחה \"מהירות קטנה מ-$c$\" תישבר בתוך המיקרוסקופ, ונתקן אותה שם.\n\n**אנרגיה פוטנציאלית.** גוף שנמשך אל מרכז צובר תנועה כשהוא מתקרב. נרצה כמות שמודדת את \"התנועה שעוד לא נצברה\".\n\n"], ["box", "definition", "הגדרה: אנרגיה פוטנציאלית (potential energy)", "לכוח $F(r)$ שפועל לאורך הקו למרכז ותלוי רק במרחק $r$ (חיובי החוצה), האנרגיה הפוטנציאלית היא פונקציה $U(r)$ שמקיימת\n$$F=-\\frac{dU}{dr}.\\tag{9}$$\n$U$ נקבעת עד קבוע; בכוחות שדועכים עם המרחק בוחרים $U=0$ באינסוף.\n"], ["md", "\nהמינוס אומר שהכוח דוחף לכיוון שבו $U$ יורדת, כמו כדור במורד. במשיכה בין אלקטרון לפרוטון הכוח הוא $F=-ke^2/r^2$, שלילי כלומר פנימה. ננחש פונקציה ונבדוק אותה בגזירה:\n\n$$U(r)=-\\frac{ke^2}{r}\\tag{10}$$\n\nהנגזרת שלה:\n\n$$\\frac{dU}{dr}=+\\frac{ke^2}{r^2}$$\n\nולכן $-dU/dr=-ke^2/r^2$, בדיוק הכוח. $U$ שלילית בכל מרחק סופי. \"שלילית\" פירושה \"פחות מאשר כשהחלקיקים רחוקים\", לא משהו פיזיקלי מוזר: אפס אחר היה מזיז את כל הערכים בקבוע, והכוח, שהוא שיפוע, לא היה משתנה.\n\n**שימור.** בצעד קטן $dr$ העבודה היא $F\\,dr$. לפי (9) זו בדיוק הירידה ב-$U$:\n\n$$dw=F\\,dr=-\\frac{dU}{dr}\\,dr=-dU$$\n\nובאותו צעד, לפי החשבון שנתן את (8), העבודה הופכת לאנרגיה קינטית:\n\n$$dw=dK$$\n\nשני השוויונים יחד נותנים $dK+dU=0$. האנרגיה הכוללת $E=K+U$ לא משתנה כשפועל רק כוח כזה. מצב **קשור** הוא $E<0$: כיוון ש-$K\\ge0$, תמיד $U\\le E<0$, והחלקיק לא מגיע לאינסוף. **אנרגיית הקשר** היא $-E$: העבודה שצריך להשקיע כדי להוציא את החלקיק לאינסוף ולהשאיר אותו שם במנוחה.\n\n"], ["box", "definition", "הגדרה: אלקטרון-וולט (electron-volt)", "**מתח** בין שתי נקודות הוא העבודה של השדה על מטען שעובר ביניהן, חלקי המטען; $1\\ \\text{V}=1\\ \\text{J/C}$. מטען $q$ שעובר מתח $V$ צובר אנרגיה קינטית $qV$.\n**אלקטרון-וולט** הוא מה שמטען $e$ צובר במתח של 1 V:\n$$1\\ \\text{eV}=1.602\\times10^{-19}\\ \\text{J}.$$\n"], ["md", "\nג'אול גדול מאוד לאטום, ולכן נעבוד ב-eV. שני מספרים בהם יחזרו בכל הפרק:\n\n$$ke^2=14.40\\ \\text{eV·Å},\\qquad k_BT\\,(300\\ \\text{K})=0.0259\\ \\text{eV}$$\n\n#### כמה מהר האטום הקלאסי מת\n\nעכשיו אפשר לחשב. ההנחות: אלקטרון נקודתי, מסלול מעגלי, מהירות קטנה מ-$c$, ושידור לפי הפיזיקה של 3.2. את קצב השידור של מטען מואץ חישב לרמור ב-1897; זו התוצאה הכמותית של 3.2, ונשתמש בה כנתון:\n\n"], ["box", "formula", "נוסחה: הספק השידור של מטען מואץ (נוסחת לרמור, Larmor)", "$$P=\\frac{2}{3}\\,\\frac{ke^2a^2}{c^3}\\tag{11}$$\n$P$ בוואט (ג'אול לשנייה), $a$ התאוצה, $c$ מהירות האור. תקף למטען נקודתי במהירות קטנה מ-$c$.\n"], ["md", "\n**צעד 1: אנרגיית המסלול.** בתנועה מעגלית כוח קולון מספק את התאוצה המרכזית:\n\n$$\\frac{mv^2}{r}=\\frac{ke^2}{r^2}$$\n\nנכפול ב-$r/2$ ונקבל את האנרגיה הקינטית:\n\n$$K=\\tfrac12mv^2=\\frac{ke^2}{2r}$$\n\nנוסיף את (10):\n\n$$E=K+U=\\frac{ke^2}{2r}-\\frac{ke^2}{r}=-\\frac{ke^2}{2r}$$\n\nהמסלול קשור, ו-$E$ יורדת כש-$r$ קטן. אלקטרון שמאבד אנרגיה חייב להתקרב.\n\n**צעד 2: התאוצה.** מאותה משוואת כוח:\n\n$$a=\\frac{ke^2}{mr^2}$$\n\n**צעד 3: ההספק.** נציב ב-(11):\n\n$$P=\\frac{2}{3}\\,\\frac{ke^2}{c^3}\\cdot\\frac{(ke^2)^2}{m^2r^4}=\\frac{2}{3}\\,\\frac{(ke^2)^3}{m^2c^3r^4}$$\n\nה-$r^4$ במכנה הוא הסיפור כולו: ככל שהאלקטרון מתקרב, הוא משדר חזק יותר, והנפילה מאיצה את עצמה.\n\n**צעד 4: קצב הנפילה.** האנרגיה שמשודרת יוצאת מ-$E$, כלומר $dE/dt=-P$. נגזור את $E$ מצעד 1 לפי הזמן:\n\n$$\\frac{dE}{dt}=\\frac{ke^2}{2r^2}\\,\\frac{dr}{dt}$$\n\nנשווה ל-$-P$ ונבודד את $dr/dt$:\n\n$$\\frac{dr}{dt}=-\\frac{4}{3}\\,\\frac{(ke^2)^2}{m^2c^3r^2}$$\n\nנגדיר אורך עזר, $r_e=ke^2/mc^2$, כדי שהביטוי ייראה פשוט:\n\n$$\\frac{dr}{dt}=-\\frac{4}{3}\\,\\frac{r_e^2c}{r^2}$$\n\n**צעד 5: זמן הקריסה.** נכפול ב-$3r^2$. אגף שמאל הוא בדיוק הנגזרת של $r^3$:\n\n$$\\frac{d(r^3)}{dt}=3r^2\\frac{dr}{dt}=-4r_e^2c$$\n\nהנגזרת קבועה, ולכן $r^3$ יורד בקצב קבוע, מ-$a_0^3$ לאפס. הזמן הוא הכמות חלקי הקצב:\n\n$$t=\\frac{a_0^3}{4r_e^2c}$$\n\n**צעד 6: המספרים.** האורך $r_e$ יוצא $2.82\\times10^{-15}$ מ'. נציב:\n\n$$t=\\frac{(5.29\\times10^{-11})^3}{4\\times(2.82\\times10^{-15})^2\\times3.00\\times10^{8}}=1.56\\times10^{-11}\\ \\text{s}$$\n\nכל החומר ביקום היה צריך להיעלם לפני שאור עובר חצי סנטימטר.\n\nכדאי לבדוק את ההנחות של החישוב עצמו, כמו שבודקים כל מודל לפני שסומכים עליו. הנחנו שהמסלול נשאר כמעט מעגלי, כלומר שבכל סיבוב האלקטרון מאבד חלק זעיר מהאנרגיה. ברדיוס $a_0$ הוא מאבד בסיבוב כ-$4\\times10^{-5}$ eV מתוך 13.6, ולכן ההנחה טובה מאוד. בסך הכול הוא מספיק להשלים כמאתיים אלף סיבובים. ההנחה \"מהירות קטנה מ-$c$\" נשברת רק ממש בסוף, כשהאלקטרון כבר עמוק בפנים, ולא משנה את המסקנה. המודל לא נכשל בפרט; הוא נכשל ביסוד.\n\n"], ["raw", "<figure><svg viewBox=\"0 0 520 300\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"13\" fill=\"none\" stroke=\"currentColor\">\n<path d=\"M240.0,150.0 L234.3,116.1 L218.4,85.8 L194.0,61.9 L163.5,46.8 L130.0,41.9 L96.7,47.5 L66.9,63.1 L43.4,87.1 L28.6,117.1 L23.8,150.0 L29.4,182.7 L44.7,212.0 L68.3,235.0 L97.7,249.5 L130.0,254.2 L162.1,248.7 L190.8,233.6 L213.3,210.5 L227.5,181.7 L232.1,150.0 L226.7,118.6 L211.9,90.5 L189.3,68.4 L161.0,54.5 L130.0,50.1 L99.3,55.4 L71.8,69.9 L50.2,92.0 L36.7,119.7 L32.3,150.0 L37.6,180.0 L51.7,206.9 L73.4,227.9 L100.4,241.1 L130.0,245.3 L159.3,240.2 L185.4,226.3 L205.9,205.1 L218.7,178.8 L222.8,150.0 L217.7,121.5 L204.2,96.1 L183.6,76.2 L158.0,63.8 L130.0,59.9 L102.3,64.8 L77.7,78.0 L58.4,98.0 L46.4,122.8 L42.7,150.0 L47.5,176.8 L60.3,200.6 L79.7,219.2 L103.8,230.8 L130.0,234.3 L155.9,229.6 L178.8,217.2 L196.6,198.4 L207.7,175.3 L211.0,150.0 L206.4,125.2 L194.5,103.2 L176.4,86.1 L154.2,75.6 L130.0,72.5 L106.3,77.0 L85.3,88.5 L69.1,105.8 L59.2,127.0 L56.4,150.0 L60.8,172.5 L71.8,192.3 L88.2,207.5 L108.3,216.8 L130.0,219.3 L151.1,215.0 L169.6,204.5 L183.7,189.0 L192.2,170.2 L194.3,150.0 L190.1,130.5 L180.2,113.5 L165.8,100.7 L148.5,93.2 L130.0,91.6 L112.3,95.7 L97.2,104.9 L86.1,118.1 L79.9,133.7 L78.9,150.0 L83.1,165.2 L91.7,177.9 L103.4,186.7 L116.7,191.0 L130.0,190.5 L141.6,185.8 L150.1,177.7 L154.2,167.6 L152.5,157.3 L130.0,150.0\" stroke-width=\"1.4\"/>\n<circle cx=\"240\" cy=\"150\" r=\"5\" fill=\"currentColor\"/>\n<circle cx=\"130\" cy=\"150\" r=\"4\" fill=\"currentColor\"/>\n<text x=\"130\" y=\"290\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">קלאסי: קריסה בתוך כ-10⁻¹¹ ש'<\/text>\n<text x=\"246\" y=\"140\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"start\">התחלה<\/text>\n<circle cx=\"390\" cy=\"150\" r=\"110\" stroke-width=\"2.5\"/>\n<circle cx=\"390\" cy=\"150\" r=\"4\" fill=\"currentColor\"/>\n<line x1=\"390\" y1=\"150\" x2=\"500\" y2=\"150\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n<text x=\"445\" y=\"143\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">a₀ = 0.529 Å<\/text>\n<text x=\"390\" y=\"168\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">פרוטון<\/text>\n<text x=\"390\" y=\"290\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">נמדד: גודל קבוע לכל אטום מימן<\/text>\n<\/svg>\n<figcaption>משמאל: אלקטרון קלאסי שמתחיל ברדיוס a₀, משדר ומסתחרר אל הפרוטון (מספר הסיבובים סכמטי; בחישוב הקלאסי הם כמאתיים אלף). מימין: הטבעת ברדיוס a₀ שבה נמצא אלקטרון במימן אמיתי, תמיד. שני הרדיוסים ההתחלתיים שווים; הפרוטון מוגדל מאוד.<\/figcaption><\/figure>"], ["md", "\nויש עדות שנייה, נגישה לכל מי שמחזיק מנסרה. אלקטרון בספירלה מקיף בתדר שעולה ברציפות, ולכן היה משדר קשת רציפה של צבעים. אטומים פולטים רק קווים חדים ומוגדרים, כמו באור של מנורת ניאון <span class=\"cert\">ודאות: גבוהה<\/span>.\n\n#### אין לתורה גודל\n\nגם אילו השידור נעצר איכשהו, התורה הקלאסית לא יודעת באיזה רדיוס האלקטרון יקיף. כוכב לכת יכול לנוע בכל רדיוס, ומרחק כדור הארץ מהשמש הוא תאונה היסטורית. כדי שחוק יקבע גודל, צריך לבנות אורך מהקבועים שבו. זה הכלי הראשון שמהנדס מפעיל על כל מודל: ניתוח מימדים.\n\nהיחידות של הקבועים שבידינו הן:\n\n$$[ke^2]=\\text{kg·m}^3\\text{/s}^2,\\qquad [m]=\\text{kg}$$\n\nנחפש אורך מהצורה $(ke^2)^\\alpha m^\\beta$. כדי שיצאו מטרים בלבד, החזקות של כל יחידה צריכות להתאזן:\n\n$$\\text{kg}:\\ \\alpha+\\beta=0,\\qquad \\text{m}:\\ 3\\alpha=1,\\qquad \\text{s}:\\ -2\\alpha=0$$\n\nהמשוואה של המטרים דורשת $\\alpha=\\tfrac13$, וזו של השניות דורשת $\\alpha=0$. אין פתרון. כל אורך שמנסים לבנות מביא איתו שניות, ושום דבר לא מבטל אותן.\n\nאם מוסיפים את $c$, יוצא אורך אחד, $r_e$ מצעד 4. אבל הוא קטן מ-$a_0$ פי כ-19 אלף. התורה הקלאסית מנבאת אפוא שני דברים, ושניהם שגויים: שהאטום קורס, ושאין לו גודל מועדף. חסר קבוע טבע.\n\n### 4.2 הקבוע החסר, ובוהר שהשתמש בו בלי סיבה, 1900–1925\n\nקבוע כזה כבר היה קיים, אף שאיש לא חשב עליו כעל קבוע של האטום. ב-1900, כדי להתאים נוסחה לקרינה של גוף חם, הניח פלאנק שאנרגיה מוחלפת עם האור רק בחבילות. הוא עצמו קרא לזה אחר כך \"מעשה של ייאוש\" <span class=\"cert\">ודאות: גבוהה<\/span>, וקיווה שהקבוע ייעלם כשיובן טוב יותר.\n\nב-1905 לקח איינשטיין את החבילות ברצינות ואמר שהאור עצמו עשוי מהן. מיליקן, שניסה להפריך זאת בניסויים, אישר ב-1916 את התחזית ועדיין לא האמין לה <span class=\"cert\">ודאות: גבוהה<\/span>.\n\n"], ["box", "formula", "נוסחה: אנרגיית הפוטון", "$$E=hf,\\qquad h=6.626\\times10^{-34}\\ \\text{J·s}\\tag{12}$$\n$E$ האנרגיה של חבילה אחת, **פוטון**, $f$ תדר הגל. נוח גם בצורה $E=hc/\\lambda$, עם $hc=1240$ eV·nm.\n"], ["md", "\nהיחידות של $h$ הן ג'אול כפול שנייה, כלומר תנע כפול אורך. נבדוק אם הן מה שחסר. נוח לעבוד עם $\\hbar=h/2\\pi$, שיש לו אותן יחידות:\n\n$$[\\hbar]=\\text{kg·m}^2\\text{/s}$$\n\nנחפש אורך $L$ מהצורה $\\hbar^a m^b (ke^2)^c$ ונאזן שוב:\n\n$$\\text{kg}:\\ a+b+c=0$$\n\n$$\\text{m}:\\ 2a+3c=1$$\n\n$$\\text{s}:\\ -a-2c=0$$\n\nמהמשוואה השלישית $a=-2c$. נציב בשנייה: $-4c+3c=1$, כלומר $c=-1$. מכאן $a=2$, ומהראשונה $b=-1$. יש פתרון, והוא יחיד:\n\n$$L=\\frac{\\hbar^2}{m\\,ke^2}$$\n\nנציב מספרים ביחידות נוחות. ($\\hbar^2/m=7.62$ eV·Å², נתון שיחזור.)\n\n$$\\frac{\\hbar^2}{m\\,ke^2}=\\frac{7.62\\ \\text{eV·Å}^2}{14.40\\ \\text{eV·Å}}=0.529\\ \\text{Å}$$\n\nזה בדיוק $a_0$. ניתוח מימדים נותן את הצורה ואת סדר הגודל, אבל לא את המקדם, ולא את הסיבה. כאן המקדם יצא 1, ועוד נראה שזה לא מובן מאליו.\n\n**בוהר, 1913: התשובה הנכונה בלי סיבה.** נילס בוהר, דני צעיר שעבד ב-1912 אצל רתרפורד, עשה צעד נועז. הוא **קבע** שהאלקטרון נע רק במסלולים שבהם התנע הזוויתי $mvr$ הוא כפולה שלמה של $\\hbar$, ושבמסלולים האלה הוא פשוט לא משדר. נגזור מה יוצא מזה.\n\nהתנאי של בוהר:\n\n$$mvr=n\\hbar,\\qquad n=1,2,3,\\dots$$\n\nמשוואת הכוח מצעד 1, כפול $r^2$:\n\n$$mv^2r=ke^2$$\n\nמהתנאי, $v=n\\hbar/(mr)$. נציב:\n\n$$m\\left(\\frac{n\\hbar}{mr}\\right)^2r=\\frac{n^2\\hbar^2}{mr}=ke^2$$\n\nנבודד את $r$:\n\n$$r_n=n^2\\,\\frac{\\hbar^2}{m\\,ke^2}=n^2a_0$$\n\nונציב באנרגיה מצעד 1:\n\n$$E_n=-\\frac{ke^2}{2r_n}=-\\frac{1}{n^2}\\,\\frac{ke^2}{2a_0}=-\\frac{13.6\\ \\text{eV}}{n^2}$$\n\nהבדיקה המכרעת הייתה הספקטרום. ב-1885 מצא בלמר, מורה בבזל, נוסחה אמפירית לקווי המימן בלי שום הסבר. לפי בוהר, קו הוא פוטון שנפלט כשהאלקטרון יורד ממסלול למסלול, והאנרגיה שלו היא ההפרש. במעבר מ-3 ל-2:\n\n$$hf=E_3-E_2=13.6\\ \\text{eV}\\left(\\frac14-\\frac19\\right)=1.89\\ \\text{eV}$$\n\nולפי (12):\n\n$$\\lambda=\\frac{hc}{hf}=\\frac{1240\\ \\text{eV·nm}}{1.89\\ \\text{eV}}=656\\ \\text{nm}$$\n\nזה הקו האדום של המימן, כפי שנמדד <span class=\"cert\">ודאות: גבוהה<\/span>. מספר שנמדד במשך עשרות שנים יצא מארבעה קבועים.\n\nובכל זאת, מהנדס היה צריך לחשוד. הכלל לא הוסבר; הוא הוכרז. למה דווקא התנע הזוויתי? למה אלקטרון מאיץ לא משדר, כשכל אנטנה בעולם מוכיחה שהוא כן? בוהר הדביק חוק חדש על פיזיקה ישנה שסותרת אותו. מודל כזה עובד בדיוק עד הפעם הראשונה שמחוץ לתחום שבו כויל, ובעשור הבא זה קרה. הוא נכשל באטום ההליום, בעל שני אלקטרונים, ובפיצול הקווים בשדה מגנטי.\n\nבמאי 1925 כתב פאולי לחבר: \"הפיזיקה שוב מבולבלת מאוד כרגע; בכל אופן היא קשה מדי בשבילי, והלוואי שהייתי שחקן קומי בקולנוע ולא שמעתי מעולם על פיזיקה\" <span class=\"cert\">ודאות: גבוהה<\/span>. התשובה שנבנה עכשיו היא זו שהחליפה את הטלאי: לא כלל על מסלולים, אלא חוק שאומר שאין מסלולים בכלל.\n\n### 4.3 גל בלי מסלול: דה ברויי, הייזנברג ומיקרוסקופ מחשבתי\n\nהרמז הראשון בא מכיוון לא צפוי. לואי דה ברויי, צעיר ממשפחת אצולה צרפתית שעבר מהיסטוריה לפיזיקה, הציע בעבודת הדוקטורט שלו ב-1924 היפוך של איינשטיין: אם לגל של אור יש חלקיק, אולי לחלקיק יש גל.\n\n"], ["box", "formula", "נוסחה: אורך הגל של חלקיק (de Broglie wavelength)", "$$\\lambda=\\frac{h}{p}\\tag{13}$$\n$\\lambda$ במטרים, $p$ התנע. תקף לכל חלקיק, גם במהירות קרובה ל-$c$ (אז $p$ הוא התנע היחסותי). נוח גם במספר הגל $k=2\\pi/\\lambda$: $p=\\hbar k$.\n"], ["md", "\nהוועדה בפריז לא ידעה מה לעשות בזה, ולנז'בן שלח את העבודה לאיינשטיין, שכתב שהיא \"מרימה פינה של הצעיף הגדול\" <span class=\"cert\">ודאות: בינונית<\/span>. הרעיון נתן לכלל של בוהר סיבה. גל שמקיף את הגרעין חייב להיסגר על עצמו, אחרת הוא מבטל את עצמו בהתאבכות. כלומר, היקף המסלול הוא מספר שלם של אורכי גל:\n\n$$n\\lambda=2\\pi r$$\n\nנציב את (13):\n\n$$n\\,\\frac{h}{p}=2\\pi r$$\n\nונסדר:\n\n$$pr=n\\,\\frac{h}{2\\pi}=n\\hbar$$\n\nזה בדיוק הכלל שבוהר הכריז. אבל ההסבר פתח שאלה גרועה מזו שסגר: אם האלקטרון הוא גל שפרוש סביב הגרעין, איפה האלקטרון? ומה, בדיוק, מתנודד?\n\nב-1925 ורנר הייזנברג, בן 23, ברח מקדחת השחת לאי הלגולנד ובנה שם תורה שוויתרה מראש על מסלולים, ועסקה רק במה שנמדד: בתדרים ובעוצמות של קווי הספקטרום. ב-1926 כתב שרדינגר משוואה לגל של האלקטרון, ובורן הציע שעוצמת הגל בכל נקודה היא ההסתברות למצוא שם את האלקטרון. וב-1927 מצא הייזנברג את המשפט שמסביר מה התורה החדשה אוסרת. כדי לנסח אותו במספרים צריך קודם מדד ל\"כמה לא ידוע\".\n\n#### פיזור\n\nנכין את אותו מצב פעמים רבות, למשל אלקטרון שכלוא באותה קופסה, ונמדוד בכל פעם את מקומו. התוצאות יתפזרו סביב ממוצע.\n\n"], ["box", "definition", "הגדרה: פיזור (סטיית תקן, standard deviation)", "לגודל $x$ שמקבל ערכים שונים במדידות חוזרות של אותו מצב, עם ממוצע $\\langle x\\rangle$, הפיזור הוא\n$$\\sigma_x=\\sqrt{\\left\\langle\\left(x-\\langle x\\rangle\\right)^2\\right\\rangle}.$$\nהסוגריים $\\langle\\cdot\\rangle$ הם ממוצע על כל המדידות. $\\sigma_x\\ge0$, ביחידות של $x$, ושווה לאפס רק כשכל המדידות זהות. בפיזיקה מסמנים אותו גם $\\Delta x$.\n"], ["md", "\nההגדרה בנויה בארבעה צעדים, ולכל אחד סיבה:\n\n1. מחסירים את הממוצע, כי מעניינת אותנו הסטייה ממנו ולא המיקום עצמו.\n2. מעלים בריבוע, כי בלי זה סטיות חיוביות ושליליות היו מבטלות זו את זו.\n3. ממצעים, כדי לקבל מספר אחד.\n4. מוציאים שורש, כדי לחזור ליחידות של $x$.\n\n**דוגמה.** שלוש מדידות: 1, 2 ו-3 ס\"מ. הממוצע 2 ס\"מ, והסטיות $-1$, 0 ו-1. ממוצע הריבועים הוא $\\tfrac23$, והפיזור:\n\n$$\\sigma_x=\\sqrt{2/3}=0.816\\ \\text{cm}$$\n\nנצטרך עוד זהות אחת. נפתח את הריבוע שבהגדרה, עם $\\mu=\\langle x\\rangle$:\n\n$$(x-\\mu)^2=x^2-2\\mu x+\\mu^2$$\n\nנמצע איבר-איבר. הממוצע של $x$ הוא $\\mu$:\n\n$$\\sigma_x^2=\\langle x^2\\rangle-2\\mu^2+\\mu^2=\\langle x^2\\rangle-\\langle x\\rangle^2$$\n\nולכן כשהממוצע אפס, הפיזור בריבוע הוא פשוט ממוצע הריבוע. אטום במנוחה הוא בדיוק כזה, לגבי התנע: $\\langle p\\rangle=0$, ולכן $\\langle p^2\\rangle=(\\Delta p)^2$. זה הגשר שיחבר את אי-הוודאות לאנרגיה (8).\n\n#### החוק\n\n"], ["box", "formula", "נוסחה: עקרון אי-הוודאות (uncertainty principle)", "$$\\Delta x\\,\\Delta p\\ge\\frac{\\hbar}{2},\\qquad \\hbar=\\frac{h}{2\\pi}=1.055\\times10^{-34}\\ \\text{J·s}\\tag{14}$$\n$\\Delta x$ ו-$\\Delta p$ הם הפיזורים של המקום והתנע באותו כיוון, בהרבה מדידות של אותו מצב. תקף לכל חלקיק ולכל מצב, בכל כיוון בנפרד.\n"], ["md", "\nהייזנברג כתב את החוק כאומדן. את הצורה המדויקת, עם הפיזורים שהגדרנו והגורם $\\tfrac12$, הוכיח קנארד באותה שנה <span class=\"cert\">ודאות: גבוהה<\/span>. מהנדס לא צריך לקבל אותו כגזירה מגבוה; אפשר לראות מאיפה הוא בא, מתכונה של כל גל.\n\n**מאיפה זה בא: חבילת גל.** גל בעל אורך גל אחד, $\\cos(kx)$, פרוש על כל הציר; אין לו מקום. כדי לקבל גל מרוכז, מחברים הרבה גלים במספרי גל שונים, עם משרעת $A(k)$ לכל אחד. הם מתחזקים זה את זה ליד $x=0$ ומבטלים זה את זה רחוק ממנו. נבחר משרעת בצורת פעמון:\n\n$$A(k)=e^{-k^2/4\\sigma_k^2}$$\n\nההסתברות למצוא מספר גל $k$ היא עוצמת המשרעת, הריבוע שלה:\n\n$$|A(k)|^2=e^{-k^2/2\\sigma_k^2}$$\n\nזו עקומת פעמון עם פיזור $\\sigma_k$ בדיוק (פעמון מהצורה $e^{-x^2/2\\sigma^2}$ הוא ההתפלגות הנורמלית עם פיזור $\\sigma$). עכשיו נחבר את הגלים. נשתמש בזהות האינטגרל של הפעמון, שמוכחים בהשלמה לריבוע:\n\n$$\\int_{-\\infty}^{\\infty}e^{-\\beta k^2}\\cos(kx)\\,dk=\\sqrt{\\frac{\\pi}{\\beta}}\\;e^{-x^2/4\\beta}$$\n\nאצלנו $\\beta=1/4\\sigma_k^2$, ולכן $1/4\\beta=\\sigma_k^2$:\n\n$$\\psi(x)=\\int A(k)\\cos(kx)\\,dk\\ \\propto\\ e^{-\\sigma_k^2x^2}$$\n\nההסתברות למצוא את החלקיק ב-$x$ היא שוב הריבוע:\n\n$$|\\psi(x)|^2\\propto e^{-2\\sigma_k^2x^2}=e^{-x^2/2\\sigma_x^2},\\qquad \\sigma_x=\\frac{1}{2\\sigma_k}$$\n\nכלומר:\n\n$$\\sigma_x\\,\\sigma_k=\\frac12$$\n\nזה משפט על גלים בלבד, בלי שום פיזיקה. הפיזיקה נכנסת בצעד אחד, (13) בצורה $p=\\hbar k$, שהופך פיזור של מספרי גל לפיזור של תנע:\n\n$$\\sigma_x\\,\\sigma_p=\\hbar\\,\\sigma_x\\sigma_k=\\frac{\\hbar}{2}$$\n\nהפעמון הוא הצורה הטובה ביותר; כל צורה אחרת נותנת מכפלה גדולה יותר, ומכאן ה-$\\ge$ ב-(14). ההוכחה הכללית משתמשת באי-שוויון קושי-שוורץ, ולא נצטרך אותה. מה שכן צריך לזכור: ה-$\\tfrac12$ שייך לפיזורים במובן המדויק שהגדרנו. מי שמגדיר \"רוחב\" אחר, למשל רוחב בחצי גובה, יקבל מקדם אחר. זו טעות נפוצה בהשוואת מפרטים בין תחומים.\n\n"], ["raw", "<div class=\"note\">[chart: מקום צר, תנע רחב]<\/div>"], ["md", "\n**מה החוק משנה.** בעולם הקלאסי אפשר לצמצם את שני הפיזורים יחד עד אפס, ומסלול הוא בדיוק זה: מקום ומהירות חדים בכל רגע. (14) אומר שמצב כזה לא קיים. בקופסה צרה פי 2, פיזור התנע גדל לפחות פי 2.\n\n$\\hbar$ זעיר, ולכן ביום-יום החוק בלתי נראה. ניקח גרגר אבק במסה $10^{-15}$ ק\"ג שמקומו ידוע עד מיקרומטר. פיזור המהירות המינימלי שלו:\n\n$$\\Delta v=\\frac{\\hbar}{2m\\,\\Delta x}=\\frac{1.055\\times10^{-34}}{2\\times10^{-15}\\times10^{-6}}=5.3\\times10^{-14}\\ \\text{m/s}$$\n\nזה כ-1.7 מיקרומטר בשנה. אותו חשבון לאלקטרון שכלוא ב-1 Å:\n\n$$\\Delta v=\\frac{1.055\\times10^{-34}}{2\\times9.11\\times10^{-31}\\times10^{-10}}=5.8\\times10^{5}\\ \\text{m/s}$$\n\nהמסה הקטנה פי $10^{15}$ והקופסה הצרה פי $10^4$ הופכות זחילה בלתי מורגשת לחצי מיליון מטרים לשנייה. באטום החוק קובע הכול.\n\n#### המיקרוסקופ של הייזנברג, והטעות שבו\n\nהייזנברג הסביר את החוק בניסוי מחשבתי, ויש בזה אירוניה. ב-1923, בבחינת הדוקטורט במינכן, שאל אותו וין מה כוח ההפרדה של מיקרוסקופ. הוא לא ידע, וכמעט נכשל <span class=\"cert\">ודאות: גבוהה<\/span>. ארבע שנים אחר כך בנה את הטיעון שלו על מיקרוסקופ. נעשה את החשבון כמו שבוהר תיקן אותו, כי החשבון הזה הוא גם הבסיס לכל מיקרוסקופ אמיתי בהמשך.\n\nמאירים אלקטרון באור באורך גל $\\lambda$, ואוספים את האור המפוזר בעדשה. העדשה רואה את האלקטרון מתוך קונוס בחצי זווית $\\theta$, **הצמצם** שלה.\n\n**צעד 1: כמה טוב רואים.** עדשה בצמצם $\\theta$ מבחינה בין שתי נקודות רק אם המרחק ביניהן גדול בערך מ-\n\n$$\\Delta x\\approx\\frac{\\lambda}{2\\sin\\theta}$$\n\nזה גבול ההפרדה של אבה, ונחזור אליו בצורה ההנדסית שלו ב-4.5. צמצם רחב וגל קצר רואים טוב.\n\n**צעד 2: כמה חזק בועטים.** לפוטון יש לפי (13) תנע $h/\\lambda$. הוא נאסף אם נכנס לעדשה בכל זווית בתוך הקונוס, ולכן הרכיב האופקי של התנע שלו יכול להיות כל ערך בין שני הקצוות:\n\n$$-\\frac{h}{\\lambda}\\sin\\theta\\ \\ \\dots\\ \\ +\\frac{h}{\\lambda}\\sin\\theta$$\n\nאין דרך לדעת איפה בתוך העדשה הוא עבר; זה כל העניין בעדשה. לפי שימור התנע, האלקטרון קיבל את אותה בעיטה בכיוון ההפוך, ולכן הפיזור בתנע שלו:\n\n$$\\Delta p\\approx\\frac{2h}{\\lambda}\\sin\\theta$$\n\n**צעד 3: המכפלה.**\n\n$$\\Delta x\\,\\Delta p\\approx\\frac{\\lambda}{2\\sin\\theta}\\cdot\\frac{2h\\sin\\theta}{\\lambda}=h$$\n\nשני כפתורי התכנון, $\\lambda$ ו-$\\theta$, מצטמצמים לגמרי. זו חתימה שמהנדס לומד לזהות: כשכל שיפור בפרמטר אחד נאכל בדיוק בפרמטר אחר, בכל תכנון אפשרי, הבעיה היא לא בתכנון אלא בחוק.\n\nבטיוטה של הייזנברג חסר צעד 2 בצורה הזו. הוא ייחס את הבעיטה לפוטון בתנע ידוע, ושכח את הצמצם, שממנו נובע שכיוון הפוטון לא ידוע. בוהר, שקרא את הטיוטה בקופנהגן, הראה לו את זה. הוויכוח היה קשה עד כדי כך שהייזנברג סיפר שפרץ בבכי <span class=\"cert\">ודאות: בינונית<\/span>, והמאמר יצא עם הערת תיקון בסופו.\n\nהמחלוקת לא הייתה טכנית. התמונה של \"המדידה מפריעה\" מניחה שיש לאלקטרון מקום ותנע מוגדרים, ושרק לא הצלחנו לדעת אותם. בוהר טען שאין מה לדעת. גם כשמודדים בחצי מאלקטרונים זהים רק את המקום, ובחצי השני רק את התנע, בלי שום בעיטה משותפת, הפיזורים מקיימים את (14). חבילת הגל הראתה את זה ישירות: המכפלה $\\tfrac{\\hbar}{2}$ יצאה מצורת הגל, בלי שום מכשיר. אי-הוודאות היא תכונה של המצב, לא פגם במכשיר.\n\n"], ["box", "domain", "חיבור לתחום אחר: אותו חשבון במכ\"ם: אורך פולס מול רוחב פס", "החבילה של 4.3 היא בדיוק פולס מכ\"ם: אות קצר בזמן מורכב בהכרח מטווח רחב של תדרים. שם המשפט הוא $\\sigma_t\\,\\sigma_\\omega\\ge\\tfrac12$, ומהנדסי מכ\"ם כותבים אותו בקירוב גס כ-$B\\approx1/\\tau$.\n\n**הגזירה של כושר ההפרדה בטווח, צעד-צעד:**\n\n1. פולס שנמשך $\\tau$ תופס במרחב אורך $c\\tau$.\n2. שני מטוסים נבדלים רק אם ההדים שלהם לא חופפים בזמן. ההד עובר את הדרך הלוך-חזור, ולכן הפרש טווח $\\Delta R$ נותן הפרש זמן $2\\Delta R/c$.\n3. התנאי $2\\Delta R/c>\\tau$ נותן:\n$$\\Delta R=\\frac{c\\tau}{2}$$\n4. נציב $\\tau\\approx1/B$:\n$$\\Delta R=\\frac{c}{2B}$$\n\n**מספרים.** פולס של מיקרו-שנייה, כמו במכ\"ם שדה תעופה ASR-9 <span class=\"cert\">ודאות: בינונית<\/span>, נותן כושר הפרדה של 150 מ'.\n\nכדי לרדת ל-15 מ' צריך פס של 10 MHz.\n\nזה אותו יחס כמו באטום: אלקטרון צר פי 10 צריך פיזור תנע גדול פי 10.\n\n**איפה זה נשבר.** במכ\"ם הגבול הוא חסם תחתון על הפס, לא שוויון. בדחיסת פולס (chirp) משדרים פולס ארוך עם פס רחב, ומקבלים גם אנרגיה רבה וגם הפרדה טובה. במכ\"ם גם מודדים את כל צורת הגל, משרעת ופאזה, בירייה אחת. באטום אין אות למדוד: כל אלקטרון נותן נקודה אחת, והפיזור נראה רק כשכיחות בהרבה חזרות.\n"], ["md", "\n### 4.4 מחיר מול רווח: הגודל יוצא מהחוק\n\nעכשיו אפשר לענות על השאלה של הפרק. אילו האלקטרון ישב על הפרוטון, $\\Delta x$ היה כמעט אפס, ולפי (14) פיזור התנע היה עצום. תנע עצום הוא לפי (8) אנרגיה קינטית עצומה, והאלקטרון לא היה נשאר שם. הנפילה עולה כסף. נחשב כמה.\n\n**האומדן, עם כל הנחה גלויה.** כל הנחה היא נקודה שבה המודל עלול להישבר, ולכן נכתוב כל אחת בנפרד.\n\n**הנחה 1.** אלקטרון שנמצא בתוך מרחק $a$ מהפרוטון מפוזר במקום על פני $a$ בערך:\n\n$$\\Delta x\\approx a$$\n\n**הנחה 2.** לפי (14), פיזור התנע הוא לפחות בסדר של $\\hbar/a$. את הגורם $\\tfrac12$ נשמיט, כי זה אומדן, ונחזור אליו בביקורת:\n\n$$\\Delta p\\approx\\frac{\\hbar}{a}$$\n\n**הנחה 3.** האטום במנוחה, ולכן $\\langle p\\rangle=0$, ולפי הזהות של הפיזור:\n\n$$\\langle p^2\\rangle=(\\Delta p)^2\\approx\\frac{\\hbar^2}{a^2}$$\n\n**צעד.** לפי (8), האנרגיה הקינטית הממוצעת:\n\n$$\\langle K\\rangle=\\frac{\\langle p^2\\rangle}{2m}\\approx\\frac{\\hbar^2}{2ma^2}$$\n\n**הנחה 4.** את האנרגיה הפוטנציאלית נאמוד לפי (10) במרחק $a$. נחבר:\n\n"], ["box", "formula", "נוסחה: אנרגיית האטום לפי גודלו (אומדן אי-הוודאות)", "$$E(a)\\approx\\frac{\\hbar^2}{2ma^2}-\\frac{ke^2}{a}\\tag{15}$$\n$a$ גודל האזור שבו האלקטרון כלוא, $m$ מסת האלקטרון. האיבר הראשון הוא מחיר הכליאה, השני רווח המשיכה. אומדן לסדר גודל, לחלקיק יחיד, במהירות קטנה בהרבה מ-$c$.\n"], ["md", "\nהכול נמצא בחזקות. כשהאלקטרון מתקרב פי 2, הרווח גדל פי 2 והמחיר פי 4. מרחוק הרווח שולט, מקרוב המחיר, ובאמצע יש מרחק אחד שבו הסכום הכי נמוך. שם האלקטרון נמצא, כי שם הוא לא יכול לרדת עוד באנרגיה.\n\n"], ["raw", "<div class=\"note\">[chart: מחיר הכליאה מול רווח המשיכה]<\/div>"], ["md", "\n**המינימום, צעד-צעד.**\n\n**צעד 1.** גוזרים את (15) לפי $a$:\n\n$$\\frac{dE}{da}=-\\frac{\\hbar^2}{ma^3}+\\frac{ke^2}{a^2}$$\n\n**צעד 2.** במינימום הנגזרת מתאפסת:\n\n$$-\\frac{\\hbar^2}{ma^3}+\\frac{ke^2}{a^2}=0$$\n\n**צעד 3.** כופלים ב-$a^3$, כדי להיפטר מהמכנים:\n\n$$-\\frac{\\hbar^2}{m}+ke^2\\,a=0$$\n\n**צעד 4.** מבודדים את $a$:\n\n$$a_0=\\frac{\\hbar^2}{m\\,ke^2}$$\n\n**צעד 5.** מוודאים שזה מינימום ולא מקסימום. הנגזרת השנייה:\n\n$$\\frac{d^2E}{da^2}=\\frac{3\\hbar^2}{ma^4}-\\frac{2ke^2}{a^3}$$\n\nלפי צעד 4, $\\hbar^2/m=ke^2a_0$. נציב ב-$a=a_0$:\n\n$$\\left.\\frac{d^2E}{da^2}\\right|_{a_0}=\\frac{3ke^2}{a_0^3}-\\frac{2ke^2}{a_0^3}=\\frac{ke^2}{a_0^3}>0$$\n\nחיובית, ולכן מינימום. למספר הזה יש גם משמעות הנדסית: הוא הקשיחות של האטום, כמה אנרגיה עולה לדחוס אותו. ערכו כ-97 eV ל-Å². זה הסדר של הקשיחות שנראה בהמשך במוצקים.\n\n**צעד 6.** האנרגיה במינימום. האיבר הראשון, עם $\\hbar^2/m=ke^2a_0$:\n\n$$K=\\frac{\\hbar^2}{2ma_0^2}=\\frac{ke^2a_0}{2a_0^2}=\\frac{ke^2}{2a_0}$$\n\nהאיבר השני:\n\n$$U=-\\frac{ke^2}{a_0}$$\n\nהסכום:\n\n$$E_{min}=\\frac{ke^2}{2a_0}-\\frac{ke^2}{a_0}=-\\frac{ke^2}{2a_0}$$\n\n**צעד 7.** מספרים:\n\n$$a_0=\\frac{7.62\\ \\text{eV·Å}^2}{14.40\\ \\text{eV·Å}}=0.529\\ \\text{Å}$$\n\n$$E_{min}=-\\frac{14.40\\ \\text{eV·Å}}{2\\times0.529\\ \\text{Å}}=-13.6\\ \\text{eV}$$\n\n"], ["box", "formula", "נוסחה: רדיוס בוהר ואנרגיית הקשר של המימן", "$$a_0=\\frac{\\hbar^2}{m\\,ke^2}=0.529\\ \\text{Å}\\tag{16}$$\n$$E_{min}=-\\frac{ke^2}{2a_0}=-\\frac{m(ke^2)^2}{2\\hbar^2}=-13.6\\ \\text{eV}\\tag{17}$$\nאנרגיית הקשר היא 13.6 eV. תקף לאלקטרון אחד סביב גרעין; לגרעין במטען $Ze$ מחליפים $ke^2$ ב-$Zke^2$.\n"], ["md", "\nזה הרדיוס של בוהר, אבל הפעם בלי שום כלל על מסלולים. הוא יצא מחוק אחד על מה שאפשר לדעת, והוא עונה על שני חלקי השאלה יחד. האלקטרון לא נופל, כי נפילה היא כליאה, וכליאה עולה יותר ממה שהמשיכה מחזירה. וכל אטומי המימן זהים, כי המינימום תלוי רק ב-$\\hbar$, ב-$m$ וב-$ke^2$, שזהים בכל מקום. אין באטום \"היסטוריה\" שתבחר רדיוס אחר, כמו שיש למערכת השמש. התבנית שמקסוול חיפש היא הקבועים.\n\n**מה שולט בתוצאה.** לפי (16), $a_0$ גדל כמו $\\hbar^2$. כש-$\\hbar\\to0$, גם $a_0\\to0$, וזו בדיוק הקריסה של 4.1: התורה הקוונטית היא שעושה את האטום גדול. לחלקיק כבד הכליאה זולה, ולכן האטום שלו קטן; לפי (17) אנרגיית הקשר גדלה ביחס ישר למסה. משיכה חזקה מקרבת, והאנרגיה גדלה כמו ריבוע המשיכה.\n\nובמינימום יש חלוקה קבועה. האנרגיה הקינטית היא $+13.6$ eV והפוטנציאלית $-27.2$ eV, כלומר:\n\n$$K=-E_{min},\\qquad U=2E_{min}$$\n\nהאלקטרון באטום, במצב הנמוך ביותר שלו, נע, ולא יכול שלא לנוע.\n\n**בדיקת הנחה: האם באמת מותר להזניח את היחסות?** הנחנו ש-(8) תקפה, כלומר שהאלקטרון איטי בהרבה מהאור. אפשר לבדוק את זה מתוך התוצאה עצמה, וזה הרגל שכדאי לאמץ: כל מודל צריך לבדוק את ההנחות של עצמו. מ-$K=ke^2/2a_0$ ו-(16):\n\n$$\\tfrac12mv^2=\\frac{ke^2}{2a_0}=\\frac{ke^2\\cdot m\\,ke^2}{2\\hbar^2}$$\n\nה-$m$ ו-$\\tfrac12$ מצטמצמים:\n\n$$v=\\frac{ke^2}{\\hbar}$$\n\nוביחס למהירות האור:\n\n$$\\frac{v}{c}=\\frac{ke^2}{\\hbar c}=\\frac{1}{137.0}$$\n\nההנחה מחזיקה, בשוליים של כ-0.7%. המספר הטהור הזה, $\\alpha=ke^2/\\hbar c$, יחזור בסוף הפרק.\n\n**מול המדידה: תקציב שגיאה.** האנרגיה שנמדדת לקריעת אלקטרון ממימן היא 13.598 eV <span class=\"cert\">ודאות: גבוהה<\/span>. שלנו יצאה 13.606, גבוהה ב-0.06%. מהנדס לא מסתפק ב\"קרוב\"; הוא שואל איזו הנחה אחראית לפער.\n\nהחשודה היא הנחה שלא כתבנו בכלל: שהפרוטון עומד במקום. הפרוטון כבד רק פי 1836, ולכן גם הוא נע סביב מרכז המסה המשותף. התיקון המדויק מחליף את $m$ ב**מסה המצומצמת**:\n\n$$\\mu=\\frac{mM}{m+M}=\\frac{m}{1+m/M}$$\n\nלפי (17), $E$ ביחס ישר למסה, ולכן:\n\n$$E=\\frac{13.606\\ \\text{eV}}{1+1/1836}=13.598\\ \\text{eV}$$\n\nהפער נסגר עד הספרה האחרונה. התיקון הבא בתור הוא היחסות, בסדר $\\alpha^2$, כ-$5\\times10^{-5}$. כך נראה תקציב שגיאה: כל הנחה מקבלת מחיר, ויודעים מה נשאר.\n\n**ביקורת: למה אומדן גס יוצא מדויק?** הדיוק מטעה. בתורה המלאה, במצב היסודי של המימן, פיזור המקום בכל ציר הוא $a_0$ בדיוק. אבל $\\hbar/a_0$ הוא פיזור התנע הכולל, בשלושת הצירים יחד, ובכל ציר בנפרד:\n\n$$\\Delta p_x=\\frac{\\hbar}{\\sqrt3\\,a_0},\\qquad \\Delta x\\,\\Delta p_x=\\frac{\\hbar}{\\sqrt3}\\approx0.58\\,\\hbar$$\n\nהמכפלה גבוהה מ-$\\tfrac{\\hbar}{2}$: המצב היסודי של המימן אינו מצב של אי-ודאות מינימלית. ההנחות 1 ו-2 נבחרו בלי הצדקה מדויקת, ובמקרה השגיאות שלהן מבטלות זו את זו <span class=\"cert\">ודאות: גבוהה<\/span>.\n\nאילו היינו שומרים את ה-$\\tfrac12$ של (14), המחיר היה קטן פי 4. האטום היה יוצא 0.132 Å, והקשר 54.4 eV, פי 4 מהאמת. הלקח: אומדן אי-ודאות קובע את החזקות ואת התלות בקבועים, ועליהן אפשר לסמוך. את המקדם צריך לקחת מתורה מלאה או מכיול מול מדידה.\n\n**טעות מקצועית: $h$ במקום $\\hbar$.** מערכת AI או מהנדס עייף שמציבים ב-(16) $h$ במקום $\\hbar$ מקבלים מקדם $(2\\pi)^2\\approx39.5$. האטום יוצא 20.9 Å, ואנרגיית הקשר 0.345 eV. שתי בדיקות תופסות את זה מיד:\n\n- אטום הוא כ-1 Å, לא עשרים.\n- 0.345 eV הם רק פי 13 מ-$k_BT$ של החדר. אטומים כאלה היו מאבדים אלקטרונים בחום של תנור.\n\n"], ["box", "numeric", "שאלה מספרית", "ב-1913 ייחס בוהר סדרת קווים מוזרה בספקטרום של כוכבים, שהיו ידועים כ\"קווים של מימן\", ליון הליום $\\text{He}^+$: אלקטרון אחד סביב גרעין במטען $+2e$. פאולר במעבדה התנגד שהיחסים לא מתאימים, ובוהר ענה שצריך להביא בחשבון את תנועת הגרעין, וההתאמה נעשתה מושלמת <span class=\"cert\">ודאות: בינונית<\/span>. לפי (16) ו-(17), מהי אנרגיית הקשר של $\\text{He}^+$ (בלי תיקון המסה המצומצמת)?\n\n<details><summary>פתרון<\/summary>\n\nבגרעין במטען $2e$ המשיכה היא $2ke^2/a$, ולכן מחליפים את $ke^2$ ב-$2ke^2$.\n\nהרדיוס לפי (16):\n\n$$a=\\frac{\\hbar^2}{m\\cdot2ke^2}=\\frac{a_0}{2}=0.265\\ \\text{Å}$$\n\nהאנרגיה לפי (17):\n\n$$E=-\\frac{2ke^2}{2a}=-\\frac{2ke^2}{a_0}=4\\times(-13.6)=-54.4\\ \\text{eV}$$\n\nאנרגיית הקשר 54.4 eV, וזה הערך שנמדד. האנרגיה גדלה כמו $Z^2$: פעם אחת מהמשיכה, ופעם שנייה מהרדיוס שקטן.\n- wrong: 27.2 :: הוכפלה רק המשיכה, ונשכח שגם הרדיוס קטן פי 2.\n- wrong: 6.8 :: המשיכה החזקה טופלה כאילו היא מגדילה את האטום.\n\n\n<\/details>"], ["md", "\n### 4.5 המיקרוסקופ האמיתי: האם אפשר לראות את מה שגזרנו?\n\nבזמן שהייזנברג ובוהר התווכחו על מיקרוסקופ מחשבתי, בבית הספר הטכני בברלין עבדו מקס קנול והסטודנט ארנסט רוסקה על בעיה מעשית לגמרי: אוסצילוסקופים לקווי מתח גבוה. הם השתמשו בתגלית של בוש מ-1926, שסליל שזרם עובר בו ממקד אלומת אלקטרונים כמו שעדשה ממקדת אור. ב-1931 הציבו שני סלילים בטור וקיבלו תמונה מוגדלת, כ-17 פעמים בלבד <span class=\"cert\">ודאות: בינונית<\/span>.\n\nההגדלה הזו הייתה מגוחכת לעומת מיקרוסקופ אור, אבל המטרה הייתה לעקוף מכשול בן חצי מאה.\n\n#### גבול אבה\n\nב-1873 הראה ארנסט אבה, שעבד עם קרל צייס ביינה, שמיקרוסקופ אור לא יבחין לעולם בפרטים קטנים מגבול מסוים, ושום ליטוש עדשות לא יעזור <span class=\"cert\">ודאות: גבוהה<\/span>. זה צעד 1 של המיקרוסקופ של הייזנברג, בצורה שבה מהנדס אופטיקה כותב אותו:\n\n"], ["box", "definition", "הגדרה: גבול ההפרדה של אבה (Abbe diffraction limit)", "מערכת אופטית שאוספת גלים באורך $\\lambda$ בתוך קונוס בחצי זווית $\\theta$, בתווך עם מקדם שבירה $n$, לא מבחינה בין פרטים שקרובים מ-\n$$d=\\frac{\\lambda}{2n\\sin\\theta}.$$\nהמכפלה $n\\sin\\theta$ נקראת **הצמצם הנומרי** (NA). הגבול נובע מגליות האור, לא מאיכות הייצור.\n"], ["md", "\nהגבול בנוי משני כפתורים בלבד, ושניהם חסומים. $\\sin\\theta$ לא עולה על 1. מקדם השבירה של שמני טבילה מגיע לכ-1.5, ולכן הצמצם הנומרי הטוב ביותר הוא כ-1.4. לאור ירוק:\n\n$$d=\\frac{550\\ \\text{nm}}{2\\times1.4}\\approx200\\ \\text{nm}$$\n\nהכפתור היחיד שנשאר פתוח הוא $\\lambda$. אלקטרונים, חשבו קנול ורוסקה, הם חלקיקים, ואין להם אורך גל בכלל.\n\n#### אורך הגל של אלקטרון מואץ\n\nב-1932 נתקל רוסקה ברעיון של דה ברויי. בהרצאת הנובל שלו ב-1986 סיפר שהתאכזב: אם לאלקטרון יש גל, גם מיקרוסקופ האלקטרונים כפוף לגבול של אבה <span class=\"cert\">ודאות: בינונית<\/span>. ואז חישב את אורך הגל.\n\n**צעד 1.** אלקטרון שעובר מתח $V$ צובר אנרגיה קינטית $eV$. לפי (8):\n\n$$eV=\\frac{p^2}{2m}$$\n\n**צעד 2.** מבודדים את התנע:\n\n$$p=\\sqrt{2meV}$$\n\n**צעד 3.** מציבים ב-(13):\n\n$$\\lambda=\\frac{h}{\\sqrt{2meV}}$$\n\n**צעד 4.** מכנסים את הקבועים למספר אחד, כמו שעושים בכל נוסחה שחוזרים אליה בתכנון:\n\n$$\\frac{h}{\\sqrt{2me}}=1.226\\ \\text{nm·V}^{1/2}\\quad\\Rightarrow\\quad \\lambda=\\frac{1.226\\ \\text{nm}}{\\sqrt{V}}$$\n\n**צעד 5.** במתח של 10 kV:\n\n$$\\lambda=\\frac{1.226\\ \\text{nm}}{100}=12.3\\ \\text{pm}$$\n\nזה קצר פי 40 אלף מאור ירוק. הגבול היה עדיין שם, אבל הרחק מתחת לכל מה שעניין מישהו. ב-1933 עבר המכשיר של רוסקה את כוח ההפרדה של מיקרוסקופ האור, וב-1939 מכרה סימנס את הראשון המסחרי <span class=\"cert\">ודאות: גבוהה<\/span>.\n\n#### התיקון היחסותי\n\nמיקרוסקופים חודרים, שמאירים דרך דוגמה דקה, עובדים היום ב-100 עד 300 kV <span class=\"cert\">ודאות: גבוהה<\/span>. כאן ההנחה של (8) נשברת. מסת המנוחה של האלקטרון שקולה ל-511 keV, ולכן ב-100 keV האנרגיה הקינטית היא כבר חמישית ממנה. צריך לגזור מחדש, עם הקשר היחסותי בין אנרגיה לתנע. ניקח אותו כנתון מתורת היחסות; הוא ייגזר בפרק שלה:\n\n$$E_{tot}^2=(pc)^2+(mc^2)^2$$\n\n**צעד 1.** האנרגיה הכוללת היא אנרגיית המנוחה ועוד מה שנצבר במתח:\n\n$$E_{tot}=mc^2+eV$$\n\n**צעד 2.** מבודדים את התנע:\n\n$$(pc)^2=(mc^2+eV)^2-(mc^2)^2$$\n\n**צעד 3.** פותחים את הריבוע; $(mc^2)^2$ מצטמצם:\n\n$$(pc)^2=(eV)^2+2eV\\,mc^2$$\n\n**צעד 4.** מוציאים גורם משותף $2eV\\,mc^2$ ומחלקים ב-$c^2$:\n\n$$p=\\sqrt{2meV\\left(1+\\frac{eV}{2mc^2}\\right)}$$\n\n**צעד 5.** מציבים ב-(13):\n\n"], ["box", "formula", "נוסחה: אורך הגל של אלקטרון מואץ, עם תיקון יחסותי", "$$\\lambda=\\frac{h}{\\sqrt{2meV\\left(1+\\dfrac{eV}{2mc^2}\\right)}}=\\frac{1.226\\ \\text{nm}/\\sqrt{V}}{\\sqrt{1+V/1.022\\ \\text{MV}}}\\tag{18}$$\n$V$ מתח ההאצה בוולטים, $mc^2=511$ keV. כש-$eV\\ll mc^2$ הסוגריים שואפים ל-1 ומקבלים את הנוסחה הלא-יחסותית.\n"], ["md", "\nבדיקת גבול: כש-$eV$ קטן בהרבה מ-$mc^2$, התיקון נעלם, וחוזרים לצעד 3 של רוסקה. זו הבדיקה הראשונה שעושים לכל נוסחה מתוקנת.\n\n| מתח | בלי תיקון | עם תיקון (18) | הפער | $v/c$ |\n|---|---|---|---|---|\n| 10 kV | 12.26 pm | 12.20 pm | 0.5% | 0.19 |\n| 100 kV | 3.88 pm | 3.70 pm | 4.8% | 0.55 |\n| 300 kV | 2.24 pm | 1.97 pm | 14% | 0.78 |\n\nב-10 kV אפשר להתעלם מהתיקון. ב-300 kV הוא 14%, ומי שמכייל מצלמה או מנתח תבנית עקיפה לפי הנוסחה הלא-יחסותית יקבל מרחקי סריג שגויים באותו שיעור.\n\n"], ["box", "numeric", "שאלה מספרית", "מיקרוסקופ חודר עובד במתח של 200 kV. מהו אורך הגל של האלקטרונים לפי (18)? ובכמה אחוז שגוי הערך הלא-יחסותי?\n\n<details><summary>פתרון<\/summary>\n\nבלי תיקון:\n\n$$\\lambda_0=\\frac{1.226\\ \\text{nm}}{\\sqrt{2\\times10^5}}=\\frac{1.226\\ \\text{nm}}{447.2}=2.742\\ \\text{pm}$$\n\nגורם התיקון:\n\n$$\\sqrt{1+\\frac{200}{1022}}=\\sqrt{1.196}=1.0935$$\n\nעם תיקון:\n\n$$\\lambda=\\frac{2.742\\ \\text{pm}}{1.0935}=2.51\\ \\text{pm}$$\n\nהערך הלא-יחסותי ארוך ב-9.3%.\n- wrong: 2.74 :: זה הערך בלי התיקון היחסותי; ב-200 keV האנרגיה הקינטית היא כ-40% מאנרגיית המנוחה.\n- wrong: 2.29 :: התיקון הופעל בלי שורש: חולק ב-1.196 במקום ב-$\\sqrt{1.196}$.\n\n\n<\/details>"], ["md", "\n#### האם אפשר לראות את האטום בלי להרוס אותו?\n\nהחישוב של רוסקה מעלה שאלה שנוגעת ישר בתשובה של 4.4. שם מתחברים המיקרוסקופ המחשבתי של הייזנברג ושל רוסקה: **אם האטום קיים רק כי האלקטרון לא יכול להיות מקומי יותר, האם אפשר לראות אותו בלי להרוס אותו?** כדי להבחין בפרט בגודל $a_0$ צריך, לפי אבה, גל באורך של $a_0$ לכל היותר.\n\n"], ["box", "numeric", "שאלה מספרית", "באיזה מתח צריך להאיץ אלקטרון כדי שאורך הגל שלו יהיה $a_0=0.529$ Å? (המהירות קטנה מספיק כדי להשתמש בנוסחה הלא-יחסותית.)\n\n<details><summary>פתרון<\/summary>\n\nמצעד 4 של רוסקה, $\\lambda=1.226\\ \\text{nm}/\\sqrt V$. נבודד את $V$:\n\n$$V=\\left(\\frac{1.226\\ \\text{nm}}{\\lambda}\\right)^2=\\left(\\frac{1.226}{0.0529}\\right)^2=537\\ \\text{V}$$\n\nבראש: 4.4 נתן $\\hbar^2/2ma_0^2=13.6$ eV. עם $h$ במקום $\\hbar$ זה פי $4\\pi^2=39.5$, כלומר 537 eV.\n- wrong: 13.6 :: זו אנרגיית הקשר; היא מתאימה לאורך גל $2\\pi a_0$, לא $a_0$.\n- wrong: 150 :: זה המתח לאורך גל של 1 Å, לא 0.529 Å.\n\n\n<\/details>"], ["md", "\nהתשובה, 537 eV, ראויה לעצירה. נכתוב אותה בסימנים:\n\n$$\\frac{p^2}{2m}=\\frac{h^2}{2ma_0^2}=(2\\pi)^2\\,\\frac{\\hbar^2}{2ma_0^2}$$\n\nזה אותו ביטוי כמו מחיר הכליאה ב-(15), רק עם $h$ במקום $\\hbar$. לכן הוא גדול פי 40 מאנרגיית הקשר. זה לא מקרה: מה שמאפשר לראות פרט בגודל $a_0$ הוא בדיוק מה שקובע את $a_0$. כל בדיקה חדה מספיק כדי לראות את האלקטרון באטום נושאת די אנרגיה כדי לקרוע אותו משם.\n\nאיך, אם כן, מיקרוסקופים מודרניים מראים אטומים בודדים? התשובה נמצאת ב-(15) עצמה, במכנה. המיקרוסקופ לא מנסה למקם את **האלקטרון** בתוך האטום. הוא ממקם את **האטום כולו**, את הגרעין והענן שסביבו, שמפזרים את האלומה יחד.\n\nהמחיר של מיקום עד $\\Delta x$ הוא אותו מחיר כליאה, עם המסה של מה שממקמים:\n\n$$\\Delta E\\approx\\frac{\\hbar^2}{2M\\,\\Delta x^2}$$\n\nלאלקטרון, עד 0.5 Å, המחיר הוא 15 eV, יותר מאנרגיית הקשר.\n\nאטום פחמן כבד פי 21,900 מהאלקטרון, ואותו מיקום עולה לו 0.7 meV.\n\nזה פחות מ-$k_BT$ של החדר; האטום לא מרגיש אותו. אפשר לראות איפה האטומים נמצאים. אי אפשר לראות את האלקטרון \"מקיף\" בתוכם, כי אין מסלול לראות, ומי שינסה למקם אותו על מסלול יקרע אותו מהאטום. זו תשובתו של בוהר להייזנברג, בצורה הנדסית.\n\n#### מה מגביל בפועל: העדשות\n\nב-300 kV אורך הגל הוא כ-2 pm, ובכל זאת הרזולוציה הטובה ביותר במשך עשרות שנים הייתה פי מאה מזה. האשמה אינה בפיזיקה הקוונטית אלא בעדשות. ב-1936 הוכיח אוטו שרצר שכל עדשה מגנטית עגולה וסטטית סובלת בהכרח משגיאה כדורית <span class=\"cert\">ודאות: גבוהה<\/span>. קרניים שעוברות רחוק מהציר ממוקדות קצר מדי. זה לא פגם ייצור שאפשר ללטש; זה משפט.\n\nמכאן פשרה, וזו הגזירה ההנדסית המרכזית של המכשיר. מגדירים את הצמצם $\\alpha$, חצי זווית הקונוס שהעדשה מקבלת, ושני מקורות טשטוש מושכים אותו לכיוונים הפוכים.\n\n**טשטוש מעקיפה.** לפי אבה, צמצם צר רואה גרוע. בניסוח של ריילי, לזוויות קטנות:\n\n$$d_{diff}\\approx\\frac{0.61\\,\\lambda}{\\alpha}$$\n\n**טשטוש מהשגיאה הכדורית.** קרן בזווית $\\alpha$ מוסטת כמו $\\alpha^3$, עם מקדם $C_s$ שמאפיין את העדשה, בסדר של מילימטר:\n\n$$d_{s}\\approx\\tfrac12\\,C_s\\,\\alpha^3$$\n\n**המודל.** נניח, בהערכה פסימית, שהטשטושים מצטברים:\n\n$$d(\\alpha)=\\frac{0.61\\,\\lambda}{\\alpha}+\\tfrac12\\,C_s\\,\\alpha^3$$\n\n**צעד 1.** גוזרים לפי $\\alpha$ ומשווים לאפס:\n\n$$-\\frac{0.61\\,\\lambda}{\\alpha^2}+\\tfrac32\\,C_s\\,\\alpha^2=0$$\n\n**צעד 2.** מבודדים את הצמצם האופטימלי:\n\n$$\\alpha_{opt}=\\left(\\frac{0.61\\,\\lambda}{1.5\\,C_s}\\right)^{1/4}$$\n\n**צעד 3.** מהשוויון בצעד 1, באופטימום הטשטוש הכדורי הוא שליש מטשטוש העקיפה. לכן:\n\n$$d_{min}=\\tfrac43\\cdot\\frac{0.61\\,\\lambda}{\\alpha_{opt}}\\approx1.0\\;C_s^{1/4}\\,\\lambda^{3/4}$$\n\n**צעד 4.** מספרים, ב-200 kV עם $C_s=1$ מ\"מ. הצמצם האופטימלי:\n\n$$\\alpha_{opt}=5.7\\ \\text{mrad}$$\n\nוהרזולוציה:\n\n$$d_{min}\\approx0.36\\ \\text{nm}$$\n\nהחישוב הגלי המלא, של שרצר עצמו, נותן מקדם 0.66 במקום 1.0, כלומר כ-0.23 nm <span class=\"cert\">ודאות: בינונית<\/span>, וזה אכן הסדר של מיקרוסקופים לא מתוקנים. אבל המקדם פחות חשוב מהחזקות, ושם יושבת החלטת התכנון.\n\n**מה החזקות אומרות למתכנן.** הרזולוציה תלויה ב-$C_s$ בחזקת רבע. עדשה טובה פי 2, שעולה הון, משפרת את התמונה ב-16% בלבד. ב-$\\lambda$ היא תלויה בחזקת שלושה רבעים, ולכן הדרך הזולה יותר הייתה מתח גבוה יותר. מעבר מ-200 ל-300 kV משפר את הרזולוציה בכ-17%. במשך שישים שנה זה היה הכיוון, עד למיקרוסקופים של מיליון וולט ויותר <span class=\"cert\">ודאות: בינונית<\/span>.\n\nהמשפט של שרצר נשען על שלוש הנחות: עדשה עגולה, סטטית, בלי מטען במסלול האלומה. מהנדס שקורא משפט אי-אפשרות מחפש את ההנחה שאפשר לשבור. שרצר עצמו הציע ב-1947 לשבור את הראשונה, בעדשות לא עגולות <span class=\"cert\">ודאות: גבוהה<\/span>. זה לקח חצי מאה, כי מתקן כזה דורש יציבות זרמים ודיוק יישור שלא היו קיימים. ב-1998 בנו היידר, רוז ואורבן מתקן שגיאות מעשי <span class=\"cert\">ודאות: גבוהה<\/span>.\n\nהמתקן מוריד את $C_s$ לסדר של מיקרומטר. לפי אותו מודל זה נותן כ-50 pm, וזה אכן הסדר של המיקרוסקופים הטובים היום <span class=\"cert\">ודאות: בינונית<\/span>. וכשמבטלים מגבלה אחת, הבאה בתור עולה: עכשיו מגבילה השגיאה הכרומטית, שנובעת מכך שלאלקטרונים במקור אין אנרגיה אחת בדיוק. גבול הרזולוציה של אבה הוא תקרה, לא הבטחה.\n\n#### המחיר: נזק לדוגמה\n\nאורך גל קצר דורש אנרגיה גבוהה, והאלומה לא רק מתפזרת; היא גם פוגעת. כמה אנרגיה יכול אלקטרון להעביר לגרעין? המקרה הגרוע הוא פגיעה חזיתית.\n\n**צעד 1.** הגרעין כבד בהרבה, ולכן האלקטרון ניתז לאחור כמעט באותו גודל תנע. שינוי התנע שלו, שעובר כולו לגרעין, הוא:\n\n$$\\Delta p\\approx2p$$\n\n**צעד 2.** הגרעין יוצא איטי, ולכן (8) תקפה עבורו:\n\n$$E_{max}=\\frac{(2p)^2}{2M}=\\frac{2p^2}{M}$$\n\n**צעד 3.** מציבים את התנע היחסותי של האלקטרון מצעד 4 של התיקון, עם $K=eV$:\n\n$$E_{max}=\\frac{2\\cdot2mK\\left(1+K/2mc^2\\right)}{M}=\\frac{2K\\,(K+2mc^2)}{Mc^2}$$\n\n**צעד 4.** לגרעין פחמן, $Mc^2=11{,}178$ MeV. ב-80 keV:\n\n$$E_{max}=\\frac{2\\times0.080\\times(0.080+1.022)}{11{,}178}\\ \\text{MeV}=15.8\\ \\text{eV}$$\n\nב-300 keV אותו חשבון נותן 71 eV.\n\nכדי לעקור אטום פחמן מסריג של גרפן צריך להעביר לו כ-20 eV <span class=\"cert\">ודאות: בינונית<\/span>. לפי הנוסחה זה קורה רק מעל כ-100 kV, אבל תנודות תרמיות של האטום מוסיפות לו תנע משלו ומורידות את הסף בפועל לסביבות 80 kV <span class=\"cert\">ודאות: בינונית<\/span>. ההנחה הנסתרת בצעד 1, גרעין שעומד במקום, היא שנשברה. חוקרי גרפן עובדים ב-60 עד 80 kV, ומשלמים על כך באורך גל ארוך פי 2. זו פשרה מספרית: חצי רזולוציה תמורת דוגמה שנשארת שלמה.\n\nבדוגמאות ביולוגיות הנזק העיקרי הוא אחר. כל אלקטרון שעובר מיינן ושובר קשרים כימיים של כמה eV, הרבה לפני שהוא עוקר גרעין. לכן מצלמים אותן בקירור עמוק ובמעט מאוד אלקטרונים (קריו-מיקרוסקופיה, נובל 2017) <span class=\"cert\">ודאות: גבוהה<\/span>. \"מעט מאוד\" יקבל מספר ב-4.6.\n\n**למה לא פוטונים?** אפשר היה לשאול למה לא להשתמש ברנטגן באותו אורך גל. נשווה את האנרגיה שנדרשת לאותו תנע, כלומר לאותו אורך גל. לפוטון, לפי (12) ו-(13), $E=pc$. לאלקטרון איטי $K=p^2/2m$. היחס:\n\n$$\\frac{E_{photon}}{K_{electron}}=\\frac{pc}{p^2/2m}=\\frac{2mc^2}{pc}$$\n\nבאורך גל של 12.3 pm, $pc$ הוא 101 keV, ולכן היחס כ-10. הפוטון נושא פי 10 אנרגיה לאותה רזולוציה. המסה של האלקטרון, שהופכת את (13) ל\"זולה\" עבורו, היא היתרון. ובנוסף, אלקטרונים, בניגוד לרנטגן, אפשר למקד בעדשות מגנטיות.\n\n### 4.6 מה שהתמונה לא תגיד: הסתברות, ואיינשטיין שלא קיבל אותה\n\nבמעט אלקטרונים, תמונה במיקרוסקופ אינה תמונה אלא ענן של נקודות. ב-1989 הראו טונומורה ועמיתיו בהיטאצ'י, במיקרוסקופ אלקטרונים ששונה לשם כך, מה זה אומר. אלקטרונים נשלחו אחד-אחד דרך \"דו-מנסרה\" אלקטרונית (biprism), חוט טעון שמפצל את הגל לשניים. כל אחד פגע במסך בנקודה אחת, במקום שאי אפשר היה לנבא, ורק אחרי אלפים הצטיירו פסי התאבכות של גל <span class=\"cert\">ודאות: גבוהה<\/span>. כל אלקטרון הוא חלקיק כשהוא נמדד, והגל קובע רק היכן סביר שיופיע.\n\n"], ["box", "definition", "הגדרה: חיזוי הסתברותי", "תורה נותנת חיזוי הסתברותי כשלמצב נתון היא מנבאת לא תוצאה יחידה, אלא הסתברות לכל תוצאה אפשרית. ההסתברות נבדקת כשכיחות: חוזרים על הכנת אותו מצב פעמים רבות וסופרים.\n"], ["md", "\nזה מה שבורן הציע ב-1926, וזה מה שאיינשטיין לא קיבל. \"הוא אינו משחק בקוביות\", כתב לבורן בסוף אותה שנה <span class=\"cert\">ודאות: גבוהה<\/span>. בוועידת סולביי באוקטובר 1927 הביא כל בוקר לארוחת הבוקר ניסוי מחשבתי שאמור היה לעקוף את (14), ובוהר מצא את הפגם עד הערב <span class=\"cert\">ודאות: בינונית<\/span>.\n\nההתנגדות של איינשטיין לא הייתה עקשנות; היא הייתה ההצעה הטבעית. אולי יש בתוך האלקטרון \"גלגלים\" נסתרים שקובעים היכן יפגע, והתורה פשוט לא מכירה אותם. במשך שלושים שנה זו נחשבה שאלה פילוסופית, עד שבל הראה ב-1964 שהיא ניתנת לבדיקה. הניסויים שזכו בנובל ב-2022 שללו את הסוגים הפשוטים של גלגלים כאלה <span class=\"cert\">ודאות: גבוהה<\/span>. ניסוי יחיד לא מפריך חיזוי הסתברותי; מיליון אלקטרונים על המסך כן.\n\n#### מה האקראיות עולה למתכנן\n\nלפילוסופים זו שאלה על טבע המציאות. למתכנן המיקרוסקופ זו שורה בתקציב. אם כל אלקטרון נוחת במקום אקראי, אז גם מספר האלקטרונים שנוחתים בפיקסל אקראי, ותמונה היא תמיד רועשת.\n\n**נתון מסטטיסטיקה.** כשאירועים בלתי תלויים מגיעים בממוצע $N$ פעמים, הפיזור של הספירה הוא $\\sqrt N$ (התפלגות פואסון) <span class=\"cert\">ודאות: גבוהה<\/span>.\n\n**צעד 1.** פרט בדוגמה משנה את מספר האלקטרונים בפיקסל שלו בשיעור $C$, הניגודיות. ההבדל בין הפיקסל לרקע:\n\n$$\\text{signal}=C\\,N$$\n\n**צעד 2.** הרעש הוא הפיזור של הספירה:\n\n$$\\text{noise}=\\sqrt N$$\n\n**צעד 3.** היחס ביניהם:\n\n$$\\text{SNR}=\\frac{CN}{\\sqrt N}=C\\sqrt N$$\n\n**צעד 4.** כדי שעין או אלגוריתם יבחינו בפרט בביטחון, דרוש יחס של כ-5. זה קריטריון רוז, מעבודתו על מצלמות טלוויזיה ב-1948 <span class=\"cert\">ודאות: בינונית<\/span>:\n\n$$C\\sqrt N\\ge5\\quad\\Rightarrow\\quad N\\ge\\frac{25}{C^2}$$\n\n**צעד 5.** לניגודיות של 10%, צריך 2,500 אלקטרונים לפיקסל.\n\nאם הפיקסל הוא אנגסטרום רבוע, דוגמה ביולוגית סובלת רק כמה עשרות אלקטרונים לאנגסטרום רבוע לפני שהיא נהרסת <span class=\"cert\">ודאות: בינונית<\/span>. חסר גורם של כמאה. ולכן קריו-מיקרוסקופיה לא מצלמת מולקולה אחת: היא מצלמת עשרות אלפי עותקים זהים, מיישרת אותם במחשב וממצעת <span class=\"cert\">ודאות: בינונית<\/span>. הזהות של מקסוול, אטומים ומולקולות כמוצר מתועש, היא מה שמאפשר לעקוף את הגבול: את מה שאי אפשר לראות פעם אחת, רואים ממוצע על פני אלפים.\n\n#### תנודת אפס\n\nאותה עובדה מופיעה גם במנוחה. במינימום של 4.4 לאלקטרון יש 13.6 eV של תנועה, ולא בגלל חום. גם בגביש שמקררים עד האפס המוחלט, שבו $k_BT$ מתאפס, האטומים לא נעצרים, כי אטום עומד הוא אטום שמקומו ותנועתו ידועים יחד. התנועה הזו נקראת **תנודת אפס** (zero-point motion). בהליום היא גדולה כל כך ביחס למשיכה החלשה בין האטומים, שבלחץ רגיל הוא לא קופא לעולם <span class=\"cert\">ודאות: גבוהה<\/span>.\n\n"], ["box", "mcq", "שאלה", "מיקרוסקופ אלקטרונים מתוקן-שגיאות ב-80 keV מראה את אטומי הפחמן בגרפן אחד-אחד. סטודנט מסיק שבאלומה חדה יותר אפשר יהיה לצלם גם את מסלול האלקטרון סביב הגרעין. מה התשובה הנכונה?\n- נכון, צריך רק להעלות את המתח עד שאורך הגל קטן בהרבה מ-$a_0$ — *אורך הגל כבר פיקומטרים, קטן מ-$a_0$ פי מאה; הבעיה אינה כוח ההפרדה, והעלאת המתח גם עוקרת אטומים מהגרפן.*\n- ✅ **אין מסלול לצלם: למקם את האלקטרון בתוך האטום עולה לפי (14) יותר מאנרגיית הקשר, ואילו את האטום הכבד כולו אפשר למקם בזול, כי המחיר מחולק במסה** — אותו $\\hbar^2/2M\\Delta x^2$, עם מסה גדולה פי 21,900.\n- הבעיה היא שגיאת העדשות; עם מתקן טוב יותר המסלול ייראה — *התיקון מוריד את $C_s$ ומביא את הרזולוציה לעשרות פיקומטרים, אבל לא משנה את (14).*\n- אי אפשר, כי המכה של האלומה מזיזה את האלקטרון; במדידה עדינה מספיק היינו רואים את המסלול — *זו התמונה ש\"המדידה מפריעה\"; הפיזורים מקיימים את (14) גם בלי שום מכה, כי אין לאלקטרון מקום ותנע מוגדרים יחד.*\n"], ["md", "\n### 4.7 אותו מחיר, בקנה מידה אחר\n\nהתשובה לשאלת הפרק עומדת על שני מספרים, $\\hbar$ ומסה, ולכן היא עובדת גם במקום שבוהר לא יכול היה להגיע אליו. ב-4.4 ראינו שמהירות האלקטרון במימן, ביחידות של $c$, היא מספר טהור:\n\n"], ["box", "definition", "הגדרה: קבוע המבנה הדק (fine-structure constant)", "$$\\alpha=\\frac{ke^2}{\\hbar c}=\\frac{1}{137.036}$$\nהמספר הטהור שמודד את עוצמת הצימוד בין השדה האלקטרומגנטי למטען $e$. במימן הוא גם $v/c$ של האלקטרון.\n"], ["md", "\n$\\alpha$ קטן, ולכן (15) הלא-יחסותית עבדה כל כך טוב. התורה המלאה של אור ומטענים לפי עקרונות הקוונטים, **אלקטרודינמיקה קוונטית** (QED), נבנתה מדיראק ועד פיינמן, שווינגר וטומונגה. דיראק ניבא ב-1928 גם את הפוזיטרון, ואנדרסון מצא אותו ב-1932 <span class=\"cert\">ודאות: גבוהה<\/span>. התורה מכילה את החוקים של הכימיה כולה, ולא נמצאה לה סתירה מחוץ לגרעין <span class=\"cert\">ודאות: גבוהה<\/span>.\n\nובתוך הגרעין? נחשב את אותו מחיר כליאה לפרוטון בתוך פמטומטר. נוח לעבוד עם $\\hbar c=197.3$ MeV·fm ועם $m_pc^2=938.3$ MeV.\n\n**צעד 1.** כותבים את מחיר הכליאה כך ש-$c$ יופיע בזוגות:\n\n$$\\Delta E=\\frac{\\hbar^2}{2m_pr^2}=\\frac{(\\hbar c)^2}{2\\,m_pc^2\\,r^2}$$\n\n**צעד 2.** מציבים $r=1$ fm:\n\n$$\\Delta E=\\frac{(197.3\\ \\text{MeV·fm})^2}{2\\times938.3\\ \\text{MeV}\\times(1\\ \\text{fm})^2}=20.7\\ \\text{MeV}$$\n\n**צעד 3.** אומדן בראש, כבדיקה. לאלקטרון ב-1 Å המחיר 3.81 eV. מרחק קטן פי $10^5$ מגדיל אותו פי $10^{10}$. מסה גדולה פי 1836 מקטינה אותו. יוצאים כ-$2\\times10^7$ eV, בהתאמה.\n\nזה פי מיליון וחצי מאנרגיית הקשר של המימן. כדי שגרעין יחזיק, צריך כוח שהרווח שלו עומד במחיר הזה, וזה מה שהחשמל לא יכול לספק. מכאן הפרק הבא.\n"]];
