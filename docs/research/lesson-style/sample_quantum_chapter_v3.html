<script>
// Draws the lesson's ```chart and ```anim blocks in the sample pages (same JSON as the apps), with math.js.
// md2html.py inlines this file; renderVisual(kind, spec) returns a DOM element.
const NS = "http://www.w3.org/2000/svg";
const COLORS = ["var(--acc)", "#c0632b", "#5b8a3a", "#8a5bb0"];
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const fmt = (v) => (Math.abs(v) >= 1000 || (Math.abs(v) < 0.01 && v !== 0) ? v.toExponential(1) : +v.toPrecision(3)).toString();

function frame(W, H, pad) {
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "viz" });
  return { svg, plot: { x0: pad.l, x1: W - pad.r, y0: H - pad.b, y1: pad.t } };
}

function axes(svg, p, xr, yr, xl, yl) {
  const X = (x) => p.x0 + ((x - xr[0]) / (xr[1] - xr[0])) * (p.x1 - p.x0);
  const Y = (y) => p.y0 - ((y - yr[0]) / (yr[1] - yr[0])) * (p.y0 - p.y1);
  el("rect", { x: p.x0, y: p.y1, width: p.x1 - p.x0, height: p.y0 - p.y1, fill: "none", stroke: "var(--line)" }, svg);
  for (let i = 0; i <= 4; i++) {
    const xv = xr[0] + ((xr[1] - xr[0]) * i) / 4, yv = yr[0] + ((yr[1] - yr[0]) * i) / 4;
    el("text", { x: X(xv), y: p.y0 + 16, "text-anchor": "middle", class: "tick" }, svg).textContent = fmt(xv);
    el("text", { x: p.x0 - 6, y: Y(yv) + 4, "text-anchor": "end", class: "tick" }, svg).textContent = fmt(yv);
  }
  if (yr[0] < 0 && yr[1] > 0) el("line", { x1: p.x0, x2: p.x1, y1: Y(0), y2: Y(0), stroke: "var(--line)", "stroke-dasharray": "3 3" }, svg);
  el("text", { x: (p.x0 + p.x1) / 2, y: p.y0 + 34, "text-anchor": "middle", class: "lbl" }, svg).textContent = xl || "";
  el("text", { x: 14, y: (p.y0 + p.y1) / 2, "text-anchor": "middle", class: "lbl", transform: `rotate(-90 14 ${(p.y0 + p.y1) / 2})` }, svg).textContent = yl || "";
  return { X, Y };
}

function chart(spec) {
  const { svg, plot } = frame(640, 340, { l: 64, r: 16, t: 14, b: 44 });
  const xs = [];
  for (let x = spec.x.from; x <= spec.x.to + 1e-12; x += spec.x.step) xs.push(x);
  const series = spec.series.map((s) => {
    const f = math.compile(s.expr);
    return { name: s.name, pts: xs.map((x) => [x, f.evaluate({ ...spec.scope, x })]).filter(([, y]) => Number.isFinite(y)) };
  });
  const ys = series.flatMap((s) => s.pts.map((p) => p[1]));
  let lo = spec.y?.from ?? Math.min(...ys), hi = spec.y?.to ?? Math.max(...ys);
  if (spec.y?.from === undefined) { const q = (hi - lo) * 0.05; lo -= q; hi += q; }
  const { X, Y } = axes(svg, plot, [spec.x.from, spec.x.to], [lo, hi], spec.x.label, spec.yLabel);
  const clip = (y) => Math.max(lo, Math.min(hi, y));
  series.forEach((s, i) => {
    el("polyline", { points: s.pts.map(([x, y]) => `${X(x)},${Y(clip(y))}`).join(" "), fill: "none", stroke: COLORS[i % 4], "stroke-width": 2.2 }, svg);
  });
  return wrap(svg, spec, series.map((s, i) => [s.name, COLORS[i % 4]]));
}

function anim(spec) {
  const [xa, xb] = spec.view.x, [ya, yb] = spec.view.y;
  const W = 640, H = spec.view.equal === false ? 380 : Math.round((640 * (yb - ya)) / (xb - xa));
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "viz" });
  const X = (x) => ((x - xa) / (xb - xa)) * W, Y = (y) => H - ((y - ya) / (yb - ya)) * H;
  const vals = Object.fromEntries((spec.params || []).map((p) => [p.id, p.value]));
  const ev = (e, s) => math.evaluate(String(e), s);
  const t0 = performance.now();
  function draw() {
    const t = (((performance.now() - t0) / 1000) % (spec.duration || 6));
    const s = { ...vals, t, pi: Math.PI };
    svg.replaceChildren();
    for (const sh of spec.shapes) {
      const st = { stroke: sh.accent ? COLORS[1] : "currentColor", fill: "none", "stroke-width": sh.accent ? 2.6 : 1.6 };
      try {
        if (sh.type === "circle") el("circle", { cx: X(ev(sh.x, s)), cy: Y(ev(sh.y, s)), r: Math.max(1, (ev(sh.r, s) / (xb - xa)) * W), ...st, fill: sh.fill ? st.stroke : "none" }, svg);
        else if (sh.type === "line" || sh.type === "arrow") el("line", { x1: X(ev(sh.x1, s)), y1: Y(ev(sh.y1, s)), x2: X(ev(sh.x2, s)), y2: Y(ev(sh.y2, s)), ...st, "stroke-dasharray": sh.dash ? "5 4" : "", "marker-end": sh.type === "arrow" ? "url(#ah)" : "" }, svg);
        else if (sh.type === "path") {
          const [a, b] = sh.s, n = 240, pts = [];
          for (let i = 0; i <= n; i++) { const sv = a + ((b - a) * i) / n; const y = ev(sh.y, { ...s, s: sv }); if (Number.isFinite(y) && y > ya - 50 && y < yb + 50) pts.push(`${X(ev(sh.x, { ...s, s: sv }))},${Y(Math.max(ya, Math.min(yb, y)))}`); }
          el("polyline", { points: pts.join(" "), ...st }, svg);
        } else if (sh.type === "text") {
          const txt = String(sh.text).replace(/\{([^}]+)\}/g, (_, e) => fmt(ev(e, s)));
          el("text", { x: X(ev(sh.x, s)), y: Y(ev(sh.y, s)), "text-anchor": "middle", class: "lbl", fill: "currentColor" }, svg).textContent = txt;
        }
      } catch (e) { /* a shape that cannot be evaluated at this t is skipped */ }
    }
    const d = el("defs", {}, svg), m = el("marker", { id: "ah", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, d);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill: "currentColor" }, m);
    requestAnimationFrame(draw);
  }
  draw();
  const box = wrap(svg, spec, []);
  for (const p of spec.params || []) {
    const row = document.createElement("label");
    row.className = "param";
    const out = document.createElement("span");
    const inp = Object.assign(document.createElement("input"), { type: "range", min: p.min, max: p.max, step: p.step ?? (p.max - p.min) / 100, value: p.value });
    inp.oninput = () => { vals[p.id] = +inp.value; out.textContent = fmt(+inp.value); };
    out.textContent = fmt(p.value);
    row.append(p.label + " ", inp, out);
    box.insertBefore(row, box.lastChild);
  }
  return box;
}

function wrap(svg, spec, legend) {
  const f = document.createElement("figure");
  f.className = "vizbox";
  if (spec.title) f.append(Object.assign(document.createElement("div"), { className: "vt", textContent: spec.title }));
  f.append(svg);
  if (legend.length) {
    const l = document.createElement("div");
    l.className = "legend";
    for (const [n, c] of legend) l.insertAdjacentHTML("beforeend", `<span><i style="background:${c}"></i>${n}</span>`);
    f.append(l);
  }
  const cap = document.createElement("figcaption");
  cap.innerHTML = typeof md === "function" ? md(spec.caption || "") : spec.caption || "";
  f.append(cap);
  return f;
}

function renderVisual(kind, spec) {
  try { return kind === "chart" ? chart(spec) : anim(spec); }
  catch (e) { const d = document.createElement("div"); d.className = "note"; d.textContent = `[${kind}: ${spec.title || ""}: ${e.message}]`; return d; }
}

const D=[["md", "## פרק 4: התורה הקוונטית: למה האטום גדול\n\nכל אטום מימן ביקום זהה לכל אטום מימן אחר: אותו גודל, ואותם צבעים בדיוק כשהוא זוהר. ב-1873 אמר מקסוול שהזהות הזו נותנת למולקולות \"את האופי של מוצר מתועש\" <span class=\"cert\">ודאות: גבוהה<\/span>. הוא התכוון לכך כחידה. מכונה שמייצרת מוצרים זהים צריכה תבנית, ואיפה התבנית של האטום?\n\nהשאלה של הפרק היא שתי פנים של אותה חידה: **למה האלקטרון לא נופל אל הפרוטון, ולמה כל אטומי המימן באותו גודל?** נענה עליה עד המספר האחרון, מחוק אחד ושלושה קבועים, ונגזור כל צעד בדרך.\n\nלאורך כל הפרק נלווה מכשיר אחד: מיקרוסקופ האלקטרונים. הוא נבנה בברלין בדיוק בשנים שבהן התורה נכתבה, בידי שני מהנדסים שלא התכוונו לגעת בה, וכל תוצאה של התורה פגשה אותו כמכשול הנדסי. אותה משוואה שנותנת לאטום את גודלו כמעט הרגה את המיקרוסקופ ב-1932, ואותו חשבון של \"מחיר מול רווח\" קובע היום כמה חד הוא רואה. בסוף הפרק נוכל לומר מה מגביל מיקרוסקופ של מיליוני דולרים, ואילו מהמגבלות שלו הן חוק טבע ואילו רק עדשה לא מושלמת.\n\n**מה אנחנו כבר יודעים.** בפרק 2 פגשנו את חוק קולון, את הקבוע $ke^2$, ואת רדיוס האטום $a_0=0.529$ Å, שנמדד ולא הוסבר. משם גם תנע, ותאוצה בתנועה מעגלית, $a=v^2/r$. בפרק 3 ראינו שמטען מואץ משדר גל. מ-M0.1 נצטרך ממוצע, RMS, הסתברות כשכיחות, ומינימום כמקום שבו הנגזרת מתאפסת.\n\n### 4.1 אטום שלא יכול להתקיים, 1911–1913\n\nב-1911 פרסם רתרפורד במנצ'סטר את מה שגייגר ומרסדן ראו כשירו חלקיקי אלפא על רדיד זהב. רובם עברו כמעט בלי לסטות, ומעטים חזרו לאחור, \"כאילו ירית פגז על נייר טישו והוא חזר ופגע בך\" <span class=\"cert\">ודאות: גבוהה<\/span>. ההסבר היחיד היה שכמעט כל המסה והמטען החיובי של האטום מרוכזים בגרעין זעיר, והאלקטרונים מסתובבים סביבו.\n\nזו הייתה תגלית, וגם אסון. הדימוי הטבעי הוא מערכת שמש קטנה, שבה חוק קולון מחליף את הכבידה. אבל אלקטרון במעגל משנה כל הזמן את כיוון המהירות שלו, כלומר מאיץ, ומטען מאיץ משדר. הוא מאבד אנרגיה, נופל מעט פנימה, נע מהר יותר, משדר חזק יותר, ומסתחרר אל הגרעין.\n\nכל פיזיקאי ב-1911 ידע את זה. השאלה ששווה לשאול היא שאלה של מהנדס: לא *האם* האטום מתמוטט, אלא *תוך כמה זמן*. גשר שיקרוס בעוד מיליון שנה הוא גשר טוב. התשובה היא שש-עשרה טריליוניות של שנייה:\n\n$$t_{\\text{קריסה}}\\approx1.6\\times10^{-11}\\ \\text{s}.$$\n\nבזמן הזה אור עובר חצי סנטימטר. כל החומר ביקום היה צריך להיעלם לפני שהספקנו למצמץ. את המספר הזה עוד לא הרווחנו: כדי לגזור אותו צריך הנהלת חשבונות של אנרגיה, שנבנה בסעיף 4.4, ושם נחזור ונגזור אותו במלואו, כולל בדיקה של ההנחה שהמסלול נשאר מעגלי.\n\n"], ["raw", "<figure><svg viewBox=\"0 0 520 300\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"13\" fill=\"none\" stroke=\"currentColor\">\n<path d=\"M240.0,150.0 L234.3,116.1 L218.4,85.8 L194.0,61.9 L163.5,46.8 L130.0,41.9 L96.7,47.5 L66.9,63.1 L43.4,87.1 L28.6,117.1 L23.8,150.0 L29.4,182.7 L44.7,212.0 L68.3,235.0 L97.7,249.5 L130.0,254.2 L162.1,248.7 L190.8,233.6 L213.3,210.5 L227.5,181.7 L232.1,150.0 L226.7,118.6 L211.9,90.5 L189.3,68.4 L161.0,54.5 L130.0,50.1 L99.3,55.4 L71.8,69.9 L50.2,92.0 L36.7,119.7 L32.3,150.0 L37.6,180.0 L51.7,206.9 L73.4,227.9 L100.4,241.1 L130.0,245.3 L159.3,240.2 L185.4,226.3 L205.9,205.1 L218.7,178.8 L222.8,150.0 L217.7,121.5 L204.2,96.1 L183.6,76.2 L158.0,63.8 L130.0,59.9 L102.3,64.8 L77.7,78.0 L58.4,98.0 L46.4,122.8 L42.7,150.0 L47.5,176.8 L60.3,200.6 L79.7,219.2 L103.8,230.8 L130.0,234.3 L155.9,229.6 L178.8,217.2 L196.6,198.4 L207.7,175.3 L211.0,150.0 L206.4,125.2 L194.5,103.2 L176.4,86.1 L154.2,75.6 L130.0,72.5 L106.3,77.0 L85.3,88.5 L69.1,105.8 L59.2,127.0 L56.4,150.0 L60.8,172.5 L71.8,192.3 L88.2,207.5 L108.3,216.8 L130.0,219.3 L151.1,215.0 L169.6,204.5 L183.7,189.0 L192.2,170.2 L194.3,150.0 L190.1,130.5 L180.2,113.5 L165.8,100.7 L148.5,93.2 L130.0,91.6 L112.3,95.7 L97.2,104.9 L86.1,118.1 L79.9,133.7 L78.9,150.0 L83.1,165.2 L91.7,177.9 L103.4,186.7 L116.7,191.0 L130.0,190.5 L141.6,185.8 L150.1,177.7 L154.2,167.6 L152.5,157.3 L130.0,150.0\" stroke-width=\"1.4\"/>\n<circle cx=\"240\" cy=\"150\" r=\"5\" fill=\"currentColor\"/>\n<circle cx=\"130\" cy=\"150\" r=\"4\" fill=\"currentColor\"/>\n<text x=\"130\" y=\"290\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">קלאסי: קריסה בתוך כ-10⁻¹¹ ש'<\/text>\n<text x=\"246\" y=\"140\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"start\">התחלה<\/text>\n<circle cx=\"390\" cy=\"150\" r=\"110\" stroke-width=\"2.5\"/>\n<circle cx=\"390\" cy=\"150\" r=\"4\" fill=\"currentColor\"/>\n<line x1=\"390\" y1=\"150\" x2=\"500\" y2=\"150\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n<text x=\"445\" y=\"143\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">a₀ = 0.529 Å<\/text>\n<text x=\"390\" y=\"168\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">פרוטון<\/text>\n<text x=\"390\" y=\"290\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">נמדד: גודל קבוע לכל אטום מימן<\/text>\n<\/svg>\n<figcaption>משמאל: אלקטרון קלאסי שמתחיל ברדיוס a₀, משדר ומסתחרר אל הפרוטון (מספר הסיבובים סכמטי; בחישוב הקלאסי הם כמאתיים אלף). מימין: הטבעת ברדיוס a₀ שבה נמצא אלקטרון במימן אמיתי, תמיד. שני הרדיוסים ההתחלתיים שווים; הפרוטון מוגדל מאוד.<\/figcaption><\/figure>"], ["md", "\n**לתורה אין גודל.** אבל זמן קצר הוא רק הסימפטום. המחלה עמוקה יותר, ואפשר לאבחן אותה בלי לפתור שום משוואה, בכלי שמהנדסים משתמשים בו לפני כל חישוב: ניתוח ממדים. נשאל מאילו גדלים אפשר בכלל לבנות אורך בפיזיקה של 1911, ומה יוצא.\n\nבמימן יש שלושה גדלים שהתורה הקלאסית מכירה. מסת האלקטרון $m$, ביחידות של מסה. עוצמת המשיכה $ke^2$, שהיא כוח כפול ריבוע מרחק, כלומר אנרגיה כפול אורך. ומהירות האור $c$, שנכנסת דרך השידור. נכתוב את הממדים של כל אחד במסה $M$, אורך $L$ וזמן $T$:\n\n$$[m]=M,\\qquad [ke^2]=M\\,L^3\\,T^{-2},\\qquad [c]=L\\,T^{-1}.$$\n\nנחפש צירוף $m^{\\alpha}(ke^2)^{\\beta}c^{\\gamma}$ שהממד שלו הוא אורך בלבד. מהמסה, מהאורך ומהזמן מקבלים שלוש משוואות לשלושה מעריכים:\n\n$$\nM:\\ \\alpha+\\beta=0,\\qquad\nL:\\ 3\\beta+\\gamma=1,\\qquad\nT:\\ -2\\beta-\\gamma=0 .\n$$\n\nמהשתיים האחרונות $\\beta=1$ ו-$\\gamma=-2$, ומהראשונה $\\alpha=-1$. יש צירוף אחד בדיוק, והוא:\n\n$$r_e=\\frac{ke^2}{mc^2}=2.8\\times10^{-15}\\ \\text{m}.$$\n\nזה אורך קטן פי עשרים אלף מהאטום. ובלי $c$ המצב גרוע עוד יותר: עם $m$ ו-$ke^2$ לבדם, משוואת הזמן דורשת $\\beta=0$, ואז אין אורך בכלל. לפיזיקה הקלאסית אין שום מספר שיכול להיות הגודל של אטום. מקסוול שאל איפה התבנית, והתשובה של 1911 היא שהתבנית חסרה, וחסר בה קבוע טבע.\n\nומי שמכיר את הספקטרום ידע שהחסר הזה לא תאורטי. אטום מימן שמסתחרר פנימה היה משדר בתדר שעולה ברציפות, כמו צפירה. בפועל הוא משדר כמה צבעים חדים בלבד, אותם צבעים בכל מעבדה. הספקטרום היה הרמז שהתבנית קיימת, ושהיא בדידה.\n\n"], ["box", "numeric", "שאלה מספרית", "באותה שיטת מעריכים, בנו מ-$m$, ‏$ke^2$ ו-$c$ את הגודל היחיד שהממד שלו הוא **זמן**, וחשבו אותו. ($r_e=2.82\\times10^{-15}$ מ', $c=3.00\\times10^{8}$ מ'/ש'.)\n\n<details><summary>פתרון<\/summary>\n\nנחפש $m^{\\alpha}(ke^2)^{\\beta}c^{\\gamma}$ עם ממד $T$: המסה נותנת $\\alpha+\\beta=0$, האורך $3\\beta+\\gamma=0$, והזמן $-2\\beta-\\gamma=1$. מכאן $\\beta=1$, ‏$\\gamma=-3$, ‏$\\alpha=-1$, כלומר $ke^2/mc^3=r_e/c$.\nהמספר: $2.82\\times10^{-15}/3.00\\times10^{8}=9.4\\times10^{-24}$ ש'. גם זה קטן בהרבה מכל זמן של אטום אמיתי (סיבוב אחד במימן לוקח כ-$1.5\\times10^{-16}$ ש'), עוד סימן שהתבנית חסרה.\n- wrong: 3.1e-7 :: חילקתם במקום לכפול באחד המעריכים; בדקו את משוואת האורך.\n\n\n<\/details>"], ["md", "\n### 4.2 הקבוע החסר: פלאנק, איינשטיין ובוהר, 1900–1913\n\nהקבוע שחסר כבר היה קיים, ומי שמצא אותו לא רצה בו. ב-1900 ניסה מקס פלאנק בברלין להסביר את הצבע של גוף לוהט, בעיה שהגיעה אליו מתעשיית התאורה: איזה חלק מהאנרגיה של חוט להט יוצא כאור נראה, ואיזה כחום <span class=\"cert\">ודאות: בינונית<\/span>. כל ניסיון קלאסי נתן תשובה אבסורדית, אינסוף אנרגיה באורכי גל קצרים. פלאנק מצא נוסחה שמתאימה למדידות רק אם מניחים שאנרגיה של תנודה בתדר $f$ נמסרת במנות של $hf$. הוא קרא לזה \"מעשה של ייאוש\" <span class=\"cert\">ודאות: גבוהה<\/span>, וקיווה שבסוף אפשר יהיה לשלוח את $h$ לאפס.\n\nב-1905 לקח איינשטיין את המנות ברצינות שפלאנק עצמו לא העז. הוא טען שהאור עצמו בנוי ממנות, שיותר מאוחר נקראו פוטונים, ושאנרגיית הפוטון היא\n\n"], ["box", "formula", "נוסחה: אנרגיית הפוטון (photon energy)", "כמה אנרגיה נושאת מנה אחת של אור בצבע נתון. זה הגשר בין קווי הספקטרום, שנמדדים באורך גל, לבין האנרגיות של האטום.\n$$E=hf=\\frac{hc}{\\lambda},\\qquad h=6.626\\times10^{-34}\\ \\text{J·s},\\qquad hc=1240\\ \\text{eV·nm}\\tag{1}$$\n$f$ התדר ו-$\\lambda$ אורך הגל. אור כחול, בגל קצר, בא במנות גדולות יותר מאור אדום. תקף לכל אור, מגלי רדיו ועד קרני גמא.\n"], ["md", "\nהטענה נשמעה מופרכת עד כדי כך שמיליקן בשיקגו בילה עשר שנים בניסיון להפריך אותה, ובסוף, ב-1916, מדד את $h$ דרכה בדיוק של אחוז <span class=\"cert\">ודאות: גבוהה<\/span>. מהנדס יעריך את הסיפור הזה: התוצאה הכי משכנעת היא זו שמישהו ניסה בכל כוחו להרוג ולא הצליח.\n\n**הקבוע נותן לאטום גודל.** למהנדס חשובה כאן שאלה אחת: מה הממדים של $h$? ג'אול כפול שנייה הוא $M\\,L^2\\,T^{-1}$, תנע כפול אורך. יש לו \"שעון\" משלו, ולכן הוא יכול להשלים את מה שחסר ל-$m$ ול-$ke^2$. נחזור על חיפוש המעריכים של 4.1, עם $\\hbar=h/2\\pi$ במקום $c$ (את ה-$2\\pi$ נצדיק בסעיף הבא):\n\n$$\nm^{\\alpha}(ke^2)^{\\beta}\\hbar^{\\delta}:\\qquad\nM:\\ \\alpha+\\beta+\\delta=0,\\quad\nL:\\ 3\\beta+2\\delta=1,\\quad\nT:\\ -2\\beta-\\delta=0 .\n$$\n\nהפתרון היחיד הוא $\\delta=2$, ‏$\\beta=-1$, ‏$\\alpha=-1$. נציב את המספרים, כשהקבוע $\\hbar^2/m$ ביחידות של אטום שווה ל-7.62 eV·Å²:\n\n$$a=\\frac{\\hbar^2}{m\\,ke^2}=\\frac{7.62\\ \\text{eV·Å}^2}{14.40\\ \\text{eV·Å}}=0.529\\ \\text{Å}.$$\n\nזה בדיוק הרדיוס הנמדד. ניתוח ממדים לבדו, בלי שום תורה, נותן את התשובה עד כדי מספר טהור, והמספר הזה יוצא כאן 1. זה מזל, לא חוק: בדרך כלל המספר הטהור הוא 2 או $\\pi$ או 0.3, וזה מה שמבדיל אומדן ממדים מגזירה. אבל דבר אחד ניתוח הממדים כבר אומר בוודאות: אם יש לאטום גודל, הוא חייב להכיל את $h$. מה שמחזיק את האטום הוא קוונטי.\n\n**בוהר: כלל בלי סיבה.** ב-1912 הגיע נילס בוהר, בן 27, למעבדה של רתרפורד במנצ'סטר, והחליט לכפות את $h$ על האטום. הצעד שלו היה גס ומבריק: הוא פשוט הכריז שהאלקטרון מותר רק במסלולים שבהם התנע הזוויתי, מכפלת התנע ברדיוס, הוא כפולה שלמה של $\\hbar$, ושבמסלולים האלה הוא לא משדר. לא היה לכך שום נימוק. בוהר עצמו כתב שההנחה \"סותרת לחלוטין\" את האלקטרודינמיקה <span class=\"cert\">ודאות: בינונית<\/span>.\n\nנראה מה הכלל נותן, כי התוצאה היא מה ששכנע את כולם. יש שני תנאים: הכוח החשמלי מספק את התאוצה המרכזית, והתנע הזוויתי מכומת. נבודד את המהירות מהתנאי השני ונציב בראשון:\n\n$$\n\\frac{mv^2}{r}=\\frac{ke^2}{r^2},\\qquad mvr=n\\hbar\n\\quad\\Longrightarrow\\quad\nv=\\frac{n\\hbar}{mr},\\qquad\n\\frac{n^2\\hbar^2}{mr^3}=\\frac{ke^2}{r^2}\n\\quad\\Longrightarrow\\quad\nr_n=n^2\\,\\frac{\\hbar^2}{m\\,ke^2}=n^2a_0 .\n$$\n\nהמסלול הנמוך ביותר, $n=1$, הוא בדיוק הרדיוס של ניתוח הממדים. ומה האנרגיה של כל מסלול? בתנועה מעגלית תחת כוח כזה האנרגיה הכוללת היא חצי מהפוטנציאלית (נוכיח זאת ב-4.4, כשנבנה את מושג האנרגיה), ולכן:\n\n$$E_n=-\\frac{ke^2}{2r_n}=-\\frac{ke^2}{2a_0}\\cdot\\frac{1}{n^2}=-\\frac{13.6\\ \\text{eV}}{n^2}.$$\n\n**הצבעים.** כשאלקטרון קופץ ממסלול גבוה לנמוך, ההפרש יוצא כפוטון אחד, ולפי (1) אורך הגל שלו נקבע בדיוק. נחשב את המעבר מ-$n=3$ ל-$n=2$:\n\n$$\\Delta E=13.6\\left(\\frac14-\\frac19\\right)=1.89\\ \\text{eV},\\qquad \\lambda=\\frac{hc}{\\Delta E}=\\frac{1240\\ \\text{eV·nm}}{1.89\\ \\text{eV}}=656\\ \\text{nm}.$$\n\n\n"], ["raw", "<figure><svg viewBox=\"0 0 520 300\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"13\" fill=\"none\" stroke=\"currentColor\">\n<line x1=\"120\" y1=\"280\" x2=\"420\" y2=\"280\" stroke-width=\"2\"/><text x=\"430\" y=\"284\" fill=\"currentColor\" stroke=\"none\">n=1, −13.6 eV<\/text>\n<line x1=\"120\" y1=\"85\" x2=\"420\" y2=\"85\" stroke-width=\"2\"/><text x=\"430\" y=\"89\" fill=\"currentColor\" stroke=\"none\">n=2, −3.4 eV<\/text>\n<line x1=\"120\" y1=\"49\" x2=\"420\" y2=\"49\" stroke-width=\"1.5\"/><text x=\"430\" y=\"53\" fill=\"currentColor\" stroke=\"none\">n=3, −1.51<\/text>\n<line x1=\"120\" y1=\"36\" x2=\"420\" y2=\"36\" stroke-width=\"1.2\"/><text x=\"430\" y=\"36\" fill=\"currentColor\" stroke=\"none\" font-size=\"11\">n=4, −0.85<\/text>\n<line x1=\"120\" y1=\"30\" x2=\"420\" y2=\"30\" stroke-width=\"1\"/>\n<line x1=\"120\" y1=\"20\" x2=\"420\" y2=\"20\" stroke-dasharray=\"4 3\"/><text x=\"430\" y=\"18\" fill=\"currentColor\" stroke=\"none\" font-size=\"11\">0 (משוחרר)<\/text>\n<line x1=\"200\" y1=\"49\" x2=\"200\" y2=\"80\" stroke=\"#c0392b\" stroke-width=\"2.5\"/><path d=\"M195,74 L200,84 L205,74\" stroke=\"#c0392b\" stroke-width=\"2.5\"/><text x=\"190\" y=\"70\" fill=\"#c0392b\" stroke=\"none\" text-anchor=\"end\">656 nm<\/text>\n<line x1=\"300\" y1=\"36\" x2=\"300\" y2=\"80\" stroke=\"#2a8c8c\" stroke-width=\"2.5\"/><path d=\"M295,74 L300,84 L305,74\" stroke=\"#2a8c8c\" stroke-width=\"2.5\"/><text x=\"310\" y=\"70\" fill=\"#2a8c8c\" stroke=\"none\">486 nm<\/text>\n<text x=\"270\" y=\"190\" fill=\"currentColor\" stroke=\"none\" text-anchor=\"middle\">אנרגיית הקשר: 13.6 eV<\/text>\n<line x1=\"150\" y1=\"280\" x2=\"150\" y2=\"20\" stroke-width=\"0.8\" stroke-dasharray=\"2 3\"/>\n<\/svg>\n<figcaption>רמות האנרגיה של מימן לפי בוהר, $E_n=-13.6/n^2$ eV, בקנה מידה. החצים הם שני המעברים שחושבו בסעיף: מ-3 ל-2 (656 ננומטר, אדום) ומ-4 ל-2 (486 ננומטר, כחול-ירוק). הרמות מתקבצות כלפי מעלה, ולכן הקווים בסדרה מתקרבים זה לזה.<\/figcaption><\/figure>"], ["md", "\nזה הקו האדום של המימן, שבלמר ניחש לו נוסחה ב-1885 בלי לדעת למה <span class=\"cert\">ודאות: גבוהה<\/span>. כל סדרת הקווים יצאה מכלל אחד ומשלושה קבועים, בדיוק של אלפית.\n\n**מה מהנדס היה חושד בו.** תוצאה מדויקת כזו מפתה להאמין במודל כולו, וזו בדיוק המלכודת. ההתאמה הוכיחה שהאנרגיות נכונות, לא שהאלקטרון באמת נע במעגל. מהנדס שבודק מודל לא שואל איפה הוא מצליח אלא איפה הוא אמור להיכשל, ושם המודל של בוהר קרס: באטום הליום, עם שני אלקטרונים, הוא נתן תשובות שגויות; לעוצמות של הקווים, כמה בהיר כל אחד, לא היה לו מה לומר; והכלל עצמו נשאר צו. פאולי כתב ב-1925 שהפיזיקה \"שוב מבולבלת מאוד\" <span class=\"cert\">ודאות: בינונית<\/span>. הסעיף הבא מתחיל משאלה אחת: למה דווקא $mvr=n\\hbar$?\n\n"], ["box", "numeric", "שאלה מספרית", "הקו הבא בסדרת בלמר הוא המעבר מ-$n=4$ ל-$n=2$. מה אורך הגל שלו לפי המודל של בוהר? $E_n=-13.6/n^2$ eV, ו-$hc=1240$ eV·nm.\n\n<details><summary>פתרון<\/summary>\n\nההפרש: $13.6\\,(1/4-1/16)=13.6\\times0.1875=2.55$ eV.\nאורך הגל: $1240/2.55=486$ nm, הקו הכחול-ירוק של המימן.\n- wrong: 656 :: זה המעבר מ-3 ל-2.\n- wrong: 365 :: זו האנרגיה $13.6/4$, כלומר יינון מ-$n=2$, לא מעבר ל-$n=4$.\n\n\n<\/details>"], ["md", "\n### 4.3 גל בלי מסלול: דה ברויי, הייזנברג ומיקרוסקופ מחשבתי\n\nהרמז הראשון לסיבה בא מכיוון לא צפוי. לואי דה ברויי, צעיר ממשפחת אצולה צרפתית שעבר מהיסטוריה לפיזיקה, שירת במלחמת העולם הראשונה בתחנת הרדיו שעל מגדל אייפל, ובילה שנים ליד גלים <span class=\"cert\">ודאות: בינונית<\/span>. בעבודת הדוקטורט שלו ב-1924 הציע היפוך של איינשטיין: אם לגל של אור יש חלקיק, אולי לחלקיק יש גל.\n\nלפי (1) לפוטון יש אנרגיה $hc/\\lambda$, ומתורת היחסות ידוע שהתנע שלו הוא האנרגיה חלקי $c$, כלומר $p=h/\\lambda$. דה ברויי הציע לקרוא את השוויון הזה הפוך, ולכל חלקיק:\n\n"], ["box", "formula", "נוסחה: אורך הגל של חלקיק (de Broglie wavelength)", "איזה אורך גל יש לחלקיק שנע בתנע נתון. ממנה ייצאו גם הכלל של בוהר וגם כל מה שמגביל את מיקרוסקופ האלקטרונים.\n$$\\lambda=\\frac{h}{p}\\tag{2}$$\n$\\lambda$ במטרים, $p$ התנע. תנע גדול פירושו גל קצר. תקף לכל חלקיק, בכל מהירות, כשמשתמשים בתנע הנכון (ב-4.5 נראה מה \"הנכון\" אומר במהירות גבוהה).\n"], ["md", "\nהוועדה בפריז לא ידעה מה לעשות בזה, ולנז'בן שלח את העבודה לאיינשטיין, שכתב שהיא \"מרימה פינה של הצעיף הגדול\" <span class=\"cert\">ודאות: בינונית<\/span>. הסיבה להתלהבות הייתה שהרעיון נתן לכלל של בוהר נימוק. גל שמקיף את הגרעין חייב להיסגר על עצמו, אחרת הוא מבטל את עצמו בסיבובים הבאים. כלומר על היקף המסלול צריך להיכנס מספר שלם של אורכי גל, ואז:\n\n$$n\\lambda=2\\pi r\\quad\\Longrightarrow\\quad n\\,\\frac{h}{p}=2\\pi r\\quad\\Longrightarrow\\quad pr=n\\,\\frac{h}{2\\pi}=n\\hbar .$$\n\nזה הכלל של בוהר, וה-$2\\pi$ שבו הוא פשוט ההיקף של מעגל. הצו הפך לתנאי גל.\n\nאבל ההסבר פתח שאלה גרועה מזו שסגר. אם האלקטרון הוא גל שפרוש סביב הגרעין, איפה האלקטרון? ומה בדיוק מתנודד? ב-1925 ורנר הייזנברג, בן 23, ברח מקדחת השחת לאי הסלעי הלגולנד, ובנה שם תורה שוויתרה מראש על מסלולים ועסקה רק במה שנמדד, בתדרים ובעוצמות של קווי הספקטרום. ב-1926 כתב שרדינגר משוואה לגל של האלקטרון, ומקס בורן הציע מה הגל מודד: את הסיכוי למצוא את האלקטרון בכל מקום. וב-1927 מצא הייזנברג את המשפט שאומר מה התורה החדשה אוסרת.\n\n**מדד למה שלא ידוע.** כדי לנסח את המשפט צריך מספר שמודד \"כמה לא ידוע\" המקום. נכין את אותו מצב פעמים רבות, נמדוד בכל פעם את המקום, ונשאל כמה רחוק בממוצע נופלות התוצאות מהממוצע שלהן. ממוצע של הסטיות עצמן לא יעבוד, כי סטיות חיוביות ושליליות מבטלות זו את זו ונותנות תמיד אפס. לכן מעלים בריבוע, ממצעים, ומוציאים שורש כדי לחזור ליחידות של מקום. זה בדיוק ה-RMS של הסטיות מ-M0.1.\n\n"], ["box", "definition", "הגדרה: פיזור (standard deviation)", "לגודל $x$ שמקבל ערכים שונים בחזרות על אותו מצב, עם ממוצע $\\langle x\\rangle$, הפיזור הוא\n$$\\Delta x=\\sqrt{\\big\\langle (x-\\langle x\\rangle)^2\\big\\rangle}.$$\nהוא מוגדר לכל התפלגות שהממוצע של הריבוע שלה סופי, וביחידות של $x$. פיזור אפס פירושו שכל המדידות נותנות אותו ערך.\n"], ["md", "\nנצטרך עוד שורה אחת על הפיזור, ונצטרך אותה בדיוק ברגע שבו נחשב את אנרגיית האטום: הקשר בין הפיזור לבין הממוצע של הריבוע. פותחים את הריבוע וממצעים איבר-איבר, כש-$\\langle x\\rangle$ הוא מספר קבוע:\n\n$$(\\Delta x)^2=\\langle x^2\\rangle-2\\langle x\\rangle\\langle x\\rangle+\\langle x\\rangle^2=\\langle x^2\\rangle-\\langle x\\rangle^2 .$$\n\nכשהממוצע אפס, הפיזור בריבוע הוא פשוט הממוצע של הריבוע. נזכור זאת: בתנע זה יהפוך לאנרגיה.\n\n"], ["box", "formula", "נוסחה: עקרון אי-הוודאות (uncertainty principle)", "כמה חד אפשר לדעת מקום ותנע יחד. זה החוק שייתן לאטום את גודלו.\n$$\\Delta x\\,\\Delta p\\ge\\frac{\\hbar}{2},\\qquad \\hbar=\\frac{h}{2\\pi}=1.055\\times10^{-34}\\ \\text{J·s}\\tag{3}$$\n$\\Delta x$ ו-$\\Delta p$ הם הפיזורים של המקום ושל התנע באותו כיוון, בהרבה מדידות של אותו מצב. תקף לכל חלקיק ולכל מצב, בכל כיוון בנפרד.\n"], ["md", "\nמה המשפט משנה? בעולם הקלאסי אפשר היה לצמצם את שני הפיזורים יחד עד אפס, ומסלול הוא בדיוק זה: מקום ומהירות חדים בכל רגע. (3) אומר שמצב כזה לא קיים. בקופסה צרה פי 2, פיזור התנע גדל לפחות פי 2. המכפלה יכולה להיות גדולה מ-$\\hbar/2$, אבל לא קטנה ממנו.\n\n**למה דווקא $\\hbar/2$.** הצורה המדויקת הוכחה בידי קנארד ב-1927, והוכחה כללית שלה צריכה כלים שייבנו במודול של מרחבי פונקציות. אבל אפשר לראות מאיפה היא באה בחבילת גל אחת, וזה גם מראה שהחוק הוא בעצם משפט על גלים. חבילת גל צרה במקום חייבת להיות מורכבת מגלים רבים באורכי גל שונים, כי רק תערובת רחבה יכולה להתבטל בכל מקום חוץ מאזור קטן. החבילה הפעמונית, הגאוסיאנית, היא החסכונית ביותר, והיא נותנת את השוויון:\n\n"], ["box", "derivation", "גזירה: חבילת גל גאוסיאנית: $\\Delta x\\,\\Delta k=\\tfrac12$", "נבנה גל שהמשרעת שלו פעמון ברוחב שנבחר, $\\psi(x)=e^{-x^2/4\\sigma^2}$. ההסתברות היא ריבוע המשרעת, $|\\psi|^2=e^{-x^2/2\\sigma^2}$, וזו התפלגות נורמלית שהפיזור שלה $\\Delta x=\\sigma$.\n\nכמה מכל אורך גל יש בחבילה? המשרעת של הגל שמספר הגל שלו $k=2\\pi/\\lambda$ היא התמרת פורייה של $\\psi$. משלימים את המעריך לריבוע:\n$$-\\frac{x^2}{4\\sigma^2}-ikx=-\\frac{(x+2i\\sigma^2k)^2}{4\\sigma^2}-\\sigma^2k^2 ,$$\nולכן האינטגרל על $x$ נותן קבוע כפול $e^{-\\sigma^2k^2}$. ההסתברות לכל מספר גל היא הריבוע, $e^{-2\\sigma^2k^2}$: שוב פעמון, הפעם עם פיזור $\\Delta k=1/(2\\sigma)$.\n\nהמכפלה היא $\\Delta x\\,\\Delta k=\\tfrac12$, ולא תלויה ברוחב שבחרנו: חבילה צרה פי 2 רחבה פי 2 במספרי הגל. לפי (2), $p=h/\\lambda=\\hbar k$, ולכן $\\Delta x\\,\\Delta p=\\hbar/2$. כל צורה אחרת של חבילה נותנת מכפלה גדולה יותר; זה תוכן אי-השוויון.\n"], ["md", "\nבגלגלת למטה אפשר לראות את זה בעיניים: הקטינו את רוחב החבילה וראו כמה מחזורים נשארים בתוכה. חבילה צרה מכילה מעט מחזורים, ולכן אורך הגל שלה מוגדר גרוע; חבילה רחבה מכילה הרבה מחזורים ואורך גל חד.\n\n"], ["viz", "anim", {"title": "חבילת גל: צרה במקום, רחבה במספרי הגל", "caption": "הגל $e^{-x^2/4\\sigma^2}\\cos(k_0x)$ עם $k_0=4$. המחוון משנה את $\\sigma$; הטקסט מראה את $\\Delta k=1/2\\sigma$ ואת המכפלה, שנשארת חצי.", "duration": 8, "view": {"x": [-8, 8], "y": [-1.6, 1.8]}, "params": [{"id": "sig", "label": "רוחב החבילה σ", "min": 0.3, "max": 3, "value": 1.2}], "shapes": [{"type": "path", "x": "s", "y": "exp(-s^2/(4*sig^2))*cos(4*s - 2*t)", "s": [-8, 8], "accent": true}, {"type": "path", "x": "s", "y": "exp(-s^2/(4*sig^2))", "s": [-8, 8], "dash": true}, {"type": "path", "x": "s", "y": "-exp(-s^2/(4*sig^2))", "s": [-8, 8]}, {"type": "text", "x": "0", "y": "1.45", "text": "Δx = {sig}   Δk = {1/(2*sig)}   Δx·Δk = {sig*(1/(2*sig))}"}]}], ["md", "\nעכשיו אפשר לשאול מה המשמעות בעולם. נחשב את פיזור המהירות המינימלי, $\\Delta v=\\hbar/(2m\\,\\Delta x)$, לשני גופים:\n\n"], ["raw", "<figure><table><thead><tr><th>הגוף<\/th><th>המסה<\/th><th>המקום ידוע עד<\/th><th>פיזור המהירות המינימלי<\/th><th>במילים<\/th><\/tr><\/thead><tbody><tr><td>גרגר אבק<\/td><td>10⁻¹⁵ ק&quot;ג<\/td><td>מיקרומטר אחד<\/td><td>5.3×10⁻¹⁴ מ&#x27;/ש&#x27;<\/td><td>כ-1.7 מיקרומטר בשנה<\/td><\/tr><tr><td>אלקטרון<\/td><td>9.1×10⁻³¹ ק&quot;ג<\/td><td>אנגסטרום אחד<\/td><td>5.8×10⁵ מ&#x27;/ש&#x27;<\/td><td>כ-0.2% ממהירות האור<\/td><\/tr><\/tbody><\/table><figcaption>מה אי-הוודאות עולה, לגוף גדול ולגוף קטן<\/figcaption><\/figure>"], ["md", "\nאותו חוק, ושני עולמות. בגרגר האבק הוא בלתי נראה לכל מכשיר; באלקטרון שכלוא בגודל של אטום הוא מכתיב מהירות של מאות קילומטרים בשנייה. ההבדל כולו במסה שבמכנה, ובסדר הגודל של $\\hbar$.\n\n**הטעות במיקרוסקופ.** הייזנברג הסביר את החוק בניסוי מחשבתי, ויש בזה אירוניה. ב-1923, בבחינת הדוקטורט שלו במינכן, שאל אותו וילהלם וין מה כוח ההפרדה של מיקרוסקופ, והוא לא ידע, וכמעט נכשל <span class=\"cert\">ודאות: גבוהה<\/span>. ארבע שנים אחר כך בנה את הטיעון המפורסם שלו בדיוק על מיקרוסקופ.\n\nהטיעון הולך כך. כדי לראות אלקטרון מאירים אותו באור באורך גל $\\lambda$, ופוטון אחד מתפזר ממנו לתוך עדשה. העדשה רואה את האור בתוך חרוט שחצי זווית הפתח שלו $\\theta$, ומיקרוסקופ כזה לא מבחין בפרטים קטנים מכ-$\\lambda/(2\\sin\\theta)$ (את הסיבה נגזור ב-4.5). הפוטון נושא תנע $h/\\lambda$, וכשהוא מתפזר הוא נותן לאלקטרון מכה. גודל המכה בכיוון הרוחבי תלוי בכיוון שבו הפוטון יצא, ואת הכיוון הזה העדשה לא יודעת: כל כיוון בתוך החרוט מגיע לאותה נקודה בתמונה. לכן:\n\n$$\n\\Delta x\\approx\\frac{\\lambda}{2\\sin\\theta},\\qquad\n\\Delta p\\approx 2\\,\\frac{h}{\\lambda}\\sin\\theta\n\\qquad\\Longrightarrow\\qquad\n\\Delta x\\,\\Delta p\\approx h .\n$$\n\nשני \"כפתורי התכנון\", אורך הגל וזווית הפתח, מצטמצמים לגמרי. זו חתימה שמהנדס לומד לזהות: כשכל פרמטר תכן נעלם מהתוצאה, יש לפניו חסם שאי אפשר לקנות בכסף. גל קצר מחדד את המקום ומגדיל את המכה; פתח צר מקטין את אי-הוודאות בכיוון ופוגע בחדות. כל מה שמרוויחים בצד אחד משלמים בשני.\n\nאבל הגרסה הראשונה של הייזנברג לא הכילה את הפתח. בוהר, שקרא את הטיוטה בקופנהגן, הראה לו שהוא שכח בדיוק אותו: הוא ייחס את אי-הוודאות ל\"מכה\" עצמה, ולא לכך שכיוון הפוטון שנאסף לא ידוע. הוויכוח היה קשה עד כדי כך שהייזנברג סיפר שפרץ בבכי <span class=\"cert\">ודאות: בינונית<\/span>, והמאמר יצא עם הערת תיקון בסופו. הייזנברג שכח בבחינה את כוח ההפרדה של מיקרוסקופ, ושכח אותו שוב במאמר שהפך אותו למפורסם.\n\nהמחלוקת הייתה עמוקה יותר מפרט טכני. התמונה של \"המדידה מפריעה\" מניחה שיש לאלקטרון מקום ותנע מוגדרים, ושרק לא הצלחנו לדעת אותם. בוהר טען שאין מה לדעת. אפשר לבדוק זאת: מכינים הרבה אלקטרונים באותו מצב, ובחציים מודדים רק את המקום ובחצי השני רק את התנע, כך ששום מדידה לא מפריעה לאחרת. הפיזורים שמתקבלים עדיין מקיימים את (3). אי-הוודאות היא תכונה של המצב, לא פגם במכשיר. ומכאן גם שהמיקרוסקופ האמיתי, שעוד נגיע אליו, יפגוש את החוק הזה לא כמגבלה של העדשות שלו, אלא כמגבלה של מה שיש לראות.\n\n"], ["box", "domain", "חיבור לתחום אחר: אותו חשבון במכ\"ם: אורך פולס מול רוחב פס", "הגזירה של חבילת הגל לא השתמשה בשום דבר קוונטי עד השורה האחרונה. היא אומרת שאות שתופס אורך קצר חייב להכיל טווח רחב של תדרים:\n$$\\Delta x\\,\\Delta k\\ge\\tfrac12 .$$\n\n**במכ\"ם.** מכ\"ם שדה תעופה כמו ה-ASR-9 משדר פולס שנמשך כמיקרו-שנייה <span class=\"cert\">ודאות: בינונית<\/span>. במרחב הפולס הוא חבילה באורך 300 מטר. שתי מטרות נבדלות בטווח רק אם ההדים שלהן לא חופפים, והפרדת הטווח היא:\n$$\\Delta R=\\frac{c\\,\\tau}{2}=\\frac{c}{2B}.$$\nהחצי בא מכך שהגל עובר את המרחק הלוך וחזור. בפולס של מיקרו-שנייה, רוחב הפס הוא כ-1 MHz והפרדת הטווח כ-150 מטר.\n\n**ההתאמה.** כדי לרדת ל-15 מטר צריך פס רחב פי 10. זה אותו יחס כמו באטום: אלקטרון כלוא בקופסה צרה פי 10 מקבל פיזור תנע גדול פי 10.\n\n**איפה זה נשבר.** במכ\"ם רוחב הפס הוא תכונה של אות שנמדד כולו בירייה אחת, ואפשר לקנות אותו בלי לקצר את הפולס: מאפננים את התדר לאורך פולס ארוך (צ'ירפ) ודוחסים אותו במקלט. באטום אין אות למדוד בירייה אחת. $\\hbar$ הופך את פיזור מספרי הגל לפיזור של תנע החלקיק עצמו, שמתגלה רק כשכיחות בהרבה חזרות, ואין \"דחיסת פולס\" שעוקפת אותו.\n"], ["md", "\nהסעיף השאיר את החוק ביד, אבל עוד לא את התשובה. (3) אומר שהאלקטרון לא יכול לשבת במקום. כדי לדעת איפה הוא בכל זאת יושב, צריך לשקול את מה שהחוק עולה מול מה שהמשיכה מחזירה, וזה הסעיף הבא.\n\n"], ["box", "mcq", "שאלה", "מכ\"ם משדר פולס צ'ירפ באורך 50 מיקרו-שניות עם רוחב פס של 10 MHz. מהי הפרדת הטווח שלו אחרי דחיסת הפולס?\n- 7.5 ק\"מ, כי $c\\tau/2$ עם $\\tau=50$ מיקרו-שניות — *זו הפרדת הטווח של פולס לא מאופנן באותו אורך; הדחיסה משנה אותה.*\n- ✅ **15 מטר, כי אחרי הדחיסה קובע רוחב הפס: $c/2B$** — רוחב הפס הוא שקובע את אורך החבילה הדחוסה, כמו $\\Delta k$ בחבילת הגל.\n- 30 מטר, כי $c/B$ — *שכחתם שהגל עובר את המרחק הלוך וחזור.*\n- אי אפשר לדעת בלי הספק השידור — *ההספק קובע טווח גילוי, לא הפרדה.*\n"], ["md", "\n### 4.4 מחיר מול רווח: הגודל יוצא מהחוק\n\nעכשיו אפשר לענות על שאלת הפרק, והתשובה מתחילה במשפט אחד: נפילה עולה כסף. אילו האלקטרון ישב על הפרוטון, הפיזור במקום שלו היה כמעט אפס, ולפי (3) פיזור התנע היה עצום. תנע עצום הוא תנועה עצומה, והאלקטרון לא היה נשאר במקום. המשיכה מושכת פנימה, החוק דוחף החוצה, ובאמצע יש איזון. כדי למצוא אותו צריך לשקול שני דברים שונים, תנועה ומקום, באותו מטבע. המטבע הזה הוא האנרגיה, ונבנה אותו עכשיו, כי הוא מה שחסר לנו גם כדי לגזור את זמן הקריסה של 4.1.\n\n**עבודה.** המושג נולד מבעיה של מהנדסי מכרות במאה ה-19: כמה פחם צריך מנוע קיטור כדי להרים מים מהבור <span class=\"cert\">ודאות: בינונית<\/span>. התברר שמה שקובע את המחיר אינו הכוח לבדו, אלא הכוח כפול הדרך שלאורכה הוא פועל. קיר שדוחפים ולא זז לא עלה פחם.\n\n"], ["box", "definition", "הגדרה: עבודה (work)", "כוח קבוע $F$ שפועל בכיוון התנועה של גוף, בזמן שהגוף עובר דרך $d$, עושה עליו עבודה\n$$w=Fd.$$\nכשהכוח מנוגד לתנועה, העבודה שלילית. היחידה היא ג'אול, $1\\ \\text{J}=1\\ \\text{N·m}$. כשהכוח משתנה לאורך הדרך, מחלקים אותה לצעדים קטנים $dx$ שבכל אחד מהם הכוח כמעט קבוע, ומסכמים את $dw=F\\,dx$.\n"], ["md", "\n**תנועה כמחסן של עבודה.** כמה עבודה צריך כדי להביא מסה $m$ ממנוחה למהירות $v$? הציפייה הטבעית היא שהתשובה תלויה באיך דוחפים, חזק וקצר או חלש וארוך. נבדוק בכוח קבוע $F$: התאוצה קבועה, המהירות גדלה לינארית, והדרך כריבוע הזמן. נבודד את הזמן ונציב:\n\n$$\na=\\frac{F}{m},\\qquad v=at,\\qquad d=\\tfrac12at^2=\\frac{v^2}{2a}\n\\qquad\\Longrightarrow\\qquad\nw=Fd=ma\\cdot\\frac{v^2}{2a}=\\tfrac12mv^2 .\n$$\n\nהתאוצה נעלמה. העבודה תלויה רק במהירות הסופית, ולכן היא תכונה של הגוף הנע עצמו, לא של ההיסטוריה שלו. לתכונה הזו קוראים אנרגיה קינטית, ונכתוב אותה גם בעזרת התנע, כי (3) נותן לנו תנע ולא מהירות:\n\n"], ["box", "formula", "נוסחה: אנרגיה קינטית (kinetic energy)", "כמה עבודה אגורה בגוף שנע, כפונקציה של התנע שלו. זה המחיר שאי-הוודאות גובה מאלקטרון כלוא.\n$$K=\\tfrac12mv^2=\\frac{p^2}{2m}\\tag{4}$$\nהעבודה שצריך כדי להביא מסה $m$ ממנוחה לתנע $p$. תקף כשהמהירות קטנה בהרבה ממהירות האור $c$.\n"], ["md", "\nשווה להתעכב על ה-$m$ שבמכנה, כי שאר הפרק יסתובב סביבו. באותו תנע, גוף קל נושא הרבה יותר אנרגיה מגוף כבד. האלקטרון קל פי 1836 מהפרוטון, ולכן כל תנע שייכפה עליו יעלה לו ביוקר. ונרשום כבר עכשיו את ההנחה \"מהירות קטנה בהרבה מ-$c$\": באטום נבדוק שהיא מחזיקה, ובתוך המיקרוסקופ היא תישבר.\n\n**מקום כמחסן של עבודה.** אלקטרון שנמשך אל הפרוטון צובר מהירות כשהוא מתקרב. אנחנו רוצים כמות שתמדוד את התנועה \"שעוד לא נצברה\", כך שהסכום של שתי הכמויות לא ישתנה.\n\n"], ["box", "definition", "הגדרה: אנרגיה פוטנציאלית (potential energy)", "לכוח $F(r)$ שפועל לאורך הקו אל מרכז ותלוי רק במרחק $r$ (חיובי כלפי חוץ), אנרגיה פוטנציאלית היא פונקציה $U(r)$ שמקיימת\n$$F=-\\frac{dU}{dr}.$$\n$U$ נקבעת עד כדי קבוע. לכוחות שדועכים עם המרחק בוחרים $U=0$ באינסוף.\n"], ["md", "\nהמינוס אומר שהכוח דוחף לכיוון שבו $U$ יורדת, כמו כדור שמתגלגל במורד. למשיכה בין אלקטרון לפרוטון, $F=-ke^2/r^2$ (שלילי, כלומר פנימה), קל לנחש פונקציה ולבדוק בגזירה:\n\n$$U(r)=-\\frac{ke^2}{r},\\qquad -\\frac{dU}{dr}=-\\frac{ke^2}{r^2}=F.\\tag{5}$$\n\n$U$ שלילית בכל מרחק סופי, ואין בזה שום דבר מוזר: \"שלילית\" פירושו \"פחות מאשר כשהחלקיקים רחוקים זה מזה\". אפס אחר היה מזיז את כל הערכים בקבוע, והכוח, שהוא שיפוע, לא היה משתנה.\n\nלמה היה צריך את $U$? כי עכשיו שני הצדדים של החשבון נסגרים. בצעד קטן $dr$ הכוח עושה עבודה $F\\,dr$, שלפי ההגדרה היא בדיוק הירידה ב-$U$. ואותה עבודה, לפי החשבון שנתן את (4), נכנסת לאנרגיה הקינטית:\n\n$$dw=-dU\\quad\\text{וגם}\\quad dw=dK\\qquad\\Longrightarrow\\qquad d(K+U)=0 .$$\n\nהאנרגיה הכוללת $E=K+U$ נשמרת כל עוד פועל רק כוח כזה. מצב **קשור** הוא מצב עם $E<0$: כיוון ש-$K$ לעולם אינה שלילית, תמיד $U\\le E<0$, והחלקיק לא יכול להגיע לאינסוף, שם $U=0$. **אנרגיית הקשר** היא $-E$, העבודה שצריך להשקיע כדי לשחרר אותו.\n\n**המטבע הקטן.** ג'אול הוא יחידה ענקית לאטום, וכאן נכנס המכשיר שלנו. בלב כל שפופרת קרן ואוסצילוסקופ של שנות העשרים יש \"תותח אלקטרונים\": חוט מלובן שפולט אלקטרונים, ומתח גבוה שמאיץ אותם לאלומה. האנרגיה של האלומה נמדדת שם בוולטים של המאיץ, וזו היחידה הטבעית גם לאטום.\n\n"], ["box", "definition", "הגדרה: אלקטרון-וולט (electron-volt)", "**מתח** בין שתי נקודות הוא העבודה של השדה על מטען שעובר ביניהן, חלקי המטען; $1\\ \\text{V}=1\\ \\text{J/C}$. לכן מטען $q$ שעובר מתח $V$ צובר אנרגיה קינטית $qV$.\n**אלקטרון-וולט** הוא האנרגיה שמטען $e$ צובר במתח של וולט אחד:\n$$1\\ \\text{eV}=1.602\\times10^{-19}\\ \\text{J}.$$\n"], ["md", "\nאלקטרון שיוצא מתותח של 10 קילו-וולט נושא 10 keV. ביחידות האלה שני הקבועים של האטום הם מספרים נוחים:\n\n$$ke^2=14.40\\ \\text{eV·Å},\\qquad \\frac{\\hbar^2}{2m_e}=3.81\\ \\text{eV·Å}^2 .$$\n\n**האומדן, והנחות שנרשום.** עכשיו נשקול. נבנה את אנרגיית האטום כפונקציה של גודלו $r$, ונרשום כל הנחה בדרך, כי לכל אחת יהיה מחיר.\n\nהנחה ראשונה: אלקטרון שנמצא בתוך מרחק $r$ מהפרוטון מפוזר במקום על פני $r$ בערך, כלומר $\\Delta x\\approx r$. זו הנחה גסה בכוונה; נחזור אליה. לפי (3) פיזור התנע הוא לפחות $\\hbar/2r$, ואת החצי נשמיט לעת עתה, כך ש-$\\Delta p\\approx\\hbar/r$.\n\nהנחה שנייה: האטום במנוחה, ולכן התנע הממוצע אפס. כאן נכנסת הזהות של הפיזור מ-4.3: כשהממוצע אפס, הממוצע של ריבוע התנע שווה לפיזור בריבוע, $\\langle p^2\\rangle=(\\Delta p)^2$. לפי (4), זו אנרגיה קינטית ממוצעת של $\\hbar^2/(2m_er^2)$. האלקטרון לא יכול להימנע ממנה: היא המחיר של עצם הכליאה.\n\nהנחה שלישית: האנרגיה הפוטנציאלית שווה בערך לערכה במרחק $r$, כלומר $-ke^2/r$. נחבר:\n\n"], ["box", "formula", "נוסחה: אנרגיית האטום לפי גודלו (אומדן אי-הוודאות)", "כמה אנרגיה יש לאטום בגודל $r$, כשמחיר הכליאה ורווח המשיכה נספרים באותו מטבע. המינימום שלה הוא הגודל של האטום.\n$$E(r)\\approx\\frac{\\hbar^2}{2m_er^2}-\\frac{ke^2}{r}\\tag{6}$$\nהאיבר הראשון הוא מחיר הכליאה, השני רווח המשיכה. אומדן לסדר גודל, לחלקיק יחיד, במהירויות קטנות בהרבה מ-$c$.\n"], ["md", "\nכל הסיפור נמצא בחזקות של $r$ בשני האיברים. כשהאלקטרון מתקרב פי 2, הרווח גדל פי 2, והמחיר גדל פי 4. מרחוק הרווח שולט ומשתלם להתקרב; מקרוב המחיר שולט ומשתלם להתרחק. באמצע יש מרחק אחד שבו הסכום הכי נמוך, ושם האלקטרון נמצא. בגרף כדאי להסתכל איפה הקו של הסכום יורד לתחתית, ועל העובדה שאין לו תחתית בכלל כשמסירים את מחיר הכליאה:\n\n"], ["viz", "chart", {"title": "מחיר הכליאה מול רווח המשיכה", "caption": "שני האיברים של E(r) והסכום שלהם, ב-eV, כאשר ħ²/2m_e = 3.81 eV·Å² ו-ke² = 14.40 eV·Å. המינימום ב-r = 0.529 Å, בעומק 13.6 eV", "type": "line", "scope": {"A": 3.80998, "B": 14.3996}, "x": {"from": 0.25, "to": 3, "step": 0.01, "label": "r (Å)"}, "series": [{"name": "מחיר הכליאה ħ²/2m_e r²", "expr": "A/x^2"}, {"name": "רווח המשיכה −ke²/r", "expr": "-B/x"}, {"name": "הסכום E(r)", "expr": "A/x^2 - B/x"}], "yLabel": "eV"}], ["md", "\n**המינימום.** במינימום הנגזרת מתאפסת. נגזור את (6), נשווה לאפס, ונכפול ב-$r^3$ כדי להיפטר מהמכנים:\n\n$$\n\\frac{dE}{dr}=-\\frac{\\hbar^2}{m_er^3}+\\frac{ke^2}{r^2}=0\n\\qquad\\Longrightarrow\\qquad\n-\\frac{\\hbar^2}{m_e}+ke^2\\,r=0\n\\qquad\\Longrightarrow\\qquad\nr=\\frac{\\hbar^2}{m_eke^2}.\n$$\n\nנציב חזרה ב-(6) כדי לקבל את עומק המינימום. בנקודה הזו מחיר הכליאה הוא בדיוק חצי מרווח המשיכה, ולכן הסכום הוא מינוס חצי מהרווח:\n\n"], ["box", "formula", "נוסחה: רדיוס בוהר ואנרגיית הקשר של המימן", "הגודל של אטום המימן ועומק הבור שלו, מתוך שלושה קבועים בלבד. זו התשובה לשאלת הפרק.\n$$a_0=\\frac{\\hbar^2}{m_e\\,ke^2}=0.529\\ \\text{Å},\\qquad E_{min}=-\\frac{ke^2}{2a_0}=-\\frac{m_e(ke^2)^2}{2\\hbar^2}=-13.6\\ \\text{eV}\\tag{7}$$\nתקף לאלקטרון אחד סביב גרעין; לגרעין במטען $Ze$ מחליפים $ke^2$ ב-$Zke^2$.\n"], ["md", "\nכדי לוודא שזה מינימום ולא מקסימום, נגזור פעם שנייה. במינימום הנגזרת השנייה היא $ke^2/a_0^3$, כ-97 eV לאנגסטרום בריבוע: חיובית, וגדולה. מהנדס יקרא את המספר הזה כקשיחות. לדחוס או למתוח את האטום בעשירית אנגסטרום עולה כחצי eV, פי עשרים מאנרגיית החום של החדר. לכן אטומים בחדר לא \"מתנפחים\" מחום; הגודל שלהם יציב כמו המטבע שמקסוול דיבר עליו.\n\nזה הרדיוס של בוהר, אבל הפעם בלי שום כלל על מסלולים. הוא יצא מחוק אחד על מה שאפשר לדעת, והוא עונה על שני חלקי השאלה יחד. האלקטרון לא נופל, כי נפילה היא כליאה, וכליאה עולה יותר ממה שהמשיכה מחזירה. וכל אטומי המימן זהים, כי המינימום תלוי רק ב-$\\hbar$, ב-$m_e$ וב-$ke^2$, שזהים בכל מקום ביקום. לאטום אין \"היסטוריה\" שתבחר רדיוס אחר, כמו שיש למערכת השמש, שבה מסלול כדור הארץ הוא תוצאה של איך שהיא נוצרה. התבנית שמקסוול חיפש היא הקבועים.\n\n**מה שולט בתוצאה.** $a_0$ גדל כמו $\\hbar^2$. כש-$\\hbar$ שואף לאפס, גם $a_0$ שואף לאפס, וזו בדיוק הקריסה של 4.1: התורה הקוונטית היא שעושה את האטום גדול. חלקיק כבד יותר נכלא בזול, ולכן האטום שלו קטן; משיכה חזקה יותר מקרבת. ובמינימום האנרגיה הקינטית היא $+13.6$ eV והפוטנציאלית $-27.2$ eV. האלקטרון באטום, במצב הנמוך ביותר שלו, נע, ולא יכול שלא לנוע.\n\nאפשר לבדוק את הטענה הזו ישירות: המחוון למטה מכפיל את $\\hbar$ בגורם. הקטינו אותו לכיוון אפס, וראו את הבור מעמיק ואת המינימום בורח אל הפרוטון; זו הקריסה של 4.1, שהתורה הקוונטית עוצרת.\n\n"], ["viz", "anim", {"title": "מה קורה לאטום כש-ħ קטן", "caption": "הקו הוא $E(r)$ של (6), עם $\\hbar$ כפול הגורם שבמחוון. העיגול הוא המינימום: $a_0$ גדל כמו $\\hbar^2$, והעומק כמו $1/\\hbar^2$.", "duration": 6, "view": {"x": [0, 3], "y": [-40, 15], "equal": false, "xlabel": "r (Å)", "ylabel": "eV"}, "params": [{"id": "f", "label": "ħ כפול", "min": 0.55, "max": 1.4, "value": 1}], "shapes": [{"type": "path", "x": "s", "y": "3.81*f^2/s^2 - 14.4/s", "s": [0.05, 3], "accent": true}, {"type": "line", "x1": "0", "y1": "0", "x2": "3", "y2": "0", "dash": true}, {"type": "circle", "x": "0.529*f^2", "y": "-13.6/f^2", "r": "0.04", "fill": true}, {"type": "text", "x": "1.9", "y": "10", "text": "a₀ = {0.529*f^2} Å    E = {-13.6/f^2} eV"}]}], ["md", "\n**בדיקה של ההנחה שרשמנו.** מהירות קטנה בהרבה מ-$c$? מ-$K=\\tfrac12m_ev^2=13.6$ eV יוצא שהיחס בין מהירות האלקטרון למהירות האור הוא $ke^2/\\hbar c=1/137$. ההנחה מחזיקה היטב, והתיקון היחסותי לאנרגיה הוא בסדר גודל של הריבוע של המספר הזה, כחצי מאית האחוז.\n\n**תקציב השגיאה, ובמה הוא מטעה.** האנרגיה שנמדדת לקריעת אלקטרון ממימן היא 13.598 eV, מול 13.606 שלנו <span class=\"cert\">ודאות: גבוהה<\/span>. את ההפרש, 0.06%, נותנת תנועת הפרוטון: הוא כבד רק פי 1836, ולכן גם הוא מתנדנד מעט סביב מרכז המסה, וכשמחליפים את $m_e$ במסה המצומצמת $m_em_p/(m_e+m_p)$ מקבלים 13.598 בדיוק. מהנדס יעצור כאן דווקא בגלל ההתאמה. דיוק של אלפית מאומדן שבחר $\\Delta x\\approx r$ בלי הצדקה הוא חשוד, וצריך לשאול אם זה מזל.\n\nזה מזל, בשני מובנים. ראשית, במצב היסוד האמיתי של המימן הפיזור במקום, בכל כיוון, הוא $a_0$, והפיזור בתנע הוא $\\hbar/(\\sqrt3\\,a_0)$. המכפלה היא $\\hbar/\\sqrt3$, כ-0.58 של $\\hbar$ ולא 0.5: האטום אינו המצב הכי חסכוני שהחוק מתיר, והאומדן שלנו \"פגע\" כי שתי ההנחות הגסות שלו מבטלות זו את זו.\n\nשנית, אילו שמרנו את החצי של (3), היינו מקבלים אטום של 0.132 Å וקשר של 54.4 eV, טעות פי 4. האומדן קובע את התלות בקבועים ואת סדר הגודל; גורמים של 2 או 4 הוא לא קובע.\n\nובאטום עם כמה אלקטרונים הוא נשבר לגמרי, כי שם נכנס כלל נוסף, עקרון האיסור של פאולי, שנלמד בפרק הבא.\n\n**$h$ במקום $\\hbar$.** מערכת AI שמציבה ב-(7) את $h$ במקום $\\hbar$ תקבל אטום של 20.9 Å וקשר של 0.345 eV. שתי בדיקות מהירות תופסות את זה. אטום הוא כאנגסטרום, לא עשרים. ו-0.345 eV הם רק פי 13 מאנרגיית החום של החדר, כך שאטומים היו מאבדים את האלקטרונים שלהם בחום של תנור אפייה.\n\n**פירעון החוב של 4.1.** יש לנו עכשיו את המטבע, ואפשר לגזור את זמן הקריסה הקלאסי שהבטחנו. הגזירה מלאה, ושלושת הצעדים שלה הם אותה תוכנית: כמה אנרגיה יש במסלול, כמה מהר היא יוצאת, ומה זה עושה לרדיוס.\n\n"], ["box", "derivation", "גזירה: זמן הקריסה של האטום הקלאסי", "**ההנחות:** אלקטרון נקודתי, מסלול כמעט מעגלי, מהירות קטנה בהרבה מ-$c$, ושידור לפי הפיזיקה הקלאסית של פרק 3. את קצב השידור של מטען מואץ חישב לרמור ב-1897, וזו התוצאה הכמותית של 3.2:\n$$P=\\frac{2}{3}\\,\\frac{ke^2\\,a^2}{c^3}.$$\nההספק גדל כריבוע התאוצה, ולכן מסלול הדוק משדר הרבה יותר.\n\n**האנרגיה במסלול.** כוח קולון מספק את התאוצה המרכזית. מהשוויון יוצאת האנרגיה הקינטית, ואיתה הכוללת, וזה גם היחס \"חצי מהפוטנציאלית\" שבוהר השתמש בו ב-4.2:\n$$\\frac{mv^2}{r}=\\frac{ke^2}{r^2}\\ \\Longrightarrow\\ K=\\frac{ke^2}{2r},\\qquad E=K+U=-\\frac{ke^2}{2r}.$$\n\n**קצב הנפילה.** התאוצה היא $ke^2/(mr^2)$. ההספק שיוצא הוא הירידה באנרגיה בכל שנייה, $dE/dt=-P$. נגזור את $E$ לפי הזמן דרך $r$:\n$$\\frac{ke^2}{2r^2}\\,\\frac{dr}{dt}=-\\frac{2}{3}\\,\\frac{ke^2}{c^3}\\left(\\frac{ke^2}{mr^2}\\right)^{2}\\ \\Longrightarrow\\ \\frac{dr}{dt}=-\\frac{4}{3}\\,\\frac{(ke^2)^2}{m^2c^3}\\cdot\\frac{1}{r^2}.$$\nקצב הנפילה גדל כמו $1/r^2$: הקריסה מאיצה ככל שהאלקטרון מתקרב.\n\n**הזמן.** נפריד משתנים ונסכם מ-$a_0$ עד אפס. בעזרת $r_e=ke^2/mc^2$ מ-4.1 התוצאה מתקצרת:\n$$\\int_{a_0}^{0} r^2\\,dr=-\\frac{4}{3}\\,\\frac{(ke^2)^2}{m^2c^3}\\,t\\ \\Longrightarrow\\ t=\\frac{a_0^3}{4\\,r_e^2\\,c}=1.6\\times10^{-11}\\ \\text{s}.$$\n"], ["md", "\nנשאר לבדוק את ההנחה המפוקפקת ביותר: אמרנו \"מסלול כמעט מעגלי\", אבל האלקטרון מסתחרר, אז אולי החשבון כולו לא חוקי? הבדיקה היא להשוות את מה שהוא מאבד בסיבוב אחד לאנרגיה שיש לו. בסיבוב הראשון הוא מאבד כ-$4\\times10^{-5}$ eV, מתוך כ-14. ההפסד בכל סיבוב זעיר, ולכן בכל רגע המסלול כמעט מעגלי, והאלקטרון מספיק להשלים כמאתיים אלף סיבובים בדרך פנימה. ההנחה מחזיקה כמעט עד הסוף. הקריסה איננה טעות בחשבון; היא מה שהפיזיקה הקלאסית באמת אומרת, ולכן היה צריך להחליף אותה.\n\n"], ["box", "numeric", "שאלה מספרית", "ב-1913 ייחס בוהר סדרת קווים מוזרה בספקטרום של כוכבים, שנחשבו ל\"קווים של מימן\", ליון הליום $\\text{He}^+$: אלקטרון אחד סביב גרעין במטען $+2e$. פאולר במעבדה התנגד שהיחסים לא מתאימים, ובוהר ענה שצריך להביא בחשבון את תנועת הגרעין, וההתאמה נעשתה מושלמת <span class=\"cert\">ודאות: בינונית<\/span>. לפי (7), מהי אנרגיית הקשר של $\\text{He}^+$?\n\n<details><summary>פתרון<\/summary>\n\nבגרעין במטען $2e$ מחליפים ב-(7) את $ke^2$ ב-$2ke^2$.\nהרדיוס: $a=\\hbar^2/(m_e\\cdot2ke^2)=a_0/2=0.265$ Å.\nהאנרגיה: $E=-2ke^2/(2a)=-2ke^2/a_0=4\\times(-13.6)=-54.4$ eV, וזה הערך שנמדד.\n- wrong: 27.2 :: הוכפלה רק המשיכה, ונשכח שגם הרדיוס קטן פי 2; האנרגיה גדלה כמו $Z^2$.\n- wrong: 6.8 :: המשיכה החזקה טופלה כאילו היא מגדילה את האטום.\n\n\n<\/details>"], ["md", "\n### 4.5 המיקרוסקופ האמיתי: האם אפשר לראות את מה שגזרנו?\n\nבזמן שהייזנברג ובוהר התווכחו בקופנהגן על מיקרוסקופ מחשבתי, בבית הספר הטכני בברלין עבדו מקס קנול והסטודנט שלו ארנסט רוסקה על בעיה מעשית לגמרי: אוסצילוסקופים שמתעדים ברקים וקפיצות מתח בקווי מתח גבוה. הם השתמשו בתגלית של בוש מ-1926, שסליל שזרם עובר בו ממקד אלומת אלקטרונים כמו שעדשת זכוכית ממקדת אור. ב-1931 הציבו שני סלילים בטור וקיבלו תמונה מוגדלת, פי 17 בלבד <span class=\"cert\">ודאות: בינונית<\/span>.\n\nההגדלה הזו הייתה מגוחכת לעומת מיקרוסקופ אור, אבל המטרה הייתה לעקוף מכשול בן חצי מאה. ב-1873 הראה ארנסט אבה, שעבד עם קרל צייס ביינה, שמיקרוסקופ אור לא יבחין לעולם בפרטים קטנים מכמאתיים ננומטר, ושום ליטוש של עדשות לא יעזור <span class=\"cert\">ודאות: גבוהה<\/span>. הגבול הזה הוא מה שהבטחנו לגזור ב-4.3, וכדאי לגזור אותו עכשיו, כי הוא יחזור אלינו בצורה מפתיעה.\n\n**הגבול של אבה.** הרעיון של אבה היה להסתכל על הדוגמה הפשוטה ביותר שיש בה פרט: סריג, פסים במרווח $d$. אור שפוגע בסריג יוצא ממנו בכמה כיוונים. האור שממשיך ישר נושא רק את הבהירות הממוצעת; המידע על הפסים נמצא באלומות שמתכופפות. האלומה הראשונה יוצאת בזווית שבה הגלים מפסים שכנים מתחזקים, כלומר כשהפרש הדרך ביניהם הוא אורך גל אחד:\n\n$$d\\,\\sin\\theta_1=\\lambda .$$\n\nכדי שהתמונה תכיל פסים בכלל, העדשה צריכה לאסוף לפחות את האלומה הזו. היא אוספת רק אור בתוך חצי זווית פתח $\\alpha$, ולכן צריך $\\sin\\theta_1\\le\\sin\\alpha$. כשמאירים באלכסון, אפשר להכניס את האלומה הישרה בקצה אחד של הפתח ואת האלומה המתכופפת בקצה השני, וזה מרוויח פי 2. בתווך עם מקדם שבירה $n$ אורך הגל מתקצר פי $n$:\n\n"], ["box", "formula", "נוסחה: הגבול של אבה (Abbe diffraction limit)", "מהו הפרט הקטן ביותר שעדשה יכולה להפריד בגל נתון. זה הקיר של מיקרוסקופ האור, והוא שאיים על מיקרוסקופ האלקטרונים.\n$$d_{min}=\\frac{\\lambda}{2\\,n\\sin\\alpha}\\tag{8}$$\n$\\lambda$ אורך הגל בריק, $\\alpha$ חצי זווית הפתח של העדשה, $n$ מקדם השבירה בין הדוגמה לעדשה, ו-$n\\sin\\alpha$ נקרא הצמצם הנומרי. תקף לכל הדמיה בגלים דרך עדשה, בכל סוג של גל.\n"], ["md", "\nהצמצם הנומרי של עדשת טבילה בשמן טובה הוא כ-1.4, ולכן אור ירוק של 550 ננומטר נותן כמאתיים ננומטר. זה הקיר. הדרך היחידה דרכו היא גל קצר יותר, ולאלקטרונים, חשבו קנול ורוסקה, אין גל בכלל. הם חלקיקים.\n\nכדאי לראות את הטיעון של אבה בתנועה. במחוונים: מרווח הסריג, ביחידות של אורך גל, וחצי זווית הפתח של העדשה. כשהמרווח קטן, האלומות הראשונות נפתחות לזווית רחבה ויוצאות מחוץ לפתח, והפסים נעלמים מהתמונה.\n\n"], ["viz", "anim", {"title": "הגבול של אבה: האם העדשה אוספת את האלומה הראשונה?", "caption": "סריג במרווח d (באורכי גל), מואר ישר מלמטה. הקווים הם האלומה הישרה והאלומות הראשונות, בזווית $\\sin\\theta_1=\\lambda/d$; הקווים המקווקווים הם שולי הפתח של העדשה. כשהאלומה הראשונה מחוץ לפתח, הפסים לא נראים. בהארה ישרה הגבול הוא $\\lambda/\\sin\\alpha$; בהארה באלכסון מרוויחים פי 2, כמו ב-(8).", "duration": 6, "view": {"x": [-6, 6], "y": [-0.5, 6]}, "params": [{"id": "d", "label": "מרווח הסריג d/λ", "min": 1.02, "max": 4, "value": 2}, {"id": "a", "label": "חצי זווית הפתח (מעלות)", "min": 10, "max": 70, "value": 40}], "shapes": [{"type": "line", "x1": "-3", "y1": "0", "x2": "3", "y2": "0"}, {"type": "line", "x1": "0", "y1": "0", "x2": "0", "y2": "5.5"}, {"type": "line", "x1": "0", "y1": "0", "x2": "5.5/d", "y2": "5.5*sqrt(1-1/d^2)", "accent": true}, {"type": "line", "x1": "0", "y1": "0", "x2": "-5.5/d", "y2": "5.5*sqrt(1-1/d^2)", "accent": true}, {"type": "line", "x1": "0", "y1": "0", "x2": "5.5*sin(a*pi/180)", "y2": "5.5*cos(a*pi/180)", "dash": true}, {"type": "line", "x1": "0", "y1": "0", "x2": "-5.5*sin(a*pi/180)", "y2": "5.5*cos(a*pi/180)", "dash": true}, {"type": "text", "x": "0", "y": "-0.3", "text": "זווית האלומה הראשונה {asin(1/d)*180/pi}°, הפתח {a}°, הפרט הקטן ביותר {1/sin(a*pi/180)} λ"}]}], ["md", "\nואז, ב-1932, נתקל רוסקה ברעיון של דה ברויי. בהרצאת הנובל שלו ב-1986 סיפר שהתאכזב מאוד: אם לאלקטרון יש גל, גם מיקרוסקופ האלקטרונים כפוף לגבול של אבה, וכל העבודה הייתה לשווא <span class=\"cert\">ודאות: בינונית<\/span>. ואז ישב וחישב את אורך הגל. אלקטרון שעובר מתח $V$ צובר אנרגיה $eV$, ולפי (4) התנע שלו הוא $\\sqrt{2m_e eV}$. לפי (2):\n\n$$\\lambda=\\frac{h}{\\sqrt{2m_e\\,eV}}=\\frac{1.226\\ \\text{nm}}{\\sqrt{V/\\text{וולט}}}.$$\n\nב-10 קילו-וולט זה 12.3 פיקומטר, קצר פי 45 אלף מאור ירוק. הגבול היה עדיין שם, אבל הרחק מתחת לכל מה שעניין מישהו. ב-1933 עבר המכשיר של רוסקה את כוח ההפרדה של מיקרוסקופ האור, וב-1939 מכרה סימנס את הראשון המסחרי <span class=\"cert\">ודאות: גבוהה<\/span>. ההתאכזבות של רוסקה היא שיעור קטן בשיפוט הנדסי: מגבלה עקרונית שווה רק את המספר שלה.\n\n**ההנחה שנשברת.** מיקרוסקופים חודרים של היום עובדים במאות קילו-וולט <span class=\"cert\">ודאות: גבוהה<\/span>, וכאן נפרעת ההנחה שרשמנו ב-(4). אלקטרון של 100 keV כבר נע ביותר מחצי ממהירות האור, ונוסחת האנרגיה הקינטית $p^2/2m$ לא נכונה. מתורת היחסות, שתילמד במודול משלה, ניקח את הקשר בין האנרגיה הכוללת לתנע, כשמסת המנוחה של האלקטרון שקולה ל-511 keV:\n\n$$E^2=(pc)^2+(m_ec^2)^2,\\qquad E=K+m_ec^2 .$$\n\nכשמכניסים את השני לראשון, $(m_ec^2)^2$ מצטמצם משני הצדדים, ונשאר ביטוי לתנע. מהנדס לא מקבל נוסחה כזו בלי לבדוק מקרה גבול, ולכן נבדוק מיד: כש-$K$ קטנה בהרבה מ-511 keV, הסוגריים שואפים ל-1, וחוזרים ל-$p^2=2m_eK$ של (4):\n\n$$\n(K+m_ec^2)^2=(pc)^2+(m_ec^2)^2\n\\quad\\Longrightarrow\\quad\np=\\sqrt{2m_eK\\left(1+\\frac{K}{2m_ec^2}\\right)},\n\\qquad\n\\lambda=\\frac{h}{p}.\n$$\n\nהטבלה מראה כמה התיקון שווה בכל מתח:\n\n"], ["raw", "<figure><table><thead><tr><th>מתח ההאצה<\/th><th>מהירות (חלק מ-c)<\/th><th>λ לפי p²/2m<\/th><th>λ מתוקן<\/th><th>התיקון<\/th><\/tr><\/thead><tbody><tr><td>10 kV<\/td><td>0.19<\/td><td>12.26 pm<\/td><td>12.20 pm<\/td><td>0.5%<\/td><\/tr><tr><td>100 kV<\/td><td>0.55<\/td><td>3.88 pm<\/td><td>3.70 pm<\/td><td>4.8%<\/td><\/tr><tr><td>200 kV<\/td><td>0.70<\/td><td>2.74 pm<\/td><td>2.51 pm<\/td><td>9.3%<\/td><\/tr><tr><td>300 kV<\/td><td>0.78<\/td><td>2.24 pm<\/td><td>1.97 pm<\/td><td>14%<\/td><\/tr><\/tbody><\/table><figcaption>אורך הגל של אלקטרון מואץ, בלי תיקון יחסותי ועם<\/figcaption><\/figure>"], ["md", "\nב-10 קילו-וולט ההנחה עוד מחזיקה, במיקרוסקופ מודרני כבר לא. וזו הנקודה של \"פנקס ההנחות\": $p^2/2m$ לא \"שגוי\", הוא מקרה גבול, והמספר $K/2m_ec^2$ אומר מתי מותר להשתמש בו.\n\n**האם אפשר לראות את האטום בלי להרוס אותו?** כאן המיקרוסקופ המחשבתי של הייזנברג פוגש את זה של רוסקה, והשאלה נוגעת ישר בתשובה של 4.4. אם האטום קיים רק מפני שהאלקטרון לא יכול להיות מקומי יותר, האם בכלל אפשר להסתכל פנימה? כדי להבחין בפרט בגודל $a_0$ צריך אלקטרון שאורך הגל שלו לכל היותר $a_0$, כלומר לפי (2) תנע $h/a_0$. האנרגיה שלו:\n\n$$\\frac{h^2}{2m_ea_0^2}=(2\\pi)^2\\cdot\\frac{\\hbar^2}{2m_ea_0^2}=4\\pi^2\\times13.6\\ \\text{eV}=537\\ \\text{eV}.$$\n\nזה אותו ביטוי בדיוק כמו מחיר הכליאה ב-(6), עם $h$ במקום $\\hbar$, ולכן גדול פי 40 מאנרגיית הקשר. זה לא מקרה. מה שמאפשר לראות פרט בגודל $a_0$ הוא בדיוק מה שקובע את $a_0$. כל בדיקה חדה מספיק כדי לראות את האלקטרון בתוך האטום נושאת די אנרגיה כדי לקרוע אותו משם.\n\nאיך, אם כן, מיקרוסקופים מודרניים מראים אטומים בודדים? התשובה נמצאת ב-(6) עצמה, במכנה. המיקרוסקופ לא ממקם את האלקטרון בתוך האטום; הוא ממקם את האטום כולו, את הגרעין והענן שמפזרים את האלומה. המכה שהאלומה נותנת כשהיא מאתרת עצם עד $\\Delta x$ היא אותה מכה של הייזנברג, $\\Delta p\\sim\\hbar/\\Delta x$, אבל האנרגיה שעוברת היא $(\\Delta p)^2/2M$, ו-$M$ של אטום פחמן גדולה פי 21,900 ממסת האלקטרון.\n\nנשווה את שני המחירים באותו דיוק, חצי אנגסטרום. למקם אלקטרון עד שם עולה כ-15 eV, יותר מאנרגיית הקשר שלו. למקם אטום פחמן עד שם עולה כ-0.7 meV, פחות מאנרגיית החום של החדר. אפשר לראות איפה האטומים נמצאים; אי אפשר לראות את האלקטרון \"מקיף\" בתוכם, כי אין מסלול לראות, ומי שינסה למקם אותו על מסלול יקרע אותו מהאטום. זו תשובתו של בוהר להייזנברג, בצורה הנדסית.\n\n"], ["box", "numeric", "שאלה מספרית", "מיקרוסקופ חודר עובד ב-200 kV. מהו אורך הגל של האלקטרונים, עם התיקון היחסותי? $hc=1240$ eV·nm, ו-$m_ec^2=511$ keV.\n\n<details><summary>פתרון<\/summary>\n\nנעבוד ביחידות של אנרגיה: $(pc)^2=K^2+2K\\,m_ec^2=200^2+2\\times200\\times511=244{,}400$ keV², ולכן $pc=494.4$ keV.\nאורך הגל: $\\lambda=hc/pc=1240\\ \\text{eV·nm}/494{,}400\\ \\text{eV}=2.51\\times10^{-3}$ nm, כלומר 2.51 pm.\nבראש: בלי תיקון, $1.226/\\sqrt{200{,}000}$ nm נותן 2.74 pm, והתיקון $\\sqrt{1+K/2m_ec^2}=\\sqrt{1.196}$ מקצר בכ-9%.\n- wrong: 2.74 :: זה אורך הגל בלי התיקון היחסותי.\n- wrong: 6.2 :: זה $hc/K$, אורך הגל של פוטון באנרגיה 200 keV, לא של אלקטרון.\n\n\n<\/details>"], ["md", "\n**מה מגביל בפועל: העדשות.** אורך הגל ב-200 קילו-וולט הוא 2.5 פיקומטר, אבל במשך שישים שנה הרזולוציה הטובה ביותר הייתה כמאתיים פיקומטר, פי שמונים יותר. האשמה לא הייתה בפיזיקה הקוונטית אלא בעדשות. ב-1936 הוכיח אוטו שרצר משפט שהפך לקללה של התחום: כל עדשה מגנטית עגולה, קבועה בזמן ובלי מטענים על הציר, סובלת בהכרח משגיאה כדורית <span class=\"cert\">ודאות: גבוהה<\/span>. קרניים שעוברות רחוק מהציר מתמקדות קרוב מדי, ומורחות כל נקודה לכתם שגדל כמו $C_s\\alpha^3$, כש-$C_s$, מקדם השגיאה, הוא כמילימטר בעדשה טובה.\n\nעכשיו המתכנן תקוע בין שני כוחות, ומי שקרא את 4.4 כבר מכיר את המבנה. פתח רחב מקטין את הכתם של אבה, שמתכווץ כמו $1/\\alpha$; אבל אותו פתח מנפח את השגיאה הכדורית, שגדלה כמו $\\alpha^3$. נסכם את שני הכתמים ונחפש מינימום, בדיוק כמו מחיר הכליאה מול רווח המשיכה:\n\n$$\n\\delta(\\alpha)=C_s\\alpha^3+\\frac{0.61\\,\\lambda}{\\alpha},\n\\qquad\n\\frac{d\\delta}{d\\alpha}=3C_s\\alpha^2-\\frac{0.61\\,\\lambda}{\\alpha^2}=0\n\\quad\\Longrightarrow\\quad\n\\alpha_{opt}=\\left(\\frac{0.61\\,\\lambda}{3C_s}\\right)^{1/4},\n\\qquad\n\\delta_{min}\\propto C_s^{1/4}\\lambda^{3/4}.\n$$\n\n\n"], ["viz", "chart", {"title": "הכתם של מיקרוסקופ: עקיפה מול שגיאה כדורית", "caption": "200 kV ($\\lambda=2.51$ pm), $C_s=1$ מ\"מ, בפיקומטרים, לפי זווית הפתח במיליראדיאן. הכתם של אבה יורד כמו $1/\\alpha$, השגיאה הכדורית עולה כמו $\\alpha^3$, והסכום מגיע למינימום ליד 5 מיליראדיאן: אותו מבנה כמו מחיר הכליאה מול רווח המשיכה.", "type": "line", "scope": {"Cs": 0.001, "L": 2.508e-12}, "x": {"from": 1.5, "to": 12, "step": 0.1, "label": "חצי זווית הפתח α (mrad)"}, "y": {"from": 0, "to": 1500}, "series": [{"name": "עקיפה 0.61λ/α", "expr": "0.61*L/(x*1e-3)*1e12"}, {"name": "שגיאה כדורית Cₛα³", "expr": "Cs*(x*1e-3)^3*1e12"}, {"name": "הסכום", "expr": "0.61*L/(x*1e-3)*1e12 + Cs*(x*1e-3)^3*1e12"}], "yLabel": "גודל הכתם (pm)"}], ["md", "\n(ה-0.61 הוא המקדם של כתם ההתאבכות של עדשה עגולה, במקום ה-0.5 של הסריג.) נציב מספרים של מיקרוסקופ רגיל: 200 קילו-וולט ומקדם שגיאה של מילימטר. הפתח האופטימלי יוצא כ-5 מיליראדיאן, והכתם כ-0.43 ננומטר.\n\nהנוסחה המקובלת של שרצר, שמאזנת את השגיאה בעזרת כיול מכוון של המיקוד ולא סתם מחברת כתמים, נותנת 0.23 ננומטר. הפער הוא פקטור 2 במקדם, לא בחזקות, וזה בדיוק מה שאומדן כזה טוב בו ומה שהוא לא טוב בו.\n\nוהחזקות הן הלקח למתכנן. כדי לשפר את הרזולוציה פי 2 בעזרת העדשה צריך להקטין את $C_s$ פי 16, משימה כמעט בלתי אפשרית בליטוש. הקטנה של אורך הגל עובדת טוב יותר, ולכן במשך עשורים התחום העלה מתח, עד מיקרוסקופים של מיליון וולט בגובה של בניין <span class=\"cert\">ודאות: בינונית<\/span>. את המשפט של שרצר שברו רק כשהפסיקו לקבל את ההנחה שלו: מתקן שאינו עגול הוצע בידי שרצר עצמו כבר ב-1947, וגרסה מעשית שלו, עם שני רכיבים בעלי שישה קטבים מגנטיים, נבנתה בידי היידר, רוז ואורבן ב-1998, כשמחשבים יכלו לכוון אותה <span class=\"cert\">ודאות: גבוהה<\/span>. מהנדס שקורא משפט אי-אפשרות מחפש את ההנחה שאפשר לשבור. היום הרזולוציה הטובה היא כחמישים פיקומטר, והגבול הבא הוא שגיאה כרומטית, הפיזור הקטן באנרגיית האלקטרונים <span class=\"cert\">ודאות: בינונית<\/span>.\n\n**המחיר: נזק לדוגמה.** העלאת המתח, שנראתה כמו הפתרון, נתקלת במגבלה אחרת. האלומה לא רק מתפזרת; היא גם פוגעת. אלקטרון שפוגע חזיתית בגרעין מעביר לו חלק מהאנרגיה שלו, וכמה בדיוק קובעים שימור התנע ושימור האנרגיה. בהתנגשות חזיתית אלסטית, אלקטרון במהירות $v$ שפוגע בגרעין במנוחה מעביר לו, בגבול הלא-יחסותי:\n\n$$\nV=\\frac{2m}{m+M}\\,v\n\\qquad\\Longrightarrow\\qquad\nE_T=\\tfrac12MV^2=\\frac{4mM}{(m+M)^2}\\cdot\\tfrac12mv^2\\approx\\frac{4m}{M}\\,K .\n$$\n\nכלומר אלקטרון מעביר לגרעין כבד חלק זעיר מהאנרגיה שלו, ארבע פעמים יחס המסות. במהירויות של מיקרוסקופ צריך שוב את הגרסה היחסותית, $E_{max}=2K(K+2m_ec^2)/Mc^2$, שבמהירות נמוכה חוזרת ל-$4mK/M$:\n\n$$E_{max}=\\frac{2K\\,(K+2m_ec^2)}{Mc^2}.$$\n\nלאטום פחמן, ב-80 קילו-וולט זה כ-16 eV. ב-300 קילו-וולט זה כבר כ-71 eV.\n\nהגרף מראה את המחיר הזה כפונקציה של המתח. כדאי להסתכל איפה העקומה חוצה את סף העקירה, ועל כך שהיא כמעט קו ישר: המכה גדלה בערך לינארית עם המתח.\n\n"], ["viz", "chart", {"title": "המכה המרבית לאטום פחמן לפי מתח ההאצה", "caption": "$E_{max}=2K(K+2m_ec^2)/Mc^2$ ב-eV. הקו האופקי הוא סף העקירה בגרפן, כ-21 eV; בפועל הנזק מתחיל כבר סביב 80 kV, כי האטומים רועדים מחום.", "type": "line", "scope": {"me": 511, "Mc": 11177.93}, "x": {"from": 20, "to": 300, "step": 2, "label": "מתח ההאצה (kV)"}, "series": [{"name": "המכה המרבית", "expr": "2*x*(x+2*me)/Mc"}, {"name": "סף העקירה", "expr": "21 + 0*x"}], "yLabel": "eV"}], ["md", "\nאטום פחמן בגרפן נעקר מהסריג כשהוא מקבל כ-20 eV <span class=\"cert\">ודאות: בינונית<\/span>, ולכן מעל כ-80 קילו-וולט האלומה מנקבת את הדוגמה. חוקרי גרפן עובדים ב-60 עד 80 קילו-וולט, ומוותרים על חלק מאורך הגל.\n\nבדוגמאות ביולוגיות הנזק הוא בעיקר שבירת קשרים כימיים, של כמה eV כל אחד, ולכן מצלמים אותן בקירור עמוק ובמעט מאוד אלקטרונים (קריו-מיקרוסקופיה, נובל 2017) <span class=\"cert\">ודאות: גבוהה<\/span>.\n\nואולי פוטונים היו עדיפים? לפוטון האנרגיה היא $pc$, ולאלקטרון איטי $p^2/2m$, ולכן באותו אורך גל היחס ביניהם הוא $2m_ec^2/pc$. ב-12 פיקומטר לפוטון יש 101 keV, פי 10 מהאלקטרון באותו גל. המסה של האלקטרון, שהופכת את (2) ל\"זולה\" עבורו, היא היתרון שלו. המיקרוסקופ האמיתי מנצל את אותו $m$ במכנה שקבע את גודל האטום.\n\n"], ["box", "casestudy", "מקרה בוחן: מקרה בוחן: איזה מיקרוסקופ יצלם את הגרפן? חישוב של מהנדס", "**השאלה ההנדסית.** קבוצת מחקר רוצה לצלם את סריג הגרפן אטום-אטום, בלי לנקב אותו. זו לא שאלה של \"איזה מיקרוסקופ הכי טוב\" אלא של שתי דרישות שמושכות לכיוונים הפוכים, וכל מה שגזרנו בפרק נכנס אליהן. נעבור על החישוב כמו שמהנדס עושה אותו, מהדרישה ועד ההחלטה.\n\n**הדרישה הראשונה: מה צריך לראות.** בגרפן המרחק בין שני אטומי פחמן שכנים הוא 1.42 Å <span class=\"cert\">ודאות: גבוהה<\/span>. כדי לראות את הטבעות המשושות, התמונה צריכה להפריד בין שורות האטומים הצפופות ביותר, שהמרווח ביניהן הוא 1.23 Å. זה היעד: רזולוציה טובה מ-1.2 Å בערך.\n\n**הדרישה השנייה: לא לנקב.** אטום פחמן נעקר מהסריג כשהוא מקבל כ-21 eV <span class=\"cert\">ודאות: בינונית<\/span>. לפי הנוסחה של המכה החזיתית, נמצא את המתח שבו האלקטרון מעביר בדיוק 21 eV:\n\n$$E_{max}(K)=\\frac{2K\\,(K+2m_ec^2)}{Mc^2}=21\\ \\text{eV}\\quad\\Longrightarrow\\quad K\\approx104\\ \\text{keV}.$$\n\n**הפער בין המודל למדידה.** בניסויים הנזק מתחיל כבר סביב 80–86 קילו-וולט <span class=\"cert\">ודאות: בינונית<\/span>, ולא ב-104. ההסבר הוא ההנחה שרשמנו בשקט: \"גרעין במנוחה\". אטום בסריג רועד מחום, וכשהוא נע לקראת האלקטרון, המכה גדלה. מהנדס לוקח מכאן כלל עבודה: עובדים מתחת ל-80 קילו-וולט, עם מרווח ביטחון.\n\n**שלוש אפשרויות, ואיפה כל אחת נשברת.** נחשב לכל מכשיר את שלושת המספרים שקובעים: אורך הגל, האנרגיה המרבית שהוא מעביר לפחמן, והרזולוציה שהעדשות מאפשרות. הרזולוציה של מכשיר בלי מתקן היא הנוסחה של שרצר, $0.66\\,C_s^{1/4}\\lambda^{3/4}$, עם $C_s$ של מילימטר.\n\n"], ["md", "\n"], ["raw", "<figure><table><thead><tr><th>המכשיר<\/th><th>λ<\/th><th>מכה מרבית לפחמן<\/th><th>רזולוציה לפי העדשה<\/th><th>מה נשבר<\/th><\/tr><\/thead><tbody><tr><td>300 kV, בלי מתקן<\/td><td>1.97 pm<\/td><td>71 eV<\/td><td>≈ 2.0 Å<\/td><td>מנקב את הדוגמה, ועדיין לא רואה 1.23 Å<\/td><\/tr><tr><td>80 kV, בלי מתקן<\/td><td>4.18 pm<\/td><td>16 eV<\/td><td>≈ 3.4 Å<\/td><td>בטוח לדוגמה, אבל עיוור לסריג<\/td><\/tr><tr><td>80 kV, עם מתקן שגיאה כדורית<\/td><td>4.18 pm<\/td><td>16 eV<\/td><td>≈ 0.9 Å (מצד השגיאה הכדורית)<\/td><td>השגיאה הכרומטית הופכת לגבול<\/td><\/tr><\/tbody><\/table><figcaption>שלוש דרכים לצלם גרפן: החישוב<\/figcaption><\/figure>"], ["md", "\n"], ["box", "casestudy", "מקרה בוחן: מקרה בוחן, המשך: הגבול שנחשף", "**הגבול הבא.** האפשרות השלישית נראית כמו פתרון, וכאן מתגלה מה שמהנדס מחפש תמיד: כשמסירים מגבלה אחת, מי תופסת את מקומה? האלקטרונים במקור אינם באנרגיה אחת בדיוק. יש ביניהם פיזור קטן, $\\Delta E$, של כשליש eV במקור טוב, ועדשה ממקדת אלקטרון איטי מעט יותר קרוב. זו **השגיאה הכרומטית** (chromatic aberration), שגדלה עם המקדם שלה $C_c$ ועם היחס $\\Delta E/E$. אפשר לתאר אותה כפיזור של נקודת המוקד, $\\Delta=C_c\\,\\Delta E/E$, והיא מטשטשת פרטים קטנים מ:\n\n$$d_{info}\\approx\\sqrt{\\frac{\\pi\\,\\lambda\\,\\Delta}{2}}.$$\n\n**למה דווקא במתח נמוך.** היחס $\\Delta E/E$ גדל כשהמתח יורד, כי אותו פיזור של שליש eV הוא חלק גדול יותר מאנרגיה קטנה. כלומר אותה החלטה שהגנה על הדוגמה, מתח נמוך, היא זו שמנפחת את השגיאה הכרומטית. ב-80 קילו-וולט, עם $C_c$ של מילימטר וחצי, הגבול יוצא כ-2.1 Å. הסריג עדיין לא נראה.\n\n**שתי דרכים לצאת, ולמה בחרו בשתיהן.** הדרך הראשונה היא להקטין את $\\Delta E$: מסנן אנרגיה (מונוכרומטור) שמוריד אותו לעשירית eV ומביא את הגבול לכ-1.1 Å, במחיר של זרם נמוך יותר, כלומר פחות אלקטרונים לפיקסל ורעש גדול יותר (4.6). הדרך השנייה היא לתקן גם את $C_c$, משימה קשה בהרבה; מכשיר כזה, שנבנה במסגרת פרויקט SALVE באולם, מוריד את הגבול לפחות מחצי אנגסטרום גם ב-20 עד 80 קילו-וולט <span class=\"cert\">ודאות: בינונית<\/span>. בפועל, הצילומים הראשונים של סריג גרפן אטום-אטום, מסוף העשור הראשון של המאה, נעשו ב-80 קילו-וולט במכשירים עם מתקן לשגיאה הכדורית ומקור בפיזור אנרגיה נמוך <span class=\"cert\">ודאות: בינונית<\/span>.\n\n**מה זה אומר להחלטה.** הבחירה אינה \"המכשיר החד ביותר\". היא שרשרת: מגבלת הנזק קובעת את המתח; המתח קובע את אורך הגל ואת חומרת השגיאה הכרומטית; ואלה קובעים אילו מתקנים חייבים לקנות. מכשיר של 300 קילו-וולט, המהיר והחד ביותר על הנייר, הוא הבחירה השגויה כאן. אותו חשבון, עם סף נזק של כמה eV בלבד, הוא מה שמכתיב לקריו-מיקרוסקופיה של חלבונים לעבוד במנה זעירה של אלקטרונים, וזה מה שנחשב בסעיף הבא.\n"], ["md", "\n### 4.6 מה שהתמונה לא תגיד: הסתברות, ואיינשטיין שלא קיבל אותה\n\nבתמונה של מעט אלקטרונים, תמונה במיקרוסקופ אינה תמונה אלא ענן של נקודות. ב-1989 הראו אקירה טונומורה ועמיתיו בהיטאצ'י מה זה אומר. הם שינו מיקרוסקופ אלקטרונים כך שאלומה חלשה מאוד עוברת \"דו-מנסרה\" אלקטרונית, חוט טעון דק שמפצל את הגל לשניים, ושלחו את האלקטרונים אחד-אחד <span class=\"cert\">ודאות: גבוהה<\/span>. כל אלקטרון פגע במסך בנקודה אחת, במקום שאי אפשר היה לנבא. רק אחרי אלפים הצטיירו על המסך פסי התאבכות של גל. כל אלקטרון הוא חלקיק כשהוא נמדד, והגל קובע רק היכן סביר שיופיע.\n\n"], ["box", "definition", "הגדרה: חיזוי הסתברותי (probabilistic prediction)", "תורה נותנת חיזוי הסתברותי כשלמצב נתון היא מנבאת לא תוצאה יחידה, אלא הסתברות לכל תוצאה אפשרית. ההסתברות נבדקת כשכיחות: חוזרים על הכנת אותו מצב פעמים רבות וסופרים.\n"], ["md", "\nזה מה שבורן הציע ב-1926, וזה מה שאיינשטיין לא קיבל. \"הוא אינו משחק בקוביות\", כתב לבורן בסוף אותה שנה <span class=\"cert\">ודאות: גבוהה<\/span>. בוועידת סולביי באוקטובר 1927 הביא כל בוקר לארוחת הבוקר ניסוי מחשבתי שאמור היה לעקוף את (3), ובוהר מצא את הפגם עד הערב <span class=\"cert\">ודאות: בינונית<\/span>. ההתנגדות של איינשטיין לא הייתה עקשנות של זקן; היא הייתה ההצעה הטבעית. אולי יש בתוך האלקטרון \"גלגלים\" נסתרים שקובעים היכן יפגע, והתורה פשוט לא מכירה אותם, כמו שתורת הגזים לא מכירה כל מולקולה. במשך שלושים שנה זו נחשבה שאלה פילוסופית, עד שג'ון בל הראה ב-1964 שהיא ניתנת לבדיקה. הניסויים שזכו בנובל ב-2022 שללו את הסוגים הפשוטים של גלגלים כאלה <span class=\"cert\">ודאות: גבוהה<\/span>.\n\n**מה האקראיות עולה למתכנן.** לפילוסופים זו שאלה על טבע המציאות; למי שבונה מיקרוסקופ זו שורה בתקציב. אם כל אלקטרון נוחת במקום אקראי, אז מספר האלקטרונים שנוחתים בפיקסל אחד משתנה מתמונה לתמונה, גם כשהדוגמה זהה. כמה הוא משתנה?\n\nנניח שנשלחים $n$ אלקטרונים, ולכל אחד יש סיכוי קטן $q$ לנחות בפיקסל מסוים, בלי קשר לאחרים. כל אלקטרון תורם לספירה 1 בסיכוי $q$ ו-0 אחרת, והפיזור בריבוע של תרומה כזו הוא $q(1-q)$. לסכום של תרומות בלתי תלויות, הפיזורים בריבוע מתחברים (M0.1):\n\n$$\n\\langle N\\rangle=nq,\\qquad\n(\\Delta N)^2=n\\,q(1-q)\\approx nq=\\langle N\\rangle\n\\qquad\\Longrightarrow\\qquad\n\\Delta N=\\sqrt{\\langle N\\rangle}.\n$$\n\nזה **רעש ירייה** (shot noise): כשסופרים אירועים אקראיים, הרעש הוא שורש הספירה. עכשיו נשאל מתי אפשר לראות פרט בניגודיות $C$, כלומר אזור שמפזר החוצה חלק $C$ מהאלקטרונים ולכן נראה כהה יותר. ההבדל בין הפיקסלים הוא $CN$, והרעש בכל אחד מהם הוא $\\sqrt N$:\n\n$$\\text{SNR}=\\frac{C\\,N}{\\sqrt N}=C\\sqrt N .$$\n\nאלברט רוז, שתכנן שפופרות טלוויזיה ב-RCA, מצא בשנות ה-40 שעין אנושית מזהה פרט רק כשיחס האות לרעש הוא לפחות כ-5 <span class=\"cert\">ודאות: בינונית<\/span>. מכאן כמה אלקטרונים צריך בכל פיקסל:\n\n$$N\\ge\\frac{25}{C^2}.$$\n\nבגרף, כל קו הוא ניגודיות אחרת. מה שכדאי לראות הוא כמה מהר המחיר עולה: כדי לחצות את הקו של 5 בניגודיות של 5%, צריך פי 4 אלקטרונים מאשר ב-10%.\n\n"], ["viz", "chart", {"title": "יחס אות לרעש לפי מספר האלקטרונים בפיקסל", "caption": "$\\text{SNR}=C\\sqrt N$ לשלוש ניגודיות. הקו האופקי הוא קריטריון רוז, 5. הנקודות שבהן הקווים חוצים אותו הן $25/C^2$: 625, 2,500 ו-10,000.", "type": "line", "scope": {}, "x": {"from": 0, "to": 12000, "step": 50, "label": "אלקטרונים לפיקסל N"}, "series": [{"name": "C = 20%", "expr": "0.2*sqrt(x)"}, {"name": "C = 10%", "expr": "0.1*sqrt(x)"}, {"name": "C = 5%", "expr": "0.05*sqrt(x)"}, {"name": "קריטריון רוז", "expr": "5 + 0*x"}], "yLabel": "SNR"}], ["md", "\nבניגודיות של 10% זה 2,500 אלקטרונים לפיקסל, ובניגודיות של 2% כבר 62,500.\n\nכאן האקראיות של בורן פוגשת את הנזק של הסעיף הקודם. דוגמה ביולוגית סובלת כ-20 עד 40 אלקטרונים לאנגסטרום רבוע לפני שהקשרים שלה נשברים <span class=\"cert\">ודאות: בינונית<\/span>. נניח פיקסל של אנגסטרום רבוע שקיבל 30 אלקטרונים. בניגודיות של 10%, יחס האות לרעש הוא כ-0.55, הרחק מתחת ל-5. המולקולה בלתי נראית בתמונה שלה עצמה.\n\nהפתרון של קריו-מיקרוסקופיה סוגר את המעגל של הפרק כולו. צריך לחזור על המדידה, אבל אי אפשר לצלם את אותה מולקולה פעמיים בלי להרוס אותה. אז מצלמים מולקולות *אחרות*, רבבות עותקים שפזורים על הרשת, ומסכמים אותם. יחס האות לרעש גדל כשורש מספר העותקים, ולכן בדוגמה שלנו מספיקים, בחשבון הגס, כמאה עותקים; בפועל, כשהניגודיות נמוכה יותר והכיוון של כל מולקולה לא ידוע, משתמשים במאות אלפים <span class=\"cert\">ודאות: בינונית<\/span>. וזה עובד רק בגלל מה שמקסוול ראה ב-1873: המולקולות זהות. \"האופי של מוצר מתועש\", שהיה החידה בפתיחת הפרק, הוא מה שמאפשר לראות אותן.\n\n**תנועה שלא נעצרת.** אותה עובדה מופיעה גם במנוחה. במינימום של 4.4 לאלקטרון יש 13.6 eV של תנועה, ולא בגלל חום. גם בגביש שמקררים עד האפס המוחלט, שבו אנרגיית החום מתאפסת, האטומים לא נעצרים, כי אטום עומד הוא אטום שמקומו ותנועתו ידועים יחד. התנועה הזו נקראת **תנודת אפס** (zero-point motion). בהליום היא גדולה כל כך ביחס למשיכה החלשה בין האטומים שלו, שבלחץ רגיל הוא לא קופא לעולם, גם באפס המוחלט <span class=\"cert\">ודאות: גבוהה<\/span>. זה אותו חשבון של (6), עם מחיר כליאה שמנצח רווח קטן מדי.\n\n"], ["box", "mcq", "שאלה", "מיקרוסקופ אלקטרונים ב-80 keV מראה את אטומי הפחמן בגרפן אחד-אחד. סטודנט מסיק שבאלומה חדה יותר אפשר יהיה לצלם גם את מסלול האלקטרון סביב הגרעין. מה התשובה הנכונה?\n- נכון, צריך רק להעלות את המתח עד שאורך הגל קטן בהרבה מ-$a_0$ — *אורך הגל כבר פיקומטרים, קטן מ-$a_0$ פי מאה; הבעיה אינה כוח ההפרדה.*\n- ✅ **אין מסלול לצלם: למקם את האלקטרון בתוך האטום עולה לפי (3) יותר מאנרגיית הקשר, ואילו את האטום הכבד כולו אפשר למקם בזול, כי המחיר מחולק במסה** — אותו $\\hbar^2/2mr^2$, עם מסה גדולה פי 21,900.\n- הבעיה היא השגיאה הכדורית; אחרי תיקון שלה המסלול ייראה — *התיקון מביא את הרזולוציה לעשרות פיקומטרים, אבל לא משנה את (3).*\n- אי אפשר, כי המכה של האלומה מזיזה את האלקטרון, ואילו היינו מודדים בעדינות היינו רואים את המסלול — *זו התמונה ש\"המדידה מפריעה\"; הפיזורים מקיימים את (3) גם בלי שום מכה, כי אין לאלקטרון מקום ותנע מוגדרים יחד.*\n"], ["md", "\n"], ["box", "numeric", "שאלה מספרית", "לפי קריטריון רוז, כמה אלקטרונים לפיקסל צריך כדי לראות פרט בניגודיות של 20%?\n\n<details><summary>פתרון<\/summary>\n\n$N\\ge25/C^2=25/0.04=625$.\nבראש: ניגודיות כפולה (מ-10% ל-20%) מקטינה את המספר פי 4, מ-2,500 ל-625.\n- wrong: 1250 :: חילקתם ב-2 ולא ב-4; המספר תלוי בריבוע הניגודיות.\n- wrong: 125 :: שכחתם להעלות את הניגודיות בריבוע ($25/0.2$).\n\n\n<\/details>"], ["md", "\n### 4.7 אותו מחיר, בקנה מידה אחר\n\nהתשובה לשאלת הפרק עומדת על שני מספרים, $\\hbar$ ומסה, ולכן היא עובדת גם במקומות שבוהר לא יכול היה להגיע אליהם. עוצמת המשיכה עצמה, $ke^2$, היא מספר קטן בקנה המידה הקוונטי. היחס\n\n$$\\alpha=\\frac{ke^2}{\\hbar c}=\\frac{1}{137.036}$$\n\nנקרא **קבוע המבנה הדק** (fine-structure constant). ראינו אותו ב-4.4 כמהירות האלקטרון במימן ביחידות של $c$, ולכן האומדן הלא-יחסותי עבד כל כך טוב. התורה המלאה של אור ומטענים לפי עקרונות הקוונטים, **אלקטרודינמיקה קוונטית** (QED), נבנתה מדיראק ב-1928, שניבא בדרך את הפוזיטרון שאנדרסון מצא ב-1932, ועד פיינמן, שווינגר וטומונגה בסוף שנות ה-40. היא מכילה את החוקים של הכימיה כולה, ולא נמצאה לה סתירה מחוץ לגרעין <span class=\"cert\">ודאות: גבוהה<\/span>.\n\nובתוך הגרעין? נפעיל את אותו מחיר כליאה, $\\hbar^2/2Mr^2$, על פרוטון שכלוא בתוך פמטומטר, $10^{-15}$ מטר. נאמוד בראש ממה שכבר יש לנו. לאלקטרון באנגסטרום המחיר הוא 3.81 eV. מרחק קטן פי $10^5$ מגדיל אותו פי $10^{10}$, ומסה גדולה פי 1836 מקטינה אותו:\n\n$$3.81\\ \\text{eV}\\times\\frac{10^{10}}{1836}\\approx2\\times10^{7}\\ \\text{eV}=20.7\\ \\text{MeV}.$$\n\nזה פי מיליון וחצי מאנרגיית המימן. כדי שגרעין יחזיק, צריך כוח שהרווח שלו עומד במחיר הזה, וזה מה שהחשמל לא יכול לספק: בין שני פרוטונים בפמטומטר הוא בכלל דוחה. מכאן הפרק הבא.\n\n"], ["box", "keep", "לסיכום", "עבודה: $w=Fd$ לכוח קבוע לאורך הדרך, $dw=F\\,dx$ לכוח משתנה; ביחידות ג'אול.\nאנרגיה קינטית: $K=\\tfrac12mv^2=p^2/2m$, תקף כשהמהירות קטנה בהרבה מ-$c$.\nאנרגיה פוטנציאלית: $F=-dU/dr$; לקולון $U=-ke^2/r$ עם אפס באינסוף; $E=K+U$ נשמרת, ומצב קשור הוא $E<0$.\nאלקטרון-וולט: $1\\ \\text{eV}=1.602\\times10^{-19}$ J; $ke^2=14.40$ eV·Å.\nאנרגיית הפוטון: $E=hf=hc/\\lambda$, עם $hc=1240$ eV·nm.\nאורך הגל של חלקיק: $\\lambda=h/p$; לתנע במהירות גבוהה $p=\\sqrt{2mK(1+K/2mc^2)}$.\nפיזור: $\\Delta x=\\sqrt{\\langle(x-\\langle x\\rangle)^2\\rangle}$, ו-$(\\Delta x)^2=\\langle x^2\\rangle-\\langle x\\rangle^2$.\nעקרון אי-הוודאות: $\\Delta x\\,\\Delta p\\ge\\hbar/2$ לכל מצב, בכל כיוון.\nרדיוס בוהר ואנרגיית הקשר: $a_0=\\hbar^2/m_eke^2=0.529$ Å, $E=-ke^2/2a_0=-13.6$ eV, מהמינימום של $\\hbar^2/2mr^2-ke^2/r$.\nהגבול של אבה: $d_{min}=\\lambda/(2n\\sin\\alpha)$ לכל הדמיה בגלים דרך עדשה.\nרעש ירייה: $\\Delta N=\\sqrt N$ בספירת אירועים אקראיים; $\\text{SNR}=C\\sqrt N$, ולזיהוי $N\\ge25/C^2$.\n"], ["md", "\nהפרק הבא ייכנס לגרעין, ויחפש את הכוח שמשלם 20 MeV.\n"]];
