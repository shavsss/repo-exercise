<title>דוח בוקר, 1.11</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column, a summary strip, then sections; tables scroll inside their own box. */
:root {
  --bg: #f6f4ef; --paper: #fffdf8; --fg: #23251f; --muted: #5d6157; --rule: #d9d5c9;
  --accent: #4f6b3a; --ok: #2f6b3a; --warn: #8a5a12; --bad: #9a2f22;
  --display: "Frank Ruhl Libre", "David", serif; --body: "Assistant", "Arial Hebrew", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1c1e1a; --paper: #24271f; --fg: #e4e2da; --muted: #a8ab9f; --rule: #3a3d34;
  --accent: #a3bf86; --ok: #8cc58f; --warn: #e0b060; --bad: #f08b7c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1c1e1a; --paper: #24271f; --fg: #e4e2da; --muted: #a8ab9f; --rule: #3a3d34;
  --accent: #a3bf86; --ok: #8cc58f; --warn: #e0b060; --bad: #f08b7c; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 17px/1.7 var(--body); }
main { max-width: 760px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 700 2.1rem/1.2 var(--display); margin: 0 0 4px; text-wrap: balance; }
h2 { font: 700 1.35rem/1.3 var(--display); margin: 40px 0 10px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 24px; }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0 8px; }
.strip div { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.strip b { display: block; font: 700 1.5rem/1.2 var(--display); font-variant-numeric: tabular-nums; }
.strip span { color: var(--muted); font-size: .9rem; }
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; font-variant-numeric: tabular-nums; }
th, td { text-align: start; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: .85rem; }
tr:last-child td { border-bottom: 0; }
.pill { display: inline-block; font-size: .8rem; font-weight: 600; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
figure { margin: 16px 0; } figure img { width: 100%; border: 1px solid var(--rule); border-radius: 8px; display: block; }
figcaption { color: var(--muted); font-size: .9rem; margin-top: 6px; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: .88em; }
ul { padding-inline-start: 1.2em; } li { margin: 4px 0; }
</style>
<main dir="rtl" lang="he">
<h1>מה מוכן הבוקר</h1>
<p class="sub">{{SUB}}</p>
{{BODY}}
</main>
